d Alina, Julia (who married a Katka), John Hubert, Matt, and Innes; two of his sons were military veterans.","He outlived his wife by ten years, dying in 1949, and rests at Grand River Cemetery among the colony he helped build.","Family memory (Grandma Anna, 2026): the Jernberg place was north of the highway near the Short Pines, Harding County, SD. The cemetery sits out in a pasture with a long driveway; the landowner asks for a heads-up before visits."],"src":["Earlier family tree research notes","Phone call with Grandma Anna Kenoyer, Oct 12 2026"],"by":1873,"dy":1949,"rl":"Peyton's 2nd great-grandfather","ln":"koski","dir":1,"cem":"grandriver"},{"id":"annaherr","n":"Anna (Herrala) Jernberg","sx":"F","s":"kenoyer","g":4,"pa":["manuelh","johannah"],"sp":["johnjern"],"ch":["alinak","jernberg_john","jernberg_aino","jernberg_matt"],"b":["1880",""],"d":["1939",""],"bu":["","Grand River Cemetery, Harding, South Dakota, USA"],"kf":{"Born":"1880","Parents":"Manuel and Johanna Herrala","Husband":"John Jernberg","Buried":"Grand River Cemetery, Harding County, SD"},"f":["Anna Herrala, born 1880 to Manuel and Johanna Herrala, raised her family on the Harding County homestead.","Herrala is a Finnish place surname, from Herrala in southern Finland.","Her name has now traveled the generations: Anna Herrala to her granddaughter Anna Koski, who is Peyton's grandma Anna Kenoyer, who confirmed this very line by text message at one in the morning.","She died in 1939 at about 59 and rests at Grand River Cemetery beside John and her parents."],"src":["Earlier family tree research notes"],"by":1880,"dy":1939,"rl":"Peyton's 2nd great-grandmother","ln":"koski","dir":1,"cem":"grandriver"},{"id":"manuelh","n":"Manuel Herrala","sx":"M","s":"kenoyer","g":5,"pa":[],"sp":["johannah"],"ch":["annaherr"],"b":["1852","Finland"],"d":["2 Feb 1924",""],"bu":["","Grand River Cemetery, Harding, South Dakota, USA"],"kf":{"Born":"1852, Finland","Wife":"Johanna","Buried":"Grand River Cemetery, Harding County, SD"},"f":["Manuel Herrala, born 1852 in Finland, is the Herrala immigrant, one of the Finns who carried the colony impulse to its furthest edge: Harding County, about as remote as Dakota homesteading ever got.","He died February 2, 1924 at about 71.","He and Johanna, born the same year, died the same year too, ten weeks apart, and rest together at Grand River Cemetery.","He is the deepest confirmed root on Peyton's mother's side, born the same decade as Erick Kangas on his father's side and the Pellikka patriarch on Tawni's."],"src":["Earlier family tree research notes"],"by":1852,"dy":1924,"rl":"Peyton's 3rd great-grandfather","ln":"koski","dir":1,"cem":"grandriver"},{"id":"johannah","n":"Johanna Herrala","sx":"F","s":"kenoyer","g":5,"pa":[],"sp":["manuelh"],"ch":["annaherr"],"b":["1852","Finland"],"d":["13 Apr 1924",""],"bu":["","Grand River Cemetery, Harding, South Dakota, USA"],"kf":{"Born":"1852, Finland","Husband":"Manuel Herrala","Buried":"Grand River Cemetery, Harding County, SD"},"f":["Johanna, born 1852 in Finland like her husband, crossed the ocean and ended on the shortgrass prairie of Harding County.","She followed Manuel in death by just ten weeks in the spring of 1924, a pattern this family repeats: Arvo and Alina Koski also died within months of each other in 1987.","She rests beside Manuel at Grand River Cemetery."],"src":["Earlier family tree research notes"],"by":1852,"dy":1924,"rl":"Peyton's 3rd great-grandmother","ln":"koski","dir":1,"cem":"grandriver"},{"id":"charles","n":"Charles Peter Smith","sx":"M","s":"smith","g":2,"pa":["eddie","esther"],"sp":["joanne"],"ch":["keith","michaelsmith","tamarasmith","scottsmith","autumnsmith","rogersmith","sonjasmithhomola","waynesmith"],"b":["20 Apr 1932","Erwin, Kingsbury, South Dakota, USA"],"d":["13 Mar 2025",""],"bu":["","Old Apostolic Lutheran Church, Lake Norden, Hamlin, South Dakota, USA"],"kf":{"Born":"Rural Erwin, SD","Parents":"Eddie and Esther (Berger) Smith","Married":"Audrey Joanne Johnson, June 2, 1956","Children":"Eight","Buried":"Old Apostolic Lutheran Church, Lake Norden"},"f":["Charles was born at rural Erwin, South Dakota on April 20, 1932 to Eddie and Esther (Berger) Smith, one of at least six kids alongside Elwood, Donald, Leonard, Marvin, and Joy.","He served four years in the US Air Force, worked at Cy Jensen's gas station, then farmed until retirement, with a twelve year stretch as a substitute mail carrier on top.","On June 2, 1956 he married Audrey Joanne Johnson, and together they raised eight children on a farm in rural Hamlin County: Michael, Tamara, Scott, Autumn, Keith, Wayne, Roger, and Sonja.","A lifelong member of the Old Apostolic Lutheran Church, he stayed steadfast in his faith to the end.","In his later years he loved driving around the area visiting family and friends.","He died of natural causes on March 13, 2025 at 92, having outlived Joanne by two and a half years, his grandson Logan, granddaughter Laurel, and six great grandchildren.","Served four years in the US Air Force, worked at Cy Jensen's gas station, farmed, and was a substitute mail carrier for 12 years.","Outlived his brothers Elwood, Donald, Leonard and Marvin, his grandson Logan, granddaughter Laurel and six great-grandchildren, including Trenton Monty Smith (d. 2022)."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)","https://www.geisefuneralhome.com/obituary/charles-smith","https://www.geisefuneralhome.com/obituaries/trenton-smith"],"by":1932,"dy":2025,"rl":"Peyton's grandfather","ln":"smith","dir":1,"cem":"apostolic"},{"id":"joanne","n":"Audrey Joanne (Johnson) Smith","sx":"F","s":"smith","g":2,"pa":["edwinj","lempi"],"sp":["charles"],"ch":["keith","michaelsmith","tamarasmith","scottsmith","autumnsmith","rogersmith","sonjasmithhomola","waynesmith"],"b":["17 Jul 1934","Bryant, Hamlin, South Dakota, USA"],"d":["12 Sep 2022","Lake Norden, Hamlin, South Dakota, USA"],"bu":["","Lake Norden, Hamlin, South Dakota, USA"],"kf":{"Born":"Rural Bryant, SD","Parents":"Edwin and Lempi (Kangas) Johnson","Education":"Aberdeen Teaching College","Married":"Charles P. Smith, June 2, 1956","Buried":"Lake Norden"},"f":["Joanne was born July 17, 1934 in rural Bryant, South Dakota to Edwin and Lempi (Kangas) Johnson.","Her siblings were Alfred, Leon, Eldon, Joyce, and Jean.","Note the family pattern: her brother Alfred carried her grandfather Alfred Kangas's name, and her brother Eldon was formally Edwin, after their dad.","She graduated from Lake Norden High School, earned a teaching degree from Aberdeen Teaching College, and taught in the local country schools until she married Charles in 1956.","From then on her work was the farm and the eight kids they raised on it.","She was a member of the Old Apostolic Lutheran Church, the same Finnish Laestadian congregation her mother's family helped anchor for three generations."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)","https://www.geisefuneralhome.com/obituary/audrey-smith"],"by":1934,"dy":2022,"rl":"Peyton's grandmother","ln":"johnson","dir":1,"cem":"apostolic"},{"id":"eddie","n":"Eddie Smith","sx":"M","s":"smith","g":3,"pa":["peters","elsiec"],"sp":["esther"],"ch":["elwoodsmith","donaldsmith","leonardsmith","marvinsmith","joysmith","charles"],"b":["28 May 1899","Kingsbury, South Dakota, USA"],"d":["20 Jan 1985",""],"bu":["","Badger Cemetery, Badger, Kingsbury, South Dakota, USA"],"kf":{"Born":"May 28, 1899, Kingsbury County, SD","Parents":"Peter Christian Smith and Elsie Marie Christensen","Wife":"Esther Berger","Farmed":"Near Erwin, SD","Buried":"Badger Cemetery, Badger, SD"},"f":["Eddie was born May 28, 1899 in Kingsbury County, one of at least nine children of Peter Christian Smith and Elsie Marie Christensen; his siblings carried names like Ludolph, Martin, Carl, George, Clarence, Albert, and Mary.","The family was Danish on both sides.","He farmed near Erwin and raised six children with Esther: Charles, Elwood, Donald, Leonard, Marvin, and Joy.","His delayed birth registration, filed August 10, 1957 with the file number right before Esther's, records the day the two of them went to the courthouse together.","He died January 20, 1985 at 85 and rests at Badger Cemetery in Badger, the little Kingsbury County town at the center of the family's world.","Badger Cemetery (Kingsbury Co.) gravestone listings include \"SMITH, Eddie\" and \"SMITH, Esther A.\"","Son Donald's obituary says Donald was born on \"the family homestead near Badger\" in 1933.","Children confirmed by obituaries: Elwood, Charles, Donald, Leonard, Marvin and Joy. Son Donald alone had 11 children.","He farmed the Berger homestead after marrying Esther Berger. When the old wooden silo fell in 1954 he put up a concrete-stave silo in 1955 and \"painted his name and the date of construction on the west side of the silo\" (Berger Farmstead NRHP nomination, 2005)."],"src":["Earlier family tree research notes","https://southdakotagravestones.org/cemetery.php?cemID=156","https://www.madisondailyleader.com/obituaries/archives/article_1a8d43a6-93c8-57f4-abd6-796bce2dc2c4.html","https://www.geisefuneralhome.com/obituary/charles-smith","https://npgallery.nps.gov/GetAsset/00005b2f-b57b-43f5-9f9c-f9f7cca776d0"],"by":1899,"dy":1985,"rl":"Peyton's great-grandfather","ln":"smith","dir":1,"cem":"badger"},{"id":"esther","n":"Esther Anna (Berger) Smith","sx":"F","s":"smith","g":3,"pa":["henryb","thea"],"sp":["eddie"],"ch":["charles","elwoodsmith","donaldsmith","leonardsmith","marvinsmith","joysmith"],"b":["8 Oct 1904","Kingsbury, South Dakota, USA"],"d":["15 May 2004",""],"bu":["","Badger Cemetery, Badger, Kingsbury, South Dakota, USA"],"kf":{"Born":"October 8, 1904, Kingsbury County, SD","Parents":"Henry Christian Berger and Thea Anderson","Husband":"Eddie Smith","Buried":"Badger Cemetery, Badger, SD"},"f":["Esther was born October 8, 1904 in Kingsbury County to Henry Christian Berger, of German stock, and Thea Anderson, of Danish stock.","Her mother died in 1917 when Esther was only twelve, leaving Henry with the family.","She married Eddie Smith and raised their six children on the farm near Erwin.","She outlived Eddie by nineteen years and lived to see the year 2000, dying May 15, 2004 at 99 years old, five months short of a century that began with horse-drawn plows and ended with the internet.","She rests beside Eddie at Badger Cemetery.","Recorded as \"Esther A. Berger\" and \"Esther Berger\" as the mother on her sons' Social Security claims.","Gravestone listed at Badger Cemetery as \"SMITH, Esther A.\"","The farm she grew up on, her grandfather Heinrich's 1883 homestead, was listed on the National Register of Historic Places in 2005 as the Berger Farmstead (also called the Smith Farmstead). Her children Marvin, Donald, Charles and Joy were among the owners named in the nomination."],"src":["Earlier family tree research notes","https://sortedbyname.com/letter_s/smith/eddie_smith_4.html","https://sortedbyname.com/letter_s/smith/index_4188.html","https://southdakotagravestones.org/cemetery.php?cemID=156","https://npgallery.nps.gov/GetAsset/00005b2f-b57b-43f5-9f9c-f9f7cca776d0"],"by":1904,"dy":2004,"rl":"Peyton's great-grandmother","ln":"smith","dir":1,"cem":"badger"},{"id":"peters","n":"Peter Christian Smith","sx":"M","s":"smith","g":4,"pa":["laurst","elsemarie"],"sp":["elsiec"],"ch":["ludolphsmithpc","martinsmithpc","carlsmithpc","georgesmithpc","clarencesmithpc","albertsmithpc","marysmithpc","eddie"],"b":["24 Aug 1869","Denmark"],"d":["30 Jul 1939",""],"bu":["","Danish Lutheran Cemetery, Badger, Kingsbury County, South Dakota, USA"],"kf":{"Born":"1869, Denmark","Parents":"Laurst Pedersen and Else Marie Madsen","Wife":"Elsie Marie Christensen","Name":"Born a Pedersen; became Smith in America","Buried":"Kingsbury County, SD"},"f":["Here's the answer to why the family is named Smith: Peter Christian was born a PEDERSEN in Denmark in 1869, son of Laurst Pedersen and Else Marie Madsen.","His father died when Peter was about seven.","His mother remarried, and between 1883 and 1886 she brought the family to America, settling in Hamlin County.","Somewhere in that crossing, Peter Christian Pedersen became Peter Christian Smith, a common move for Danes tired of spelling their name for Yankee clerks.","He married Elsie Marie Christensen, daughter of Kingsbury County's first settlers, and they raised at least nine children on the Kingsbury County land, including Eddie, born 1899.","His great grandson Charles carried his name: Charles Peter Smith.","Born August 24, 1869 in Denmark; died July 30, 1939. Buried at Badger, Lot 11 Grave 7 Section 8, beside Elsie (Find a Grave).","Full brother: Martin Larsen Smith (1870-1935), who also took the name Smith. Half-siblings from his mother's second marriage to Lars Dahl Madsen: Lars Smed Madson (1881-1968), Johanne Marie (1882-1893), Magnus Johannes \"John\" (1884-1921) and Martin Madson (1886-1948) (Find a Grave memorial 144983039).","On the 1897 Abbott map of Hamlin County, \"P.C. Smith\" owns the SW quarter of Sec. 18, Cleveland township, south and west of Lake Norden."],"src":["Earlier family tree research notes","https://www.findagrave.com/memorial/144983039","https://www.findagrave.com/memorial/search?firstname=Peter&lastname=Smith&birthyear=1869&deathyear=1939&location=South+Dakota","https://www.loc.gov/item/2012593118/"],"by":1869,"dy":1939,"rl":"Peyton's 2nd great-grandfather","ln":"smith","dir":1,"cem":"danish"},{"id":"elsiec","n":"Elsie Marie (Christensen) Smith","sx":"F","s":"smith","g":4,"pa":["larsc","marenk"],"sp":["peters"],"ch":["ludolphsmithpc","martinsmithpc","carlsmithpc","georgesmithpc","clarencesmithpc","albertsmithpc","marysmithpc","eddie"],"b":["23 Mar 1875","near Renner, Minnehaha County, Dakota Territory"],"d":["17 Jun 1932",""],"bu":["","Danish Lutheran Cemetery, Badger, Kingsbury County, South Dakota, USA"],"kf":{"Born":"1875, near Renner, SD","Parents":"Lars Christensen and Maren Katherene Pedersen","Husband":"Peter Christian Smith","Family":"Daughter of Kingsbury County's first settlers"},"f":["Elsie Marie was born in 1875 near Renner in southeastern Dakota Territory, and at age two her parents carried her and her little brother Chris to Kingsbury County, where, in the words recorded on her memorial, her parents Lars and Maren Christensen were the first white settlers in Kingsbury County.","She grew up with the county itself, married the Danish immigrant Peter Christian Smith, and raised at least nine children.","She died in 1932 at about 57, the same year her grandson Charles was born.","Born March 23, 1875; died June 17, 1932. Buried in the Danish Lutheran Cemetery at Badger, Lot 11 Grave 6 Section 8, next to her husband Peter in Grave 7 (Find a Grave).","Listed as \"Elsie\", 5, in the 1880 census of Badger township.","Her younger brother Albert was the first child born in Badger Township (October 15, 1878)."],"src":["Earlier family tree research notes","https://www.findagrave.com/memorial/search?firstname=Elsie&lastname=Smith&birthyear=1875&deathyear=1932"],"by":1875,"dy":1932,"rl":"Peyton's 2nd great-grandmother","ln":"smith","dir":1,"cem":"danish"},{"id":"henryb","n":"Henry Christian Berger","sx":"M","s":"smith","g":4,"pa":["henrich","annaliz"],"sp":["thea"],"ch":["esther"],"b":["5 May 1875",""],"d":["10 Feb 1940",""],"bu":["","St. Peters German Lutheran Cemetery, Badger, Kingsbury, South Dakota, USA"],"kf":{"Born":"May 5, 1875","Parents":"Henrich Berger and Anna Elizabeth Laker","Wife":"Thea Anderson","Buried":"St. Peters German Lutheran Cemetery, Badger, SD"},"f":["Henry Christian Berger was born May 5, 1875 to Henrich Berger and Anna Elizabeth Laker, a German family; the Bergers worshipped at St. Peters German Lutheran Church at Badger, and three generations of them rest in its cemetery.","He married Thea Anderson, a Danish girl from the neighboring community, and their daughter Esther was born in 1904.","Thea died young in 1917, leaving Henry a widower at 42 with children still at home.","He died February 10, 1940 at 64 and was buried beside Thea at St. He grew up on his father's Section 14 homestead (claim shack 1883) and built it out. The farmstead's Folk Victorian house dates to 1902, the garage/washhouse to 1914, the Wisconsin dairy barn to 1911, the windmill to 1912 and the granary to 1919, which still has bushel tallies carved into its walls (Berger Farmstead NRHP nomination)."],"src":["Earlier family tree research notes","https://npgallery.nps.gov/GetAsset/00005b2f-b57b-43f5-9f9c-f9f7cca776d0"],"by":1875,"dy":1940,"rl":"Peyton's 2nd great-grandfather","ln":"smith","dir":1,"cem":"stpeter"},{"id":"thea","n":"Thea (Anderson) Berger","sx":"F","s":"smith","g":4,"pa":["andrewa","josephine"],"sp":["henryb"],"ch":["esther"],"b":["9 Feb 1884",""],"d":["29 Aug 1917",""],"bu":["","St. Peters German Lutheran Cemetery, Badger, Kingsbury, South Dakota, USA"],"kf":{"Born":"February 9, 1884","Parents":"Andrew J Anderson and Josephine Anderson","Husband":"Henry Christian Berger","Buried":"St. Peters German Lutheran Cemetery, Badger, SD"},"f":["Thea Anderson was born February 9, 1884 to Andrew and Josephine Anderson, a Danish family of the Badger community whose graves lie in the Danish Lutheran Cemetery there.","She married the German Henry Berger and bore Esther in 1904.","She died August 29, 1917, just 33 years old, when Esther was twelve.","The year suggests the era's hard realities: 1917 and 1918 took many young mothers through influenza and childbirth, though her cause isn't recorded in what's public.","Peters German Lutheran Cemetery at Badger, and her daughter lived another 87 years carrying her memory."],"src":["Earlier family tree research notes"],"by":1884,"dy":1917,"rl":"Peyton's 2nd great-grandmother","ln":"smith","dir":1,"cem":"stpeter"},{"id":"laurst","n":"Laurst 'Lars' Pedersen","sx":"M","s":"smith","g":5,"pa":[],"sp":["elsemarie"],"ch":["peters","martinlarsensmith"],"b":["1824","Denmark"],"d":["1876","Denmark"],"kf":{"Born":"1824, Denmark","Died":"1876, Denmark","Wife":"Else Marie Madsen, m. 1868","Children":"Three known, including Peter Christian"},"f":["Laurst Pedersen lived and died entirely in Denmark, born 1824, married Else Marie Madsen in 1868, father of three, dead by 1876 when his son Peter was about seven.","He never saw America; America came for his children.","He is the ancestor the Smith name erased and the reason it exists: his son dropped Pedersen at the water's edge.","Find a Grave links him to Else Marie as \"Laurst 'Lars' Pedersen\", 1824-1876, married 1868 (memorial 144983039)."],"src":["Earlier family tree research notes","https://www.findagrave.com/memorial/144983039"],"by":1824,"dy":1876,"rl":"Peyton's 3rd great-grandfather","ln":"smith","dir":1},{"id":"elsemarie","n":"Else Marie Pedersen Madsen","sx":"F","s":"smith","g":5,"pa":[],"sp":["laurst","larsdahlmadsen"],"ch":["peters","martinlarsensmith","larssmedmadson","johannemmadsen","magnusjmadsen","martinmadson1886"],"b":["15 Apr 1844","Denmark"],"d":["21 Nov 1890","South Dakota, USA"],"bu":["","Scandinavian Cemetery, Bryant, Hamlin County, South Dakota, USA"],"kf":{"Born":"1844, Denmark","Married":"Laurst Pedersen 1868; widowed 1876; remarried Lars Madsen 1879","Immigrated":"Between 1883 and 1886","Settled":"Hamlin County, SD"},"f":["Else Marie Madsen is the one who made the crossing.","Widowed at about 32 with three children, she remarried in Denmark in 1879 and had four more, then between 1883 and 1886 brought the blended family across the Atlantic to Hamlin County, Dakota Territory.","She got seven years on the prairie before dying in 1890 at about 46.","Her son Peter Christian, by then a Smith, carried the family forward.","Every Smith in this tree descends from her decision to leave.","Born April 15, 1844 in Denmark; died November 21, 1890 at 46; buried in the Scandinavian Cemetery at Bryant, Hamlin County, under a stone that reads \"Mother\" (Find a Grave memorial 144983039, \"Else Marie Pedersen Madsen\").","Married Lars (Laurst) Pedersen in 1868. They had three known children, and he died in Denmark in 1876. In 1879 she married Lars Dahl Madsen, about 13 years younger, and had four more children. The family emigrated between 1883 and 1886.","NAME CHECK: Find a Grave and WikiTree file her as \"Else Marie Pedersen Madsen\", which reads as Pedersen by first marriage and Madsen by second. Her maiden name is therefore not proven. The \"Madsen\" used in this tree may be her second husband's name, not her father's."],"src":["Earlier family tree research notes","https://www.findagrave.com/memorial/144983039","https://www.wikitree.com/wiki/Pedersen-5871"],"by":1844,"dy":1890,"rl":"Peyton's 3rd great-grandmother","ln":"smith","dir":1,"cem":"scandinavian"},{"id":"larsc","n":"Lars Christensen","sx":"M","s":"smith","g":5,"pa":["christenskindhoj1804","anecathrinebech"],"sp":["marenk"],"ch":["elsiec","chrislchristensen","albertchristensen1878","parmerchristensen","annalouisechristensen","marychristensen1885"],"b":["25 Nov 1841","Snedsted parish, Hassing herred, Thisted amt, Denmark"],"d":["27 Jan 1913","Laketon Township, Brookings County, South Dakota, USA"],"bu":["","Poinsett Cemetery, Kingsbury, South Dakota, USA"],"kf":{"Born":"November 25, 1841, Snedsted, Thy, Denmark","Called":"Laust in Denmark, Lewis in Dakota","Wife":"Maren Cathrine Pedersen (first cousin)","Arrived":"East bank of Lake Albert, June 1877, first settler of Badger Township","Buried":"Poinsett Cemetery, Kingsbury County, SD"},"f":["Lars Christensen holds the biggest title in the tree: family and community memory records that he and Maren were the first white settlers in Kingsbury County, arriving around 1877 with a two year old daughter, Elsie, and infant son Chris, before Erwin, before Badger, before the railroads.","A Dane who chose empty prairie and made it home, he lived 36 years on the land he broke first, dying January 27, 1913 at 71.","He's buried at Poinsett Cemetery near the lake, in ground he settled before it had a name on any map.","Between Lars breaking Kingsbury County and Joseph Roisum's farm becoming Lake Norden, Peyton descends from the founding families of two counties.","Also called Laust Christensen in Denmark, and \"Lewis\" in Dakota. The 1880 census of Badger township lists the family as \"Lewis Christeanson\", 39, with Mary, Elsie, Christ and Albert (us-census.org transcription, ED 87).","Born November 25, 1841 in Snedsted parish in Thy. His father, the farmer Christen Christensen Skindhøj, died when Lars was two, and his mother remarried Christen Pedersen Hyldahl (gravgaard.familyds.com #18919).","He married his first cousin Maren Cathrine Pedersen (their mothers were sisters). Find a Grave gives the marriage year as 1874.","\"The first white settler in the township was Lewis Christensen, a native of Denmark, who settled on the east bank of Lake Albert, on the eastern border of the township in June 1877.\" He named Lake Thisted \"after a lake near his old home in Denmark\" (P.R. Crothers, History of Badger Township, 1925).","He and his family lived through the Hard Winter of 1880-81, the season Laura Ingalls Wilder wrote about in \"The Long Winter\". No train reached Volga from January 20 until May 6, 1881, and settlers ground wheat in coffee mills and burned twisted slough hay for heat. The Badger history records no deaths in the township (Crothers 1925).","Land: a cash patent of February 20, 1882 for 174.64 acres in Sec. 12, T112N R53W, on the east shore of Lake Albert (BLM GLO). An 1889 Lake Poinsett timber-culture patent of 159 acres in Brookings County is also in his name (thelandpatents.com), probably the same man but not confirmed.","Died January 27, 1913 in Laketon Township, Brookings County, and buried at Lake Poinsett Cemetery."],"src":["Earlier family tree research notes","https://gravgaard.familyds.com/slaegt/18919.htm","https://www.findagrave.com/memorial/33743565","http://www.solutionsandsystems.com/docs/History_of_Badger_Township.pdf","https://www.us-census.org/pub/usgenweb/census/sd/kingsbury/1880/ed087-pg156a.txt","https://thelandpatents.com/patents/sdmtaa-093153","https://thelandpatents.com/patents/sdmtaa-088958"],"by":1841,"dy":1913,"rl":"Peyton's 3rd great-grandfather","ln":"smith","dir":1,"tag":"first settler","cem":"poinsett"},{"id":"marenk","n":"Maren Katherene (Pedersen) Christensen","sx":"F","s":"smith","g":5,"pa":["pederkortegaard","elsecathrinebech"],"sp":["larsc"],"ch":["elsiec","chrislchristensen","albertchristensen1878","parmerchristensen","annalouisechristensen","marychristensen1885"],"b":["21 Apr 1843","Tingstrup, Thisted landsogn, Hundborg herred, Thisted amt, Denmark"],"d":["24 Jul 1921","Laketon Township, Brookings County, South Dakota, USA"],"bu":["","Poinsett Cemetery, Kingsbury, South Dakota, USA"],"kf":{"Born":"April 21, 1843, Denmark","Husband":"Lars Christensen","Buried":"Poinsett Cemetery, Kingsbury County, SD"},"f":["Maren Katherene crossed the ocean and then crossed the prairie with a toddler and a baby, arriving in an empty Kingsbury County around 1877 as its first settler alongside Lars.","Whatever the first winter in a claim shanty on treeless ground was like, she survived it and forty more.","She outlived Lars by eight years, dying July 24, 1921 at 78, and rests beside him at Poinsett Cemetery.","Born April 21, 1843 at Tingstrup just outside Thisted town, home-baptized May 14, 1843 and presented in Thisted church June 18, 1843, the daughter of Peder Olesen Kortegaard and Else Cathrine Larsdatter Bech (gravgaard.familyds.com #18918).","Recorded as \"Mary\", 38, in the 1880 census of Badger township.","She lost two children young: Mary in 1888 at about three and Parmer in 1895 at about 14. Both are buried at Poinsett Cemetery (Find a Grave)."],"src":["Earlier family tree research notes","https://gravgaard.familyds.com/slaegt/18918.htm","https://www.us-census.org/pub/usgenweb/census/sd/kingsbury/1880/ed087-pg156a.txt"],"by":1843,"dy":1921,"rl":"Peyton's 3rd great-grandmother","ln":"smith","dir":1,"tag":"first settler","cem":"poinsett"},{"id":"henrich","n":"Henrich 'Henry' Berger","sx":"M","s":"smith","g":5,"pa":[],"sp":["annaliz"],"ch":["henryb"],"b":["1 Mar 1840","Germany"],"d":["17 Jun 1898",""],"bu":["","St. Peters German Lutheran Cemetery, Badger, Kingsbury, South Dakota, USA"],"kf":{"Born":"March 1, 1840, Germany","Wife":"Anna Elizabeth Laker","Buried":"St. Peters German Lutheran Cemetery, Badger, SD"},"f":["Henrich Berger, born March 1, 1840 in Germany, brought the Berger name to Dakota and helped anchor the German Lutheran community at Badger.","He died June 17, 1898 at 58 and lies at St. Peters German Lutheran Cemetery, the oldest Berger in its ground.","The Bergers emigrated from Germany in 1879, spent a short time in Nebraska, and came to Badger Township in 1883. Heinrich filed on 160 acres in Section 14. On his 1883 homestead affidavit (Application No. 12445) his improvements were \"a house and eleven acres of broken land\". The house was the 12 by 16 foot claim shack that still stands (Berger Farmstead NRHP nomination, 2005).","The land was deeded to him on May 16, 1887. The NRHP nomination notes that \"the original 160-acre section remains in the same family today\".","In 2005 the Berger Farmstead, also called the Smith Farmstead, about four miles northwest of Badger, was listed on the National Register of Historic Places for its link to the settlement of Kingsbury County (NRIS 05000179).","He helped found the German Lutheran (St. Peter's) congregation organized in western Badger Township in 1889. Its church was rebuilt in 1914 (Crothers 1925)."],"src":["Earlier family tree research notes","https://npgallery.nps.gov/GetAsset/00005b2f-b57b-43f5-9f9c-f9f7cca776d0","https://npgallery.nps.gov/AssetDetail/NRIS/05000179","http://www.solutionsandsystems.com/docs/History_of_Badger_Township.pdf"],"by":1840,"dy":1898,"rl":"Peyton's 3rd great-grandfather","ln":"smith","dir":1,"cem":"stpeter"},{"id":"annaliz","n":"Anna Elizabeth (Laker) Berger","sx":"F","s":"smith","g":5,"pa":[],"sp":["henrich"],"ch":["henryb"],"b":["3 Feb 1838","Germany"],"d":["18 Jun 1925",""],"bu":["","St. Peters German Lutheran Cemetery, Badger, Kingsbury, South Dakota, USA"],"kf":{"Born":"February 3, 1838, Germany","Husband":"Henrich Berger","Buried":"St. Peters German Lutheran Cemetery, Badger, SD"},"f":["Anna Elizabeth Laker, born February 3, 1838, outlived Henrich by 27 years, dying June 18, 1925 at 87.","Born when Martin Van Buren was president, she lived to the age of radio.","She rests beside Henrich at St. Peters, the deepest documented root on the German side.","She came with Heinrich from Germany in 1879, by way of Nebraska, to the Badger Township claim in 1883, and lived to see the 1902 Folk Victorian farmhouse, the 1911 dairy barn and the 1919 granary go up on the homestead (Berger Farmstead NRHP nomination)."],"src":["Earlier family tree research notes","https://npgallery.nps.gov/GetAsset/00005b2f-b57b-43f5-9f9c-f9f7cca776d0"],"by":1838,"dy":1925,"rl":"Peyton's 3rd great-grandmother","ln":"smith","dir":1,"cem":"stpeter"},{"id":"andrewa","n":"Andrew J Anderson","sx":"M","s":"smith","g":5,"pa":[],"sp":["josephine"],"ch":["thea"],"b":["8 Nov 1849","Denmark"],"d":["8 Jun 1919",""],"bu":["","Danish Lutheran Cemetery, Badger, Kingsbury, South Dakota, USA"],"kf":{"Born":"November 8, 1849, Denmark","Wife":"Josephine","Buried":"Danish Lutheran Cemetery, Badger, SD"},"f":["Andrew J Anderson, born November 8, 1849, was part of the Danish colony at Badger; he and Josephine lie in the Danish Lutheran Cemetery there, a few miles from the German Lutheran cemetery holding their daughter Thea and her Berger in-laws.","He died June 8, 1919, having outlived Thea by two years."],"src":["Earlier family tree research notes"],"by":1849,"dy":1919,"rl":"Peyton's 3rd great-grandfather","ln":"smith","dir":1,"cem":"danish"},{"id":"josephine","n":"Josephine Anderson","sx":"F","s":"smith","g":5,"pa":[],"sp":["andrewa"],"ch":["thea"],"b":["8 Jan 1856",""],"d":["26 May 1932",""],"bu":["","Danish Lutheran Cemetery, Badger, Kingsbury, South Dakota, USA"],"kf":{"Born":"January 8, 1856","Husband":"Andrew J Anderson","Buried":"Danish Lutheran Cemetery, Badger, SD"},"f":["Josephine Anderson, born January 8, 1856, buried her daughter Thea in 1917 and her husband Andrew in 1919, then carried on another thirteen years, dying May 26, 1932 at 76.","She rests at the Danish Lutheran Cemetery at Badger."],"src":["Earlier family tree research notes"],"by":1856,"dy":1932,"rl":"Peyton's 3rd great-grandmother","ln":"smith","dir":1,"cem":"danish"},{"id":"nestor","n":"Nestor Koski","sx":"M","s":"kenoyer","g":4,"pa":[],"sp":["ainam"],"ch":["arvok","koski_arne","koski_alfred","koski_isaac","koski_matt","koski_ellyn","koski_frank"],"b":["1877","Finland"],"d":["4 Aug 1934","Custer, South Dakota, USA"],"kf":{"Born":"1877, Finland","Wife":"Aina Maria","Son":"Arvo Nestor Koski","Settled":"South Dakota"},"f":["Nestor Koski, born 1877, is the Koski immigrant, a Finn who brought the family to South Dakota.","His son carried his name as a middle name, Arvo Nestor.","He died in 1934 at about 57.","Koski means rapids, the white water of a Finnish river.","Died August 4, 1934 at Custer, South Dakota (WikiTree Koski-310).","Possible: a Nestor Koski received an 80-acre homestead patent near Gackle, Logan County, North Dakota in 1917 (BLM GLO). Gackle is the same small Finnish settlement where Tawni's great-grandparents Jacob and Lizzie Bellikka homesteaded in 1902. It may be the same man; not confirmed.","Unverified (Grandma Anna, 2026): buried in the old unkept hill cemetery south of Buffalo, Harding County, SD. Willie, Vicki, Steve and Anna have cleaned it; Willie and Vicki go most years.","Note: Grandma recalled he died at about 56 during wartime, which conflicts with the 1934 date. Needs checking."],"src":["Earlier family tree research notes","https://www.wikitree.com/wiki/Koski-310","https://thelandpatents.com/patents/ndbis-0017465","Phone call with Grandma Anna Kenoyer, Oct 12 2026"],"by":1877,"dy":1934,"rl":"Peyton's 2nd great-grandfather","ln":"koski","dir":1},{"id":"ainam","n":"Aina Maria (Vasikkaoja) Koski","sx":"F","s":"kenoyer","g":4,"pa":[],"sp":["nestor"],"ch":["arvok","koski_arne","koski_alfred","koski_isaac","koski_matt","koski_ellyn","koski_frank"],"b":["31 May 1887",""],"d":["19 Nov 1964",""],"kf":{"Husband":"Nestor Koski","Son":"Arvo Nestor Koski"},"f":["Aina Maria, wife of Nestor, mother of Arvo.","Aina is another deeply Finnish name.","Her dates and maiden name sit one record deeper than public sources reach today; her grave record is linked to Nestor's and would give both.","Maiden name Vasikkaoja, a Finnish farm name. WikiTree gives her as born May 31, 1887 and died November 19, 1964 (Koski-310). Her birthplace is shown only as \"Sweden\", possibly meaning the Swedish-speaking Torne valley; this is unconfirmed.","Unverified (Grandma Anna, 2026): buried in California. After Nestor died, her children moved to California during the war and she followed."],"src":["Earlier family tree research notes","https://www.wikitree.com/wiki/Koski-310","Phone call with Grandma Anna Kenoyer, Oct 12 2026"],"by":1887,"dy":1964,"rl":"Peyton's 2nd great-grandmother","ln":"koski","dir":1},{"id":"edwinj","n":"Edwin Joel Johnson","sx":"M","s":"smith","g":3,"pa":["johne","matilda"],"sp":["lempi"],"ch":["eldonjohnson","alfredjohnsonj","leonjohnsonj","joycejohnsonj","jeanjohnsonj","joanne"],"b":["23 Nov 1906","Braddock, Emmons, North Dakota, USA"],"d":["18 Mar 1981","Robbinsdale, Hennepin, Minnesota, USA"],"bu":["","Apostolic Cemetery, Lake Norden, Hamlin, South Dakota, USA"],"kf":{"Born":"Braddock, Emmons County, North Dakota","Parents":"John Everett Johnson and Matilda Anna Roisum","Married":"Lempi Kangas, Dec 20, 1930, Watertown, SD","Farmed":"Opdahl Township, Hamlin County","Died":"Robbinsdale, Minnesota","Buried":"Apostolic Cemetery, Lake Norden"},"f":["Edwin was born November 23, 1906 in Braddock, North Dakota, where his parents had moved to homestead after marrying in Lake Norden.","The family later returned to the Lake Norden area.","On December 20, 1930, in Watertown, he married Lempi Kangas, joining two of the area's founding Finnish families.","They farmed in Opdahl Township near Bryant and raised their children there, including Joanne, born 1934, and son Eldon, born 1932.","He died March 18, 1981 in Robbinsdale, Minnesota at 74, and was brought home to the Apostolic Cemetery in Lake Norden."],"src":["Earlier family tree research notes","https://www.geisefuneralhome.com/obituary/audrey-smith"],"by":1906,"dy":1981,"rl":"Peyton's great-grandfather","ln":"johnson","dir":1,"cem":"apostolic"},{"id":"lempi","n":"Lempi A (Kangas) Johnson","sx":"F","s":"smith","g":3,"pa":["alfred","marykurkela"],"sp":["edwinj"],"ch":["eldonjohnson","alfredjohnsonj","leonjohnsonj","joycejohnsonj","jeanjohnsonj","joanne"],"b":["15 Jan 1907","Hamlin, South Dakota, USA"],"d":["17 Aug 1995",""],"bu":["","Apostolic Cemetery, Lake Norden, Hamlin, South Dakota, USA"],"kf":{"Born":"Hamlin County, SD","Parents":"Alfred Erick Kangas and Mary Kurkela","Married":"Edwin Joel Johnson, Dec 20, 1930","Lived":"Opdahl Township, near Bryant","Buried":"Apostolic Cemetery, Lake Norden"},"f":["Lempi was born January 15, 1907 in Hamlin County, the fifth of Alfred and Mary Kangas's twelve children.","Lempi is a Finnish name meaning love.","She married Edwin Joel Johnson on December 20, 1930 in Watertown and they made their life farming in Opdahl Township near Bryant.","She named her firstborn son Edwin after her husband, and the family called him Eldon; the naming honor for her father Alfred went to another son.","She outlived Edwin by fourteen years, dying August 17, 1995 at 88, and rests beside him at the Apostolic Cemetery in Lake Norden, the same ground as her parents and grandparents.","In the 1950 census she was in Opdahl Township, Hamlin County, with children Eldon, Jo Ann, Joyce, Alfred and Jean.","Social Security death index: last residence Bryant (57221)."],"src":["Earlier family tree research notes","https://www.myheritage.com/census/us/1950census/johnson/11_8_0","https://www.locateancestors.com/lempi-a/"],"by":1907,"dy":1995,"rl":"Peyton's great-grandmother","ln":"johnson","dir":1,"cem":"apostolic"},{"id":"johne","n":"John Everett Johnson","sx":"M","s":"smith","g":4,"pa":["peterj","brita"],"sp":["matilda"],"ch":["edwinj"],"b":["18 Aug 1873","Tornio, Finland"],"d":["3 Jan 1949","Braddock, Emmons, North Dakota, USA"],"bu":["","Tell Cemetery, Tell Township, Emmons, North Dakota, USA"],"kf":{"Born":"Tornio, Finland","Parents":"Peter Johnson and Brita Jonsdotter","Married":"Matilda Roisum, Dec 26, 1900, Lake Norden","Children":"At least 13","Later":"Emmons County, ND from about 1906","Buried":"Tell Cemetery, Tell Township, ND"},"f":["Here's the twist in the Johnson line: it's Finnish too.","John was born August 18, 1873 in Tornio, a Finnish town right on the Swedish border at the top of the Gulf of Bothnia.","The family name was anglicized to Johnson in America, a common move for Finns and Swedes alike.","He immigrated to the Lake Norden Finnish colony and on December 26, 1900, the day after Christmas, married Matilda Roisum there.","Around 1906 they joined a wave of settlers heading to newly opened land in Emmons County, North Dakota, where son Edwin was born in Braddock that year.","They farmed Tell Township for decades and raised at least thirteen children."],"src":["Earlier family tree research notes"],"by":1873,"dy":1949,"rl":"Peyton's 2nd great-grandfather","ln":"johnson","dir":1,"cem":"tell"},{"id":"matilda","n":"Matilda Anna (Roisum) Johnson","sx":"F","s":"smith","g":4,"pa":["josephr","sophia"],"sp":["johne"],"ch":["edwinj"],"b":["15 Nov 1881","Lake Norden, Hamlin, South Dakota, USA"],"d":["8 Sep 1954","Braddock, Emmons, North Dakota, USA"],"bu":["","Tell Cemetery, Tell Township, Emmons, North Dakota, USA"],"kf":{"Born":"Lake Norden, SD","Parents":"Joseph Rognaldsen Roisum and Sophia Swenson","Married":"John Everett Johnson, Dec 26, 1900","Children":"At least 13","Buried":"Tell Cemetery, Tell Township, ND"},"f":["Matilda brings the Norwegian blood into the line.","She was born November 15, 1881 right in Lake Norden, making her one of the earliest children born in the new settlement, to Joseph Rognaldsen Roisum and Sophia Swenson.","Roisum is a Norwegian farm name, and Rognaldsen means son of Rognald.","She married the Finnish immigrant John Johnson at Lake Norden in 1900, and together they homesteaded in Emmons County, North Dakota, raising at least thirteen children through prairie winters that make Hamlin County look mild.","She died September 8, 1954 in Braddock and is buried beside John at Tell Cemetery."],"src":["Earlier family tree research notes"],"by":1881,"dy":1954,"rl":"Peyton's 2nd great-grandmother","ln":"johnson","dir":1,"cem":"tell"},{"id":"peterj","n":"Peter Johnson","sx":"M","s":"smith","g":5,"pa":[],"sp":["brita"],"ch":["johne"],"b":["13 Mar 1852","Finland"],"d":["10 Sep 1926",""],"kf":{"Born":"Finland region, 1852","Wife":"Brita Jonsdotter","Son":"John Everett Johnson"},"f":["Peter, father of John Everett Johnson, was born March 13, 1852.","His son was born in Tornio, Finland, placing the family in the far north of the Gulf of Bothnia, borderland country where Finnish and Swedish families mixed.","The name Johnson is the American form; the original family name may have been Juhonpoika or a Swedish patronymic.","His detailed record sits behind FamilySearch's private layer.","Finnish and Swedish parish records for the Tornio valley are well preserved and would carry this line back further."],"src":["Earlier family tree research notes"],"by":1852,"dy":1926,"rl":"Peyton's 3rd great-grandfather","ln":"johnson","dir":1},{"id":"brita","n":"Brita Jonsdotter","sx":"F","s":"smith","g":5,"pa":[],"sp":["peterj"],"ch":["johne"],"b":["25 Sep 1842",""],"d":["19 Nov 1916",""],"kf":{"Born":"1842","Husband":"Peter Johnson","Son":"John Everett Johnson"},"f":["Brita Jonsdotter, born September 25, 1842, was ten years older than her husband Peter.","Jonsdotter is a Swedish-style patronymic meaning daughter of Jon, common in the Tornio valley where Swedish naming customs ran deep even among Finnish speakers.","She lived to 74, dying in November 1916."],"src":["Earlier family tree research notes"],"by":1842,"dy":1916,"rl":"Peyton's 3rd great-grandmother","ln":"johnson","dir":1},{"id":"josephr","n":"Joseph Rognaldsen Roisum","sx":"M","s":"smith","g":5,"pa":["rognaldroisum","annehansdatter"],"sp":["sophia"],"ch":["matilda"],"b":["9 May 1850","Røisum, Leikanger parish, Sogn og Fjordane, Norway"],"d":["1936",""],"kf":{"Born":"May 9, 1850, Røisum farm, Leikanger, Sogn, Norway (baptized \"John\")","Wife":"Sophia Swenson","Daughter":"Matilda Anna Roisum","Brothers":"Hans (H.R.) and Iver Roisum, Lake Norden neighbors"},"f":["Joseph Rognaldsen Roisum was born May 9, 1850 in Norway.","Roisum is a farm name from the Sogn region of western Norway, and Rognaldsen marks him as the son of a man named Rognald.","He was in the Lake Norden area by 1881 at the latest, when his daughter Matilda was born there, twenty six years before any town existed.","That means the Roisum farm sat on or beside the future townsite.","When the South Dakota Central Railway came through in October 1907 and the town was platted in 1908, part of Lake Norden was laid out on Roisum land: family memory holds that the town began on the Roisum's Addition block, and with roughly 300 Roisums in the entire country, any Roisum on a Lake Norden plat is this family.","The plat itself sits at the Hamlin County Register of Deeds in Hayti, waiting to be copied.","Baptized in Leikanger church on May 12, 1850, three days after his birth, as plain \"John\", son of Rognald Johnsen and Anna Hansdatter of the Røisum farm (Leikanger parish register 1838-1851, p.134 no.27, Digitalarkivet). John Rognaldsen became \"Joe\" in America; his BLM land patents read \"Joe Rognaldson Roisum\".","In the 1865 Norwegian census he is John Rognaldsen, 16, on his father's Røisum farm in Leikanger on the Sognefjord. His father emigrated on a Bergen-Quebec ship in 1866.","Land: a homestead patent of September 25, 1888 for 160 acres near Lake Norden and a timber-culture patent of February 20, 1900 for 80 acres (BLM GLO via thelandpatents.com).","On the 1897 Abbott map of Hamlin County \"Joe R. Roisum\" holds the NW quarter of Sec. 20, Norden township, with a schoolhouse at its corner and the Finn church in Sec. 19. His younger brothers Iver and H.R. (Hans) Roisum own the neighboring quarter on the south shore of Lake Norden."],"src":["Earlier family tree research notes","https://www.digitalarkivet.no/en/view/255/pd00000039751215","https://www.digitalarkivet.no/en/census/person/pf01038255001388","https://thelandpatents.com/patents/sdmtaa-093666","https://thelandpatents.com/patents/sdmtaa-093869","https://www.loc.gov/item/2012593118/"],"by":1850,"dy":1936,"rl":"Peyton's 3rd great-grandfather","ln":"johnson","dir":1},{"id":"sophia","n":"Sophia Swenson","sx":"F","s":"smith","g":5,"pa":[],"sp":["josephr"],"ch":["matilda"],"b":["Jan 1851",""],"d":["11 Aug 1939",""],"kf":{"Born":"1851","Husband":"Joseph Rognaldsen Roisum","Daughter":"Matilda Anna Roisum"},"f":["Sophia Swenson, born January 1851, married Joseph Roisum and raised her family in the young Lake Norden settlement.","Swenson is Scandinavian, son of Sven, fitting the Norwegian household.","She lived to 88, dying in August 1939, one of the last of the original settler generation."],"src":["Earlier family tree research notes"],"by":1851,"dy":1939,"rl":"Peyton's 3rd great-grandmother","ln":"johnson","dir":1},{"id":"alfred","n":"Alfred Erick Kangas","sx":"M","s":"smith","g":4,"pa":["erick","briita"],"sp":["marykurkela"],"ch":["lempi"],"b":["Apr 1870","Finland"],"d":["11 Jan 1944",""],"bu":["","Apostolic Cemetery, Lake Norden, Hamlin, South Dakota, USA"],"kf":{"Born":"Finland, April 1870","Parents":"Erick Alfred Kangas and Briita Magdalena Koivu","Married":"Mary Kurkela, 1897, Brookings, SD","Children":"Twelve","Farmed":"Hamlin County","Buried":"Apostolic Cemetery, Lake Norden"},"f":["Alfred was born in Finland in April 1870, the firstborn of Erick and Briita, and crossed the Atlantic as a boy when his family joined the Finnish migration to Dakota Territory.","His seven younger siblings, Johanna, Elizabeth, Anna, Emil, Edward, Mary, and David, mostly settled the same townships.","In 1897 he married Mary Kurkela in Brookings, and over the next 24 years they had twelve children: Mildred, Frederick, Emil, Emma, Lempi, George, Edward, Ellen, Eldora, Wesley, Bernice, and Viola.","Two died as infants, and Bernice died in 1944 at just 26, the same year as her father.","Alfred farmed Hamlin County his whole adult life and died January 11, 1944 at 73.","He's buried at the Apostolic Cemetery in Lake Norden."],"src":["Earlier family tree research notes"],"by":1870,"dy":1944,"rl":"Peyton's 2nd great-grandfather","ln":"johnson","dir":1,"cem":"apostolic"},{"id":"marykurkela","n":"Mary (Kurkela) Kangas","sx":"F","s":"smith","g":4,"pa":["jacobk","annabrita"],"sp":["alfred"],"ch":["lempi"],"b":["27 Jul 1877","Haukipudas, Oulu, Finland"],"d":["19 Jun 1955","Lake Norden, Hamlin, South Dakota, USA"],"bu":["","Apostolic Cemetery, Lake Norden, Hamlin, South Dakota, USA"],"kf":{"Born":"Haukipudas, Oulu, Finland","Parents":"Jacob Kurkela and Anna Brita Hali","Married":"Alfred Kangas, 1897, Brookings","Children":"Twelve","Buried":"Apostolic Cemetery, Lake Norden"},"f":["Mary was born July 27, 1877 in Haukipudas, a coastal parish just north of Oulu, Finland, to Jacob Kurkela and Anna Brita Hali.","This is the single most precise Finnish origin point found in the whole tree: the Kurkela family can be traced in Haukipudas parish books.","She emigrated as a young woman and married Alfred Kangas in Brookings in 1897, then spent nearly fifty years raising twelve children on the Hamlin County farm and burying two of them as infants.","She outlived Alfred by eleven years, dying June 19, 1955 in Lake Norden at 77, and rests with him at the Apostolic Cemetery."],"src":["Earlier family tree research notes"],"by":1877,"dy":1955,"rl":"Peyton's 2nd great-grandmother","ln":"johnson","dir":1,"cem":"apostolic"},{"id":"erick","n":"Erick Alfred Kangas","sx":"M","s":"smith","g":5,"pa":["matti","lisa"],"sp":["briita"],"ch":["alfred"],"b":["30 Aug 1847","Finland"],"d":["10 Dec 1926","Clatsop, Oregon, USA"],"bu":["","Elim Cemetery, Brush Prairie, Clark, Washington, USA"],"kf":{"1910":"Clark County, Washington","1920":"Cleveland Township, Hamlin County","Born":"Finland, 1847","Parents":"Matti Jylhänkangas and Lisa Andersdotter","Wife":"Briita Magdalena Koivu","Children":"At least 8","Died":"Clatsop County, Oregon","Buried":"Elim Cemetery, Brush Prairie, WA"},"f":["Erick is the immigrant, the man who moved the family from Finland to Dakota.","Born August 30, 1847 to Matti Jylhänkangas and Lisa Andersdotter, he shortened the surname to Kangas in America.","An Erick Kangas is recorded as one of the builders of the 1881 Hendrickson Farm two miles west of Lake Norden, a property now on the National Register of Historic Places specifically as an example of Finnish settlement architecture.","That is almost certainly him, swinging a hammer in the settlement's very first years.","His later life had a westward chapter most of the family never took: by 1910 he and Briita were living in Clark County, Washington, in the Finnish community around Brush Prairie.","Census records show them back in Cleveland Township, Hamlin County by 1920, but Erick died December 10, 1926 in Clatsop County, Oregon, on the coast at the mouth of the Columbia."],"src":["Earlier family tree research notes"],"by":1847,"dy":1926,"rl":"Peyton's 3rd great-grandfather","ln":"johnson","dir":1,"tag":"the immigrant","cem":"elim"},{"id":"briita","n":"Briita Magdalena (Koivu) Kangas","sx":"F","s":"smith","g":5,"pa":["jacobkoivu","caisa"],"sp":["erick"],"ch":["alfred"],"b":["30 Jan 1845","Finland"],"d":["30 Dec 1929","Hamlin, South Dakota, USA"],"bu":["","Elim Cemetery, Brush Prairie, Clark, Washington, USA"],"kf":{"Born":"Finland, 1845","Parents":"Jacob Koivu and Caisa","Husband":"Erick Alfred Kangas","Children":"At least 8","Died":"Hamlin County, SD","Buried":"Elim Cemetery, Brush Prairie, WA"},"f":["Briita Magdalena Koivu was born January 30, 1845 in Finland to Jacob Koivu and his wife Caisa.","Koivu is Finnish for birch tree.","She was two years older than Erick, crossed the ocean with him, raised at least eight children on the Dakota prairie, and followed him west to Washington in their later years before returning to Hamlin County.","She died December 30, 1929 in Hamlin County at 84, three years after Erick, but was carried back to Elim Cemetery in Brush Prairie, Washington to be buried beside him.","Whatever pulled them to the Northwest held them both in the end."],"src":["Earlier family tree research notes"],"by":1845,"dy":1929,"rl":"Peyton's 3rd great-grandmother","ln":"johnson","dir":1,"cem":"elim"},{"id":"jacobk","n":"Jacob Kurkela","sx":"M","s":"smith","g":5,"pa":["abrahammaalinautio","grethakurkela"],"sp":["annabrita"],"ch":["marykurkela"],"b":["18 Oct 1843","Haukipudas, Oulu province, Finland"],"d":["6 May 1908",""],"kf":{"Born":"Finland, 1843","Wife":"Anna Brita Hali","Daughter":"Mary Kurkela","Parish":"Haukipudas, Oulu"},"f":["Jacob Kurkela, born October 18, 1843, raised his family in Haukipudas parish on the Gulf of Bothnia coast just north of Oulu.","Kurkela is a Finnish farm name.","Whether Jacob himself ever emigrated or stayed in Finland while his daughter Mary crossed over is an open question his parish records would answer.","Christened October 22, 1843 in Haukipudas as Jacob, son of the farmer Abraham \"Maalinautio\" and Gretha, aged 37 (HisKi event 469677). HisKi lists \"Maalinautio eller Kurkela\" as one farm.","Married December 28, 1873 in Haukipudas: \"farmer's son Jakob Abrahamsson Maalinautio\" and \"farmer's daughter Anna Brita Andersdotter Häli\", officiated by J.S. Laurell (HisKi, Haukipudas marriages)."],"src":["Earlier family tree research notes","https://hiski.genealogia.fi/hiski?en+0065+kastetut+8696","https://hiski.genealogia.fi/hiski?en+0065+vihityt"],"by":1843,"dy":1908,"rl":"Peyton's 3rd great-grandfather","ln":"johnson","dir":1},{"id":"annabrita","n":"Anna Brita (Häli) Kurkela","sx":"F","s":"smith","g":5,"pa":["andershali","catharinahali"],"sp":["jacobk"],"ch":["marykurkela"],"b":["28 Jan 1849","Haukipudas, Oulu province, Finland"],"d":["15 Jan 1916",""],"kf":{"Born":"Finland, 1849","Husband":"Jacob Kurkela","Daughter":"Mary Kurkela"},"f":["Anna Brita Hali, born January 28, 1849, married Jacob Kurkela and was mother to Mary, who left Haukipudas for South Dakota.","Anna Brita died in January 1916, two weeks short of her 67th birthday.","Christened February 4, 1849 in Haukipudas as \"An: Brita\", daughter of the farmer Anders Johansson Häli and Catharina, aged 31 (HisKi event 470105).","Married Jakob Abrahamsson (Maalinautio/Kurkela) December 28, 1873 in Haukipudas. Her daughter Mary was born there in 1877."],"src":["Earlier family tree research notes","https://hiski.genealogia.fi/hiski?en+0065+kastetut+9124"],"by":1849,"dy":1916,"rl":"Peyton's 3rd great-grandmother","ln":"johnson","dir":1},{"id":"matti","n":"Matti Jylhänkangas","sx":"M","s":"smith","g":6,"pa":[],"sp":["lisa"],"ch":["erick"],"b":["17 Apr 1826","Finland"],"kf":{"Born":"April 17, 1826, Finland","Wife":"Lisa Andersdotter","Son":"Erick Alfred Kangas","Surname":"Jylhänkangas, shortened to Kangas in America"},"f":["Matti Jylhänkangas, born April 17, 1826, is the oldest confirmed ancestor in the tree, a Finn born while Finland was a Grand Duchy of the Russian Empire.","The full surname Jylhänkangas roughly combines jylhä, meaning rugged or majestic, with kangas, meaning heathland or dry pine forest: rugged heath.","The name describes the kind of land the family came from.","His son Erick carried the shortened name Kangas to America.","Matti's own parents, and the exact home parish, sit one layer deeper in Finnish church books, which are extensively digitized.","This is the next door to open on the Kangas line."],"src":["Earlier family tree research notes"],"by":1826,"rl":"Peyton's 4th great-grandfather","ln":"johnson","dir":1,"tag":"oldest confirmed ancestor"},{"id":"lisa","n":"Lisa Andersdotter","sx":"F","s":"smith","g":6,"pa":[],"sp":["matti"],"ch":["erick"],"b":["8 Jan 1823","Finland"],"kf":{"Born":"January 8, 1823, Finland","Husband":"Matti Jylhänkangas","Son":"Erick Alfred Kangas"},"f":["Lisa Andersdotter was born January 8, 1823.","Her patronymic surname means daughter of Anders, so her father's name is already half known: Anders.","She married Matti Jylhänkangas and their son Erick became the family's American founder."],"src":["Earlier family tree research notes"],"by":1823,"rl":"Peyton's 4th great-grandmother","ln":"johnson","dir":1},{"id":"jacobkoivu","n":"Jacob Koivu","sx":"M","s":"smith","g":6,"pa":[],"sp":["caisa"],"ch":["briita"],"kf":{"Wife":"Caisa","Daughter":"Briita Magdalena Koivu"},"f":["Jacob Koivu is known from his daughter Briita's records.","His dates and parish are in the private layer of the Finnish records; Briita's 1845 birth record in Finland would name his farm and village."],"src":["Earlier family tree research notes"],"rl":"Peyton's 4th great-grandfather","ln":"johnson","dir":1},{"id":"caisa","n":"Caisa","sx":"F","s":"smith","g":6,"pa":[],"sp":["jacobkoivu"],"ch":["briita"],"kf":{"Husband":"Jacob Koivu","Daughter":"Briita Magdalena Koivu"},"f":["Caisa, wife of Jacob Koivu and mother of Briita, is the faintest confirmed name in the tree, recorded only by her first name, a Finnish form of Katherine.","Her full record waits in the same parish books as Jacob's."],"src":["Earlier family tree res m","martheroisum","iverroisum","andreasroisum"],"n":"Røisum, Leikanger parish, Sogn og Fjordane, Norway"},{"lat":65.176,"lon":25.353,"pp":["marykurkela","jacobk","annabrita"],"n":"Haukipudas, Oulu, Finland"},{"lat":45.631,"lon":-122.674,"pp":["spencerjohnston","cecilrotschy"],"n":"Vancouver, Clark, Washington, USA"},{"lat":44.899,"lon":-97.115,"pp":["harlynsmith","trentonsmith","brucebludorn"],"n":"Watertown, Codington, South Dakota, USA"},{"lat":44.485,"lon":-97.205,"pp":["donaldsmith","leonardsmith","albertchristensen1878"],"n":"Family homestead near Badger, Kingsbury Co., SD"},{"lat":44.364,"lon":-97.376,"pp":["edsmithlp","darwinsmith"],"n":"Lake Preston, SD"},{"lat":44.263,"lon":-104.95,"pp":["maryblakeman"],"n":"Moorcroft, WY"},{"lat":46.329,"lon":-99.096,"pp":["arthurbellikka","annabellikka","lydiabellikka"],"n":"Fredonia, Logan Co., ND"},{"lat":56.712,"lon":8.472,"pp":["christenskindhoj1804"],"n":"Boddum parish, Refs herred, Thisted amt, Denmark"},{"lat":56.903,"lon":8.439,"pp":["christenhyldahl"],"n":"Nørhå parish, Hundborg herred, Thisted amt, Denmark"},{"lat":60.951,"lon":7.105,"pp":["rognaldroisum"],"n":"Underdal, Aurland parish, Sogn og Fjordane, Norway"},{"lat":60.871,"lon":7.21,"pp":["annehansdatter"],"n":"Tufte, Aurland parish, Sogn og Fjordane, Norway"}],"hist":[{"y":1660,"t":"Huguenot exile","d":"Christian Deyo, a French Huguenot, flees to Mannheim; in 1677 he co-founds New Paltz, New York."},{"y":1861,"t":"Dakota Territory created","d":"Congress organizes Dakota Territory on March 2, 1861."},{"y":1862,"t":"Homestead Act","d":"Lincoln signs the Homestead Act on May 20, 1862: 160 acres free to anyone who lives on and improves the land for five years."},{"y":1864,"t":"Denmark loses Schleswig","d":"Defeat in the Second Schleswig War sends a wave of Danes overseas."},{"y":1866,"t":"Finland's great famine begins","d":"The famine of 1866–68 kills about 8% of Finland's people and pushes northern Finns toward America."},{"y":1873,"t":"Timber Culture Act","d":"Settlers can claim another 160 acres by planting trees on part of it."},{"y":1880,"t":"Railroad crosses Kingsbury County","d":"The Chicago & North Western builds west through Volga and De Smet."},{"y":1880,"t":"The Hard Winter","d":"October 1880 to May 1881. No train reaches Volga from January 20 to May 6. Laura Ingalls Wilder later calls it \"The Long Winter\"."},{"y":1888,"t":"The Children's Blizzard","d":"January 12, 1888. A sudden blizzard kills hundreds across the plains; Badger Township loses no one."},{"y":1889,"t":"South Dakota statehood","d":"South Dakota becomes the 40th state on November 2, 1889."},{"y":1907,"t":"Railroad reaches Lake Norden","d":"The South Dakota Central Railway arrives in October 1907; the town is platted in 1908."},{"y":1917,"t":"America enters World War I","d":"The U.S. declares war on April 6, 1917. The flu pandemic follows in 1918."},{"y":1929,"t":"The Great Depression","d":"The stock market crashes in October 1929. Drought and dust storms follow on the plains through the 1930s."},{"y":1941,"t":"World War II","d":"Pearl Harbor, December 7, 1941. Family members build aircraft, serve, and one does not come home."},{"y":1969,"t":"Western Dakota Antique Club","d":"Claris Kenoyer is a charter board member; the showgrounds east of Sturgis are his and Helen's land."},{"y":2005,"t":"Berger Farmstead on the National Register","d":"The 1883 Berger homestead, also called the Smith Farmstead, is listed on the National Register of Historic Places."}],"fam":[{"y":1866,"t":"Rognald Røisum sails for America","d":"Ship list, Bergen to Quebec, April 29, 1866.","pp":["rognaldroisum"]},{"y":1877,"t":"First settlers of Badger Township","d":"Lars and Maren Christensen settle on the east bank of Lake Albert in June 1877.","pp":["larsc","marenk"]},{"y":1878,"t":"First child born in Badger Township","d":"Albert Christensen, October 15, 1878.","pp":["albertchristensen1878"]},{"y":1879,"t":"The last buffalo","d":"June 26, 1879: a bull is chased across the township and escapes over the hill.","pp":["larsc"]},{"y":1882,"t":"Lars gets his patent","d":"174.64 acres on Lake Albert, February 20, 1882.","pp":["larsc"]},{"y":1883,"t":"Bergers file in Section 14","d":"A 12×16 claim shack and eleven acres of broken land.","pp":["henrich","annaliz"]},{"y":1885,"t":"Bellikkas cross the Atlantic","d":"Jacob, age seven, lands at Rockport, Massachusetts.","pp":["jacobbell"]},{"y":1887,"t":"Berger land deeded","d":"May 16, 1887.","pp":["henrich"]},{"y":1888,"t":"Roisum homestead patent","d":"160 acres near Lake Norden, September 25, 1888.","pp":["josephr"]},{"y":1897,"t":"Smiths and Roisums on the Hamlin map","d":"The Abbott plat map shows P. C. Smith and three Roisum brothers.","pp":["peters","josephr","iverroisum","hansroisum"]},{"y":1900,"t":"John Johnson marries Matilda Roisum","d":"December 26, 1900, at Lake Norden.","pp":["johne","matilda"]},{"y":1902,"t":"Sod house near Gackle","d":"Jacob and Lizzie Bellikka homestead in Logan County, ND.","pp":["jacobbell","lizzieb"]},{"y":1906,"t":"Johnsons move to Emmons County","d":"A new start in Tell Township, North Dakota.","pp":["johne","matilda","edwinj"]},{"y":1930,"t":"Claris marries Helen","d":"November 15, 1930, at Oelrichs.","pp":["claris","helenr"]},{"y":1955,"t":"Eddie paints the silo","d":"He painted his name and the year on the new silo at the Berger farm.","pp":["eddie","esther"]},{"y":1956,"t":"Charles marries Joanne","d":"June 2, 1956.","pp":["charles","joanne"]},{"y":1965,"t":"Steve marries Anna","d":"1965, in Sturgis.","pp":["stevek","annak"]},{"y":2011,"t":"Peyton marries Tawni","d":"2011, at Lake Norden.","pp":["peyton","tawni"]}],"stories":[{"id":"thisted","t":"The man who named Lake Thisted","k":"Badger Township · 1877","y":1877,"ic":"lake","lead":"In June 1877 a Dane named Lars Christensen became the first settler of Badger Township, and gave a prairie lake the name of home.","body":["Lars Christensen was born on November 25, 1841 in Snedsted parish, in the Thy country of northwest Denmark. In Denmark people called him Laust. In Dakota the clerks and neighbors called him Lewis, and the 1880 census lists the family as \"Lewis Christeanson\".","In June 1877 he and his wife Maren settled on the east bank of Lake Albert, with two-year-old Elsie and a baby, Chris. The 1925 township history opens with them: \"The first white settler in the township was Lewis Christensen, a native of Denmark, who settled on the east bank of Lake Albert.\"","There were no towns yet, and no railroad. Lars named the lake south of his claim Lake Thisted, after the Thisted country he had left behind. The name is still on the map today.","He got his patent for 174.64 acres in Section 12 on February 20, 1882. He lived 36 years on the land he broke first, died January 27, 1913, and rests at Poinsett Cemetery."],"pp":["larsc","marenk","elsiec"],"src":["http://www.solutionsandsystems.com/docs/History_of_Badger_Township.pdf","https://www.us-census.org/pub/usgenweb/census/sd/kingsbury/1880/ed087-pg156a.txt","https://thelandpatents.com/patents/sdmtaa-093153"],"place":"larshome"},{"id":"cousins","t":"Cousins, twice over","k":"Snedsted, Denmark · 1830s–1870s","y":1874,"ic":"heart","lead":"Lars and Maren shared a grandmother and a grandfather, and the family ties ran even closer than that.","body":["Lars Christensen's mother was Ane Cathrine Larsdatter Bech. Maren Pedersen's mother was Else Cathrine Larsdatter Bech. The two women were sisters, both daughters of Lars Christensen Bech (1759–1831) and Maren Christensdatter (1765–1843) of Snedsted. That made Lars and Maren first cousins.","Danish parish records add another twist. Before Lars's father married Ane Cathrine, he had a daughter, Kirsten, with her sister Else Cathrine. So Kirsten was a half-sister to both Lars and Maren.","Cousin marriage was legal and fairly common in rural Denmark at the time. Genealogists call this pedigree collapse: Lars Bech and Maren Christensdatter appear twice in Peyton's tree, as his 5th great-grandparents through both Lars and Maren.","Lars and Maren married around 1874 and left for America soon after. The source is a Danish genealogy site that cites the parish registers. It is strong, but no one has checked the church books directly yet."],"pp":["larsc","marenk","larsbech1759","marenchristensdatter1765","anecathrinebech","elsecathrinebech","kirstenchristensdatter"],"src":["https://gravgaard.familyds.com/slaegt/18919.htm","https://gravgaard.familyds.com/slaegt/18918.htm"],"place":"snedsted"},{"id":"firstchild","t":"The first child born in Badger Township","k":"October 15, 1878","y":1878,"ic":"cradle","lead":"Albert Christensen is the first white child recorded as born in the township, though his cousin had a fair claim to the title.","body":["The 1925 history of Badger Township records it plainly: \"The first white child born in the township was Albert Christensen, son of Mr. and Mrs. Lewis Christensen, the first white settlers. This interesting event occurred on the 15th of October, 1878.\"","The same history admits the honor should really have gone to his cousin Anna, Peter Christensen's daughter, born about two months earlier. Her family was staying with a neighbor just over the line in Brookings County at the time, so Albert got the title.","Albert is Elsie's younger brother, which makes him Peyton's 3rd great-uncle. He died January 1, 1956 and is buried at Badger."],"pp":["albertchristensen1878","larsc","marenk"],"src":["http://www.solutionsandsystems.com/docs/History_of_Badger_Township.pdf"],"place":"larshome"},{"id":"buffalo","t":"The last buffalo","k":"June 26, 1879","y":1879,"ic":"bison","lead":"Two years after Lars arrived, the last buffalo ever seen in Badger Township ran straight through the settlement.","body":["On June 26, 1879, a lone buffalo bull appeared in the township. The Quinn brothers gave chase, and Peter Christensen joined them with a rifle.","The bull outran them all and got away over the hill between Sections 18 and 19. The township history says no buffalo was ever seen there again.","That same July, Peter and Mat Christensen opened a store on the east bank of Lake Thisted. Its post office was called Pleasant Valley."],"pp":["larsc"],"src":["http://www.solutionsandsystems.com/docs/History_of_Badger_Township.pdf"],"place":"thisted"},{"id":"longwinter","t":"They lived through The Long Winter","k":"October 1880 – May 1881","y":1880,"ic":"snow","lead":"The winter Laura Ingalls Wilder made famous hit the Christensens' claim too, about 30 miles from De Smet.","body":["The Hard Winter of 1880–81 started with an October blizzard and barely let up. The last train reached Volga on January 20, 1881. The next one didn't get through until May 6.","Settlers ground seed wheat in coffee mills to make flour and burned twisted slough hay to keep warm. That is the same winter Laura Ingalls Wilder later wrote about in The Long Winter, set a few townships west in De Smet.","Lars and Maren had three small children by then: Elsie, Chris and baby Albert. The township history says no one in Badger Township died that winter."],"pp":["larsc","marenk","elsiec","chrislchristensen","albertchristensen1878"],"src":["http://www.solutionsandsystems.com/docs/History_of_Badger_Township.pdf"],"place":"larshome"},{"id":"bergen1866","t":"Bergen to Quebec, 1866","k":"Leikanger, Norway → Lake Norden","y":1866,"ic":"ship","lead":"A Sognefjord farmer named Rognald Johnsen sailed for America in 1866. His sons ended up owning the south shore of Lake Norden.","body":["Rognald Johnsen married Anna Hansdatter in Aurland on November 19, 1846. He was a husmann then, a cotter working someone else's land. By 1865 he owned his own farm, Røisum, in Leikanger parish on the Sognefjord, and the farm gave the family its American surname.","The 1865 census lists the household: Rognald, 44; Anne, 44; and children John 16, Hans 12, Magrethe 11, Marthe 7, Iver 4 and Andreas 2. On April 29, 1866 Rognald's name appears on a ship list from Bergen to Quebec, the usual route for Norwegians bound for the Midwest.","His son John was baptized in Leikanger on May 12, 1850. In America he went by Joe, and his land patents read \"Joe Rognaldson Roisum\". On the 1897 Hamlin County map, Joe holds the NW quarter of Section 20 in Norden Township, and his brothers Iver and H. R. own the land next to him on the south shore of Lake Norden.","When the railroad came in 1907, part of the new town of Lake Norden was laid out on Roisum land, and Mr. and Mrs. Iver Roisum were among the homesteaders who gave land for the townsite."],"pp":["rognaldroisum","annehansdatter","josephr","iverroisum","hansroisum","matilda"],"src":["https://www.digitalarkivet.no/en/view/194/pe00000000336903","https://www.digitalarkivet.no/en/census/person/pf01038255001388","https://www.digitalarkivet.no/en/view/255/pd00000039751215","https://npgallery.nps.gov/GetAsset/2c61bbb4-b32c-478b-a857-1eca4812e07c"],"place":"roisumfarm"},{"id":"farmstead","t":"A house and eleven acres of broken land","k":"Berger Farmstead · 1883 → National Register 2005","y":1883,"ic":"barn","lead":"The Berger homestead is on the National Register of Historic Places, and Eddie Smith's name is painted on its silo.","body":["The Bergers left Germany in 1879, stopped for a short time in Nebraska, and reached Badger Township in 1883. Heinrich Berger filed on 160 acres in Section 14. On his homestead affidavit the improvements are listed as \"a house and eleven acres of broken land\". The house was a 12 by 16 foot claim shack, and it still stands.","The land was deeded to him on May 16, 1887. His son Henry built the place out: a Folk Victorian house in 1902, a Wisconsin dairy barn in 1911, a windmill in 1912, a garage in 1914, and a granary in 1919 with bushel tallies still carved into its walls.","Henry's daughter Esther married Eddie Smith, and they were living on the farm when the silo went up in 1955. In the words of the nomination, Eddie \"painted his name and the date of construction on the west side of the silo.\"","In 2005 the Berger Farmstead, also called the Smith Farmstead, was listed on the National Register for its role in settling Kingsbury County. Charles, Donald, Marvin and Joy were among the owners named."],"pp":["henrich","annaliz","henryb","thea","esther","eddie","charles"],"src":["https://npgallery.nps.gov/AssetDetail/NRIS/05000179","https://npgallery.nps.gov/GetAsset/00005b2f-b57b-43f5-9f9c-f9f7cca776d0"],"place":"berger"},{"id":"smithname","t":"How the Pedersens became Smiths","k":"Denmark → Hamlin County · 1883–86","y":1883,"ic":"anvil","lead":"Peter Christian Smith was born a Pedersen. His widowed mother is the reason any of the Smiths are here.","body":["Peter Christian was born on August 24, 1869 in Denmark, son of Laurst Pedersen and Else Marie. His father died when he was about seven.","Else Marie remarried in 1879 to Lars Dahl Madsen, had four more children, and between 1883 and 1886 brought the whole blended family to Hamlin County, Dakota Territory. She had seven years on the prairie and died in 1890. She is buried at Bryant under a stone that reads \"Mother\".","At some point in the move, Peter Christian Pedersen became Peter Christian Smith, and his brother Martin took the name too. Their half-brother went by Lars Smed Madson. Smed is the Danish word for smith, which is a strong clue to where the name came from, but it isn't proven yet.","Peter married Elsie Christensen, daughter of Kingsbury County's first settlers. On the 1897 map he owns a quarter in Cleveland Township. They rest side by side at the Danish Lutheran Cemetery near Badger."],"pp":["peters","elsemarie","laurst","martinlarsensmith","larssmedmadson","elsiec"],"src":["https://www.findagrave.com/memorial/144983039","https://www.wikitree.com/wiki/Pedersen-5871"],"place":"pcsmith"},{"id":"tornio","t":"From Tornio to Tell Township","k":"Finland → Lake Norden → North Dakota","y":1900,"ic":"compass","lead":"The Johnson line turns out to be Finnish, and it started with a wedding the day after Christmas.","body":["John Everett Johnson was born August 18, 1873 in Tornio, a Finnish town on the Swedish border at the top of the Gulf of Bothnia. In America the family name became Johnson.","He came to the Finnish colony at Lake Norden, and on December 26, 1900 he married Matilda Roisum, Joe Roisum's daughter.","Around 1906 they joined the rush to newly opened land in Emmons County, North Dakota. Their son Edwin, Peyton's great-grandfather, was born in Braddock that year. They farmed Tell Township for decades and raised at least thirteen children."],"pp":["johne","matilda","edwinj","josephr"],"src":[],"place":"tornio"},{"id":"hendrickson","t":"Raising the Hendrickson barn","k":"Lake Norden Finnish settlement · 1881","y":1881,"ic":"hammer","lead":"An Erick Kangas helped build a farm that's now on the National Register as an example of Finnish settlement architecture.","body":["Erick Alfred Kangas, born August 30, 1847, brought this branch from Finland to Dakota and shortened Jylhänkangas to Kangas.","An Erick Kangas is recorded as one of the builders of the 1881 Hendrickson Farm, two miles west of Lake Norden. It is on the National Register as an example of Finnish building. That is almost certainly him, in the settlement's first years.","Later he went west. By 1910 he and Briita were living near Brush Prairie, Washington. Census records show them back in Hamlin County in 1920, but Erick died in Clatsop County, Oregon, in 1926 and is buried at Elim Cemetery in Washington."],"pp":["erick","briita","alfred","matti","lisa"],"src":["https://npgallery.nps.gov/NRHP/GetAsset/NRHP/64000790_text"],"place":"lakenorden"},{"id":"sodhouse","t":"A sod house at Gackle","k":"Tawni's side · 1885–1945","y":1902,"ic":"sod","lead":"Jacob Bellikka crossed the Atlantic at seven, broke prairie with a hand plow, and farmed for 43 years.","body":["Jacob Bellikka (born Pellikka) was born on November 25, 1878 in Revonlahti, Finland. In 1885, at seven, he crossed with his family to Rockport, Massachusetts. They went on to Carbon, Wyoming, and reached Frederick, Dakota Territory in 1886.","In the summer of 1902 he filed a homestead about nineteen miles southwest of Gackle, North Dakota, and that fall he married Lizzie Lippo at Ellendale. They lived with their neighbor John Homola until their sod house was done.","He broke the prairie with a horse and a hand plow, and the first crop gave only a few bushels of flax. Over the years they added a frame house, a barn and twelve children, and they farmed for 43 years before retiring into Gackle in 1945."],"pp":["jacobbell","lizzieb","arvob"],"src":[],"place":"gackle"},{"id":"arne","t":"Brought home from the Philippines","k":"Tawni's side · World War II","y":1945,"ic":"star","lead":"Arne Bellikka looked so much like his brother Arvo that people took them for twins.","body":["Arne Bellikka, born about 1920, was a son of Jacob and Lizzie. He and his brother Arvo, Tawni's grandfather, looked so much alike that people took them for twins.","Arne was killed in the Philippines during World War II. Family notes say he was buried there for three years before he was brought home to Gackle."],"pp":["arnebellikka","arvob","jacobbell","lizzieb"],"src":[],"place":"gackle"},{"id":"huguenot","t":"The Huguenot line","k":"Tawni's side · New Paltz, 1677","y":1677,"ic":"church","lead":"Tawni's Deyo ancestors go back to one of the twelve founders of New Paltz, New York, the oldest American line in either family.","body":["Every Deyo in America descends from Christian Deyo, born around 1610 in Artois, France. As a Huguenot he fled to Mannheim, Germany in 1660, crossed to America in 1675, and in 1677 signed the New Paltz patent as one of its twelve founders. His son Pierre built a stone house on Huguenot Street in 1692, and it is still standing.","Abel Deyo, born 1824, moved the family west in stages, to Wisconsin and then to Spring Valley, Minnesota, where he is buried. His great-granddaughter Gladys married Henry Helser, and their daughter Lee is Tawni's grandmother.","Abel is about five or six generations below Christian. The exact chain is in the published Deyo genealogy but hasn't been copied into this tree yet."],"pp":["abeld","hannajb","wmdeyo","gladysd","leeb"],"src":[],"place":null},{"id":"century","t":"Ninety-nine years","k":"Esther Berger Smith · 1904–2004","y":1904,"ic":"clock","lead":"Esther was born in the horse-and-plow era and lived into the age of the internet.","body":["Esther Anna Berger was born October 8, 1904 in Kingsbury County, to Henry Berger, of German stock, and Thea Anderson, of Danish stock. She grew up on her grandfather Heinrich's 1883 homestead.","Her mother died in 1917, when Esther was twelve. She married Eddie Smith and raised six children on the farm near Erwin: Charles, Elwood, Donald, Leonard, Marvin and Joy.","She outlived Eddie by nineteen years and died May 15, 2004, five months short of 100. She rests beside him at Badger Cemetery."],"pp":["esther","eddie","henryb","thea","charles"],"src":[],"place":"berger"},{"id":"bearbutte","t":"In the shadow of Bear Butte","k":"Kenoyer line · Sturgis","y":1945,"ic":"mountain","lead":"Claris and Helen Kenoyer followed wartime aircraft jobs across the country and came home to a farm east of Sturgis.","body":["Claris Ervin Kenoyer married Helen Rickenbach at Oelrichs on November 15, 1930. Helen was born in Pittsburgh in 1910 and came to Oelrichs at two, when her father homesteaded there.","During World War II they moved to Glendale, California and then Augusta, Kansas, where Claris built aircraft. In March 1945 they settled on a farm east of Sturgis.","In 1969 Claris was a charter board member of the Western Dakota Antique Club. The club's 40-acre showgrounds east of the Sturgis airport was land bought from Claris and Helen.","They rest together at Bear Butte Cemetery. Their son Steve, Peyton's grandpa, served with the South Dakota Highway Patrol from 1965 to 1983 and is buried at Black Hills National Cemetery."],"pp":["claris","helenr","stevek","bfrickenbach"],"src":[],"place":null}],"lines":{"smith":["Smith · Christensen · Berger","#9b3b2e","Grandpa Charles's line","Denmark · Germany"],"johnson":["Johnson · Kangas · Roisum","#2f6f73","Grandma Joanne's line","Finland · Norway"],"kenoyer":["Kenoyer · Rickenbach","#4f6b3a","Grandpa Steve's line","Swiss-German · Pennsylvania"],"koski":["Koski · Jernberg · Herrala","#6e4a7e","Grandma Anna's line","Finland"],"bludorn":["Bludorn · Bluedorn","#b07a2a","Grandpa Roger's line","Germany"],"helser":["Helser · Deyo","#3e5c8a","Grandma Lee's line","Germany · French Huguenot"],"bellikka":["Bellikka · Lippo","#a8536b","Grandpa Arvo's line","Finland"],"schlosser":["Schlosser · Radke","#7a6a3a","Grandma Ardis's line","Germany"],"core":["Peyton & Tawni's family","#8a6a2f","Parents, siblings and children","South Dakota"]},"gps":{"smith":"charles","johnson":"joanne","kenoyer":"stevek","koski":"annak","bludorn":"rogerb","helser":"leeb","bellikka":"arvob","schlosser":"ardiss"},"unplaced":[{"name":"Logan Smith","relation":"Grandson of Charles & Joanne; died before Joanne (2022)","note":"Parent not identified","sources":["https://www.geisefuneralhome.com/obituary/charles-smith","https://www.geisefuneralhome.com/obituary/audrey-smith"]},{"name":"Laurel Smith","relation":"Granddaughter of Charles & Joanne; died before Joanne (2022)","note":"Parent not identified. Different person from Laurel Joanne Massie (b. 2026).","sources":["https://www.geisefuneralhome.com/obituary/charles-smith","https://www.geisefuneralhome.com/obituary/audrey-smith"]},{"name":"Arynn Smith and Arika Smith","relation":"Cousins of Trenton Monty Smith who died before 2022, so grandchildren of one of Scott's siblings or of June's side","note":"Parents not identified","sources":["https://www.geisefuneralhome.com/obituaries/trenton-smith"]},{"name":"Llora Fitzgerald","relation":"Granddaughter of Donald Smith; died before 2008. Probably Velva (Sm
