  if(typeof L==='undefined'){$('#map').innerHTML='<div class="mapnote">The live map needs an internet connection.<br>Every place is still listed below.</div>';if(sel)setTimeout(()=>mapSelect(mode,sel),50);return}
  const map=L.map('map',{zoomControl:false,attributionControl:true,minZoom:2,worldCopyJump:true});window._map=map;
  L.control.zoom({position:'bottomright'}).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © Esri, Maxar, Earthstar'}).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:.9}).addTo(map);
  const items=mapItems(mode).filter(x=>x.lat!=null);window._mk={};
  const icon=it=>it.kind==='birth'?L.divIcon({className:'',html:'<div class="bdot"></div>',iconSize:[14,14],iconAnchor:[7,7]}):
    L.divIcon({className:'',html:`<div class="pin ${it.kind}" id="pin-${it.id}">${ic(it.kind==='cem'?'cross':it.kind==='home'?'house':'flag')}${it.kind==='cem'&&it.pp.length?`<span class="cnt">${it.pp.length+(it.ex||[]).length}</span>`:''}</div>`,iconSize:[34,34],iconAnchor:[17,36]});
  items.forEach(it=>{const mk=L.marker([it.lat,it.lon],{icon:icon(it),riseOnHover:true}).addTo(map);mk.bindTooltip(it.n,{className:'tt',direction:'top',offset:[0,-34]});mk.on('click',()=>{location.hash=`#/map/${mode}/${it.id}`});window._mk[it.id]=mk});
  if(mode==='origins'){const dest={snedsted:'larshome',tingstrup:'larshome',boddum:'larshome',roisumfarm:'joeroisum',aurland:'joeroisum',haukipudas:'lakenorden',tornio:'lakenorden',revonlahti:'gackle',mecklenburg:'lakenorden'};
    items.forEach(it=>{const d=PLACE[dest[it.id]];if(!d)return;const pts=[];const a=[it.lat,it.lon],b=[d.lat,d.lon];const mid=[(a[0]+b[0])/2+12,(a[1]+b[1])/2];
      for(let t=0;t<=1.0001;t+=.04){pts.push([(1-t)*(1-t)*a[0]+2*(1-t)*t*mid[0]+t*t*b[0],(1-t)*(1-t)*a[1]+2*(1-t)*t*mid[1]+t*t*b[1]])}
      L.polyline(pts,{color:'#f0c27a',weight:2,opacity:.85,dashArray:'6 6'}).addTo(map)});
    L.circleMarker([44.55,-97.2],{radius:7,color:'#fffaf0',weight:2,fillColor:'#c9893d',fillOpacity:1}).addTo(map).bindTooltip('Lake Norden & Badger, SD',{className:'tt',permanent:false});}
  let fitPts=items.map(i=>[i.lat,i.lon]);
  if(mode==='cemeteries'||mode==='births')fitPts=items.filter(i=>i.lon<-95&&i.lon>-99).map(i=>[i.lat,i.lon]);
  if(mode==='places')fitPts=items.filter(i=>!i.ap).map(i=>[i.lat,i.lon]);
  if(mode==='origins')fitPts=fitPts.concat([[44.5,-97.2]]);
  map.fitBounds(fitPts,{paddingTopLeft:[30,70],paddingBottomRight:[30,30],maxZoom:13});
  if(mode!=='births'){const hb=document.createElement('button');hb.className='homebtn';hb.innerHTML=ic('home')+'Badger &amp; Lake Norden';hb.onclick=()=>map.flyToBounds([[44.46,-97.40],[44.62,-97.11]],{duration:1.2});$('.mapwrap').appendChild(hb)}
  if(sel)setTimeout(()=>mapSelect(mode,sel),300);
}
function mapList(mode){
  const items=mapItems(mode);const T={cemeteries:['Resting places',`Where ${DATA.cems.reduce((n,c)=>n+c.pp.length+c.ex.length,0)} family members are buried, from the Badger prairie to Thy in Denmark. Tap a card for the satellite view and directions.`],
   places:['Homesteads &amp; claims','Where the family first broke ground in Dakota, located from land patents, plat maps and the National Register.'],
   origins:['The old country','Parishes and farms in Denmark, Norway, Finland and Germany, with the routes to Dakota.'],
   births:['Birthplaces','Where ancestors were born. Each dot is a town; tap for the names.']}[mode];
  $('#mh').innerHTML=T[0];$('#mintro').innerHTML=T[1];$('#mcount').textContent=items.length+' places';
  $('#mlist').innerHTML=items.map(it=>{
    if(it.kind==='birth')return `<button class="card prow" data-sel="${it.id}" style="padding:12px 14px"><span class="av s" style="--c:#c9893d">${ic('pin').replace('<svg','<svg width="16" height="16"')}</span><span class="tx"><div class="nm">${esc(placeShort(it.n))}</div><div class="mt">${it.pp.map(i=>short(P[i])).join(', ')}</div></span>${stackAv(it.pp,3)}</button>`;
    const img=it.lat!=null?satURL(it.lat,it.lon,...(it.kind==='orig'?[.03,.018]:it.kind==='home'?[.006,.0035]:[])):'';
    const label={cem:'Cemetery',home:it.ap?'Homestead · approx.':'Homestead',orig:'Old country'}[it.kind];
    return `<button class="ccard" data-sel="${it.id}"><div class="ph" ${img?`style="background-image:url('${img}')"`:''}><span class="kind">${label}${it.y?' · '+it.y:''}</span><div class="t"><b>${esc(it.n)}</b><span>${esc(it.loc)}</span></div></div>
    <div class="bd">${stackAv(it.pp,5)}<span class="names">${it.pp.length?esc(it.pp.slice(0,4).map(i=>short(P[i])).join(', ')+(it.pp.length>4?` +${it.pp.length-4}`:'')):esc((it.ex||[]).map(x=>x[0]).join(', ')||it.d||'')}</span>${ic('chev').replace('<svg','<svg width="18" height="18" style="color:var(--mut2)"')}</div></button>`}).join('');
  $$('#mlist [data-sel]').forEach(b=>b.onclick=()=>{location.hash=`#/map/${mode}/${b.dataset.sel}`});
}
function mapSelect(mode,id){const it=mapItems(mode).find(x=>x.id===id);if(!it)return;
  if(window._map&&it.lat!=null){window._map.flyTo([it.lat,it.lon],it.kind==='orig'?10:it.kind==='birth'?11:it.kind==='home'?15:16,{duration:1.1});$$('.pin.sel').forEach(x=>x.classList.remove('sel'));const pe=document.getElementById('pin-'+id);if(pe)pe.classList.add('sel');scrollTo({top:0,behavior:'smooth'})}
  const g=it.lat!=null?`https://www.google.com/maps/dir/?api=1&destination=${it.lat},${it.lon}`:'';const ap=it.lat!=null?`https://maps.apple.com/?daddr=${it.lat},${it.lon}`:'';
  const ppl=it.pp.map(i=>P[i]).sort(byYear);
  openSheet(`${it.lat!=null&&it.kind!=='birth'?`<img class="satimg" alt="Satellite view of ${esc(it.n)}" src="${satURL(it.lat,it.lon,...(it.kind==='orig'?[.03,.018]:it.kind==='home'?[.006,.0035]:[]))}">`:''}
  <div class="eyebrow">${{cem:'Cemetery',home:'Homestead',orig:'Old country',birth:'Birthplace'}[it.kind]}${it.y?' · '+it.y:''}</div>
  <h3 style="font-size:24px;margin:4px 0 2px">${esc(placeShort(it.n))}</h3><div class="muted">${esc(it.loc||'')}</div>
  ${it.lat!=null?`<div class="coord" style="margin:6px 0 0">${it.lat.toFixed(4)}, ${it.lon.toFixed(4)}${it.ap?' · approximate':''}</div>`:'<div class="muted small" style="margin-top:6px">Exact location not yet found.</div>'}
  ${it.d?`<p style="font-family:var(--serif);font-size:16px;line-height:1.55;color:var(--ink2);margin:12px 0 0">${esc(it.d)}</p>`:''}
  ${g?`<div class="btnrow" style="margin:14px 0 4px"><a class="btn pri" href="${g}" target="_blank" rel="noopener">${ic('dir')}Directions</a><a class="btn" href="${ap}" target="_blank" rel="noopener">Apple Maps</a>${it.url?`<a class="btn" href="${esc(it.url)}" target="_blank" rel="noopener">${ic('doc')}Record</a>`:''}</div>`:''}
  ${ppl.length?`<div class="sres-h">${it.kind==='cem'?'Buried here':it.kind==='birth'?'Born here':'Family here'}</div><div class="card list">${ppl.map(p=>prow(p)).join('')}</div>`:''}
  ${(it.ex||[]).length?`<div class="sres-h">Also listed</div><div class="card list">${it.ex.map(x=>`<div class="prow"><span class="tx"><div class="nm">${esc(x[0])}</div><div class="mt">${esc(x[1])}</div></span></div>`).join('')}</div>`:''}`);
}
/* ---------------- TIMELINE ---------------- */
const ERAS=[[0,1849,'The old country','Before the crossing'],[1850,1876,'Leaving home','Emigration years'],[1877,1899,'Homestead years','Claims, blizzards and statehood'],[1900,1944,'A new century','Farms, wars and the Depression'],[1945,1989,'After the war','Highway patrols and family farms'],[1990,2100,'Today','The newest generations']];
let tlFilter='key';
function timelinePage(){const el=$('.page');setTitle('Timeline');
  el.innerHTML=`<div class="wrap"><section class="shero" style="padding-left:0;padding-right:0"><div class="eyebrow">1677 – ${new Date().getFullYear()}</div><h1>Family timeline</h1><p>Family milestones next to the history around them.</p></section>
  <div class="fchips" id="tlf">${[['key','Key moments'],['all','Everyone'],['fam','Family only'],['hist','History only']].map(([k,l])=>`<button class="fchip ${k===tlFilter?'on':''}" data-k="${k}">${l}</button>`).join('')}</div></div><div id="tl"></div>${footer()}`;
  $$('#tlf button').forEach(b=>b.onclick=()=>{tlFilter=b.dataset.k;$$('#tlf button').forEach(x=>x.classList.toggle('on',x===b));drawTL()});drawTL();
}
function drawTL(){
  const ev=[];const f=tlFilter;
  if(f!=='fam')DATA.hist.forEach(h=>ev.push({y:h.y,k:'hist',h}));
  if(f!=='hist'){DATA.fam.forEach(x=>ev.push({y:x.y,k:'fam',x}));
    DATA.people.forEach(p=>{const key=p.dir||['peyton','tawni'].includes(p.id)||(p.ln==='core'&&p.g===-1&&p.pa.includes('peyton'));
      if(f==='key'&&!key)return;
      if(p.by)ev.push({y:p.by,k:'life',p,t:'born'});if(p.dy)ev.push({y:p.dy,k:'life',p,t:'died'})})}
  ev.sort((a,b)=>a.y-b.y||({hist:0,fam:1,life:2}[a.k]-{hist:0,fam:1,life:2}[b.k]));
  let html='<div class="tl">';let era=-1;
  ev.forEach(e=>{const ei=ERAS.findIndex(r=>e.y>=r[0]&&e.y<=r[1]);if(ei!==era){era=ei;const E=ERAS[ei];html+=`<div class="era"><div><b>${E[2]}</b><br><span>${E[3]}${E[0]?` · ${E[0]}${E[1]<2100?'–'+E[1]:'+'}`:''}</span></div></div>`}
    if(e.k==='hist')html+=`<div class="te hist"><div class="yr">${e.y}</div><div class="box"><h4>${esc(e.h.t)}</h4><p>${esc(e.h.d)}</p></div></div>`;
    else if(e.k==='fam')html+=`<div class="te"><div class="yr">${e.y}</div><div class="box"><h4>${esc(e.x.t)}</h4><p>${esc(e.x.d)}</p><div class="who">${e.x.pp.map(i=>chip(P[i])).join('')}</div></div></div>`;
    else{const p=e.p;const pl=placeShort((e.t==='born'?p.b:p.d)?.[1]||'').split(',').slice(0,2).join(',');
      html+=`<div class="te life"><div class="yr">${e.y}</div><a class="box" href="#/p/${p.id}">${av(p,'s')}<div style="min-width:0"><h4>${esc(short(p))} ${e.t==='born'?'is born':'dies'}</h4><p>${esc([p.rl,pl].filter(Boolean).join(' · '))}</p></div></a></div>`}});
  html+='</div>';$('#tl').innerHTML=html;
}
/* ---------------- STORIES ---------------- */
function storyColor(s){const c={};s.pp.forEach(i=>{const k=P[i].ln;c[k]=(c[k]||0)+1});const k=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];return (LINES[k]||LINES.core)[1]}
const storySide=s=>s.pp.some(i=>['bludorn','helser','bellikka','schlosser'].includes(P[i].ln))?'tawni':'peyton';
let stFilter='all';
function storiesPage(){const el=$('.page');setTitle('Stories');
  el.innerHTML=`<div class="wrap"><section class="shero" style="padding-left:0;padding-right:0"><div class="eyebrow">From the records</div><h1>Family stories</h1><p>Drawn from township histories, parish books, land patents, obituaries and the National Register.</p></section>
  <div class="fchips" id="stf">${[['all','All stories'],['peyton',"Peyton's side"],['tawni',"Tawni's side"]].map(([k,l])=>`<button class="fchip ${k===stFilter?'on':''}" data-k="${k}">${l}</button>`).join('')}</div></div><div class="sfeed" id="sfeed"></div>${footer()}`;
  $$('#stf button').forEach(b=>b.onclick=()=>{stFilter=b.dataset.k;$$('#stf button').forEach(x=>x.classList.toggle('on',x===b));drawStories()});drawStories();
}
function drawStories(){const ss=DATA.stories.filter(s=>stFilter==='all'||storySide(s)===stFilter);
  $('#sfeed').innerHTML=ss.map(s=>`<a class="scard" href="#/s/${s.id}"><div class="art" style="--c:${storyColor(s)}">${ic(s.ic)}<span class="yrbig">${s.y}</span></div><div class="bd"><div class="eyebrow">${esc(s.k)}</div><h3>${esc(s.t)}</h3><p>${esc(s.lead)}</p><div class="ft2">${stackAv(s.pp,4)}<span class="linkbtn">Read ›</span></div></div></a>`).join('');}
function storyPage(id){const el=$('.page');const s=STORY[id];if(!s){location.replace('#/stories');return}setTitle(s.t);
  const order=DATA.stories;const i=order.indexOf(s);const nx=order[(i+1)%order.length];
  const pl=s.place&&(PLACE[s.place]||CEM[s.place]);
  el.innerHTML=`<article class="reader"><header class="rhero" style="--c:${storyColor(s)}">${ic(s.ic,'big')}<div class="eyebrow">${esc(s.k)}</div><h1>${esc(s.t)}</h1><p>${esc(s.lead)}</p></header>
  <div class="prose">${s.body.map(b=>`<p>${esc(b)}</p>`).join('')}</div>
  <section class="sec"><h2>People in this story</h2><div class="chips">${s.pp.map(i=>chip(P[i])).join('')}</div></section>
  ${pl&&pl.lat!=null?`<section class="sec"><h2>Where it happened</h2><a class="ccard" style="display:block;text-decoration:none" href="#/map/${PLACE[s.place]?(pl.t==='origin'?'origins':'places'):'cemeteries'}/${pl.id}"><div class="ph" style="background-image:url('${satURL(pl.lat,pl.lon,...(pl.t==='origin'?[.03,.018]:[.006,.0035]))}')"><span class="kind">${pl.t==='origin'?'Old country':'Homestead'}</span><div class="t"><b>${esc(pl.n)}</b><span>${esc(pl.loc)}</span></div></div></a></section>`:''}
  ${s.src.length?`<section class="sec"><h2>Sources</h2><div class="srcs">${s.src.map(srcItem).join('')}</div></section>`:`<section class="sec"><div class="muted small">Drawn from the profiles of the people in this story; see their sources.</div></section>`}
  <section class="sec"><a class="feature" style="min-height:0" href="#/s/${nx.id}"><div class="eyebrow">Next story</div><h3 style="font-size:22px;margin:6px 0 0">${esc(nx.t)}</h3><span class="go">Continue ${ic('chev').replace('<svg','<svg width="16" height="16"')}</span></a></section>
  </article>${footer()}`;
}
/* ---------------- SEARCH ---------------- */
let IDX=null;
function buildIdx(){IDX=DATA.people.map(p=>{const kf=p.kf||{};const alt=[kf.Called,kf.Name,kf.Maiden].filter(Boolean).join(' ');const c=cemOf(p);
  return {p,nm:norm(p.n),words:norm(p.n+' '+alt).split(/[^a-z0-9]+/).filter(Boolean),hay:norm([p.n,alt,p.b&&p.b.join(' '),p.d&&p.d.join(' '),p.bu&&p.bu[1],c&&c.n,p.rl,p.r,p.by,p.dy].filter(Boolean).join(' '))}})}
let sFilter='all';
function searchPage(q){const el=$('.page');setTitle('Search');if(!IDX)buildIdx();
  if(q===':new'){sFilter='new';q=''}
  el.innerHTML=`<div class="sbox"><label class="sinput">${ic('search')}<input id="sq" type="search" enterkeyhint="search" autocomplete="off" placeholder="Name, place or year" value="${esc(q)}"></label>
  <div class="fchips" style="margin-top:10px" id="sf">${[['all','Everyone'],['peyton',"Peyton's side"],['tawni',"Tawni's side"],['dir','Direct ancestors'],['new','Newly found']].map(([k,l])=>`<button class="fchip ${k===sFilter?'on':''}" data-k="${k}">${l}</button>`).join('')}</div></div>
  <div class="wrap" id="sres"></div>`;
  const inp=$('#sq');inp.addEventListener('input',()=>{doSearch(inp.value);history.replaceState(null,'','#/search/'+encodeURIComponent(inp.value))});
  $$('#sf button').forEach(b=>b.onclick=()=>{sFilter=b.dataset.k;$$('#sf button').forEach(x=>x.classList.toggle('on',x===b));doSearch(inp.value)});
  doSearch(q);if(innerWidth>=900||!q)setTimeout(()=>inp.focus({preventScroll:true}),60);
}
const PEY=['smith','johnson','kenoyer','koski'],TAW=['bludorn','helser','bellikka','schlosser'];
function doSearch(q){const toks=norm(q).split(/\s+/).filter(Boolean);const out=$('#sres');
  const passF=p=>sFilter==='all'||(sFilter==='peyton'&&(PEY.includes(p.ln)||p.ln==='core'))||(sFilter==='tawni'&&(TAW.includes(p.ln)||p.ln==='core'))||(sFilter==='dir'&&p.dir)||(sFilter==='new'&&p.new);
  if(!toks.length&&sFilter==='all'){const r=recent();
    out.innerHTML=`${r.length?`<div class="sres-h">Recently viewed</div><div class="chips">${r.map(i=>chip(P[i])).join('')}</div>`:''}
    <div class="sres-h">Try</div><div class="sugg">${['Lars','Roisum','Denmark','Finland','Badger','1878','Sturgis','Gackle','Bellikka','Berger'].map(s=>`<button class="fchip" data-s="${s}">${s}</button>`).join('')}</div>
    <div class="sres-h">Everyone, A–Z by surname</div><div class="card list">${DATA.people.slice().sort((a,b)=>(np(a).sur+np(a).first).localeCompare(np(b).sur+np(b).first)).slice(0,40).map(p=>prow(p)).join('')}</div><div class="empty small">Type to search all ${DATA.people.length} people.</div>`;
    $$('[data-s]',out).forEach(b=>b.onclick=()=>{$('#sq').value=b.dataset.s;doSearch(b.dataset.s)});return}
  const res=[];
  IDX.forEach(r=>{if(!passF(r.p))return;let sc=0;for(const t of toks){if(!r.hay.includes(t))return;
    if(r.nm.startsWith(t))sc+=100;else if(r.words.some(w=>w.startsWith(t)))sc+=60;else if(r.nm.includes(t))sc+=25;else sc+=5}
    if(r.p.dir)sc+=8;res.push({r,sc})});
  res.sort((a,b)=>b.sc-a.sc||byYear(a.r.p,b.r.p));
  const hl=s=>{let h=esc(s);toks.forEach(t=>{if(t.length<1)return;const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');h=h.replace(re,'<mark>$1</mark>')});return h};
  const placeRes=toks.length?DATA.cems.map(c=>({c,k:'cemeteries'})).concat(DATA.places.map(c=>({c,k:c.t==='origin'?'origins':'places'}))).filter(({c})=>toks.every(t=>norm(c.n+' '+c.loc+' '+(c.d||'')).includes(t))):[];
  const storyRes=toks.length?DATA.stories.filter(s=>toks.every(t=>norm(s.t+' '+s.k+' '+s.lead+' '+s.body.join(' ')).includes(t))):[];
  if(!res.length&&!placeRes.length&&!storyRes.length){out.innerHTML=`<div class="empty"><div class="serif">No matches${q?` for “${esc(q)}”`:''}</div>Try a first name, a surname, a town or a year.</div>`;return}
  out.innerHTML=`${res.length?`<div class="sres-h">People · ${res.length}</div><div class="card list">${res.slice(0,80).map(({r})=>{const p=r.p;const pl=placeShort((p.b||[])[1]).split(',').slice(0,2).join(',');
    return `<a class="prow" href="#/p/${p.id}">${av(p)}<span class="tx"><div class="nm">${hl(p.n)}</div><div class="mt">${hl([yrs(p),p.rl,pl].filter(Boolean).join(' · '))}</div></span></a>`}).join('')}</div>${res.length>80?`<div class="empty small">Showing 80 of ${res.length}. Keep typing to narrow it down.</div>`:''}`:''}
  ${placeRes.length?`<div class="sres-h">Places · ${placeRes.length}</div><div class="card list">${placeRes.map(({c,k})=>`<a class="prow" href="#/map/${k}/${c.id}"><span class="av s" style="--c:${k==='cemeteries'?'#2e5e45':k==='origins'?'#7a3048':'#9a5f22'}">${ic(k==='cemeteries'?'cross':k==='origins'?'flag':'house').replace('<svg','<svg width="15" height="15"')}</span><span class="tx"><div class="nm">${hl(c.n)}</div><div class="mt">${hl(c.loc)}</div></span></a>`).join('')}</div>`:''}
  ${storyRes.length?`<div class="sres-h">Stories · ${storyRes.length}</div><div class="card list">${storyRes.map(s=>`<a class="prow" href="#/s/${s.id}"><span class="av s" style="--c:${storyColor(s)}">${ic(s.ic).replace('<svg','<svg width="15" height="15"')}</span><span class="tx"><div class="nm">${hl(s.t)}</div><div class="mt">${esc(s.k)}</div></span></a>`).join('')}</div>`:''}`;
}
/* ---------------- init ---------------- */
function init(){
  let t=null;try{t=localStorage.getItem('sft_theme')}catch(e){}
  setTheme(t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
  shell();addEventListener('hashchange',route);
  const _render=render;render=function(...a){$('#topbar').style.display='';return _render(...a)};
  route();
  addEventListener('resize',()=>{if(state.page==='tree'&&PZ){const tp=$('#treepage');if(tp)tp.style.top=(innerWidth>=900?$('#topbar').offsetHeight:0)+'px';if(state.mode!=='fan')drawLinks(state.focus);PZ.fit(state.mode==='fan'?'center':undefined)}});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
