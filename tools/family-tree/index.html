<script>
const DATA = {"root":"peyton","people":[{"id":"peyton","n":"Peyton Paul Smith","sx":"M","s":"core","g":0,"pa":["keith","marymom"],"sp":["tawni"],"ch":["paxtonsmith","kierrasmith","keetonsmith","brittonsmith","kanyonsmith","tayleesmith"],"b":["1991","Watertown, Codington, South Dakota, USA"],"r":"You","kf":{"Married":"Tawni Lee Bludorn, 2011, Lake Norden","Family":"Father of six, seventh on the way"},"f":["Sixth confirmed generation of the family, living near Lake Norden on the same Hamlin County ground the Kangas and Johnson families broke in the 1880s and 1890s.","His six children are the seventh generation."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)"]},{"id":"tawni","n":"Tawni Lee (Bludorn) Smith","sx":"F","s":"core","g":0,"pa":["bobb","brendab"],"sp":["peyton"],"ch":["paxtonsmith","kierrasmith","keetonsmith","brittonsmith","kanyonsmith","tayleesmith"],"b":["1992","Watertown, Codington, South Dakota, USA"],"r":"Peyton's wife","kf":{"Maiden":"Bludorn, originally Bluedorn","Parents":"Bob and Brenda Bludorn","Married":"Peyton Paul Smith, 2011, Lake Norden","Work":"Founder of Drip Coffee"},"f":["Tawni Lee Bludorn grew up in the same Hamlin County world as Peyton; the Bludorns have been a Watertown, Florence, Hayti, and Lake Norden family for over a century, running the Bludorn Tavern in Florence and three generations of barbers in Hayti among her grandfather's brothers.","The name was originally Bluedorn, German, and her lines run German on the Bludorn, Struss, and Helser sides and French Huguenot on the Deyo side, the first non-Nordic half of this family tree.","Founder of Drip Coffee and mom of the seventh generation."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)"]},{"id":"bobb","n":"Robert H 'Bob' Bludorn","sx":"M","s":"tawni","g":1,"pa":["rogerb","leeb"],"sp":["brendab"],"ch":["tawni"],"r":"Tawni's dad","kf":{"Parents":"Roger Johnson Bludorn and Leola 'Lee' Helser","Wife":"Brenda","Home":"Lake Norden, SD","Siblings":"Bruce, Jim, Pete, Jane, Linda"},"f":["Bob Bludorn, son of Roger and Lee, settled in Lake Norden and raised his family there.","His siblings spread from Watertown to Mesa, Arizona; his brother Bruce (1956 to 2019) rests at Rose Hill Cemetery in Clark.","Through his father he descends from the Bluedorn Germans who came through Scott County, Minnesota, and through his mother from the Helsers and the French Huguenot Deyos.","Listed as \"Bob (Brenda) Bludorn of Lake Norden\" in his brother Bruce's 2019 obituary."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)","https://www.furnessfuneralhome.com/obituaries/bruce-bludorn"]},{"id":"brendab","n":"Brenda J (Bellikka) Bludorn","sx":"F","s":"tawni","g":1,"pa":["arvob","ardiss"],"sp":["bobb"],"ch":["tawni"],"b":["1954","Aberdeen, Brown, South Dakota, USA"],"r":"Tawni's mom","kf":{"Parents":"Arvo Evertt Bellikka and Ardis Erna Schlosser","Maiden":"Bellikka, originally Pellikka","Husband":"Bob Bludorn","Siblings":"Nine: six brothers, three sisters"},"f":["Brenda Bellikka, born 1954, is one of Arvo and Ardis Bellikka's ten children, raised in the Aberdeen Finnish community around the Old Apostolic Lutheran Church.","Her brothers Neil, Daryl, Gary, Glen, Scott, and Brian mostly stayed in Aberdeen; her sisters Connie Berg, Debra Landsem, and Rhonda Lock spread from Aberdeen to Battle Ground, Washington.","Bellikka is the Americanized form of Pellikka, a Finnish surname, which means both of Tawni's grandmothers' worlds and Peyton's entire mother's and father's mother's worlds trace to the same small Finnish Laestadian church.","The Bludorn and Smith families were connected through that network generations before Peyton and Tawni ever met."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)"]},{"id":"arvob","n":"Arvo Everett Bellikka","sx":"M","s":"tawni","g":2,"pa":["jacobbell","lizzieb"],"sp":["ardiss"],"ch":["brendab","bell_neil","bell_daryl","bell_gary","bell_glen","bell_scott","bell_brian","bell_connie","bell_debra","bell_rhonda"],"b":["14 Nov 1917",""],"d":["17 Oct 2002",""],"bu":["","Riverside Memorial Park, Aberdeen, Brown, South Dakota, USA"],"r":"Tawni's grandfather","kf":{"Born":"November 14, 1917","Parents":"Jacob and Lizzie Bellikka","Name":"Originally Pellikka, Finnish","Served":"Private First Class, US Army, WWII","Married":"Ardis Schlosser, June 16, 1946, Aberdeen","Children":"Ten","Buried":"Riverside Memorial Park, Aberdeen, SD"},"f":["Arvo Evertt Bellikka was born November 14, 1917 to Jacob and Lizzie Bellikka, confirmed by family memory and consistent with the records: Jacob, born 1878, was raising his family in the Finnish colony at Gackle, North Dakota in those years.","The family name was originally Pellikka; like Bluedorn to Bludorn and Pedersen to Smith, it got smoothed out in America.","He served as a Private First Class in the US Army in World War II and came home; his brother Arne, born two years after him and so alike that people took them for twins, was killed in battle in the Philippines in 1945.","Arvo married the schoolteacher Ardis Schlosser on June 16, 1946 in Aberdeen.","They farmed near Aberdeen and raised ten children, who gave them 55 grandchildren, including Tawni.","He died October 17, 2002 at 84 and rests at Riverside Memorial Park in Aberdeen."],"src":["Earlier family tree research notes"]},{"id":"ardiss","n":"Ardis Erna (Schlosser) Bellikka","sx":"F","s":"tawni","g":2,"pa":["johns","ernar"],"sp":["arvob"],"ch":["brendab","bell_neil","bell_daryl","bell_gary","bell_glen","bell_scott","bell_brian","bell_connie","bell_debra","bell_rhonda"],"b":["29 Aug 1926","Appleton, Swift, Minnesota, USA"],"d":["17 Mar 2007",""],"bu":["","Riverside Memorial Park, Aberdeen, Brown, South Dakota, USA"],"r":"Tawni's grandmother","kf":{"Born":"August 29, 1926, Appleton, MN","Parents":"John and Erna (Radke) Schlosser","Raised":"Farm near Frederick, SD","Education":"Northern State Teachers' College","Church":"Old Apostolic Lutheran, Aberdeen","Buried":"Riverside Memorial Park, Aberdeen, SD"},"f":["Ardis Erna Schlosser was born August 29, 1926 at Appleton, Minnesota to John and Erna (Radke) Schlosser, a German family, and was raised on their farm near Frederick, South Dakota, right beside the historic Savo Finnish colony.","She earned her teaching certificate at Northern State Teachers' College and taught in Brown County country schools, the same path Peyton's grandma Joanne walked in Hamlin County a few years later.","She married Arvo Bellikka in 1946, raised ten children on the farm, and was a lifelong member of the Old Apostolic Lutheran Church in Aberdeen, the same denomination as the Kangas, Johnson, Koski, and Kurkela families on Peyton's side.","She died March 17, 2007 at 80 and rests beside Arvo at Riverside Memorial Park.","Her obituary counted 55 grandchildren and 17 great grandchildren."],"src":["Earlier family tree research notes"]},{"id":"johns","n":"John Schlosser","sx":"M","s":"tawni","g":3,"pa":[],"sp":["ernar"],"ch":["ardiss"],"r":"Tawni's 2nd great grandfather","kf":{"Wife":"Erna Radke","Farmed":"Near Frederick, SD","Heritage":"German"},"f":["John Schlosser, a German farmer, raised his family at Appleton, Minnesota and then on the farm near Frederick, South Dakota.","Schlosser is German for locksmith.","His dates and parents are the open thread on this branch; the Frederick area records and his obituary in the Aberdeen American News would carry it back."],"src":["Earlier family tree research notes"]},{"id":"ernar","n":"Erna (Radke) Schlosser","sx":"F","s":"tawni","g":3,"pa":[],"sp":["johns"],"ch":["ardiss"],"r":"Tawni's 2nd great grandmother","kf":{"Husband":"John Schlosser","Maiden":"Radke, German"},"f":["Erna Radke, wife of John Schlosser, mother of Ardis.","Radke is a German surname from the northeast, Pomerania and Prussia country, which fits the German farming settlements around Frederick and Leola.","Her dates await her obituary or grave record."],"src":["Earlier family tree research notes"]},{"id":"jacobbell","n":"Jacob (Pellikka) Bellikka","sx":"M","s":"tawni","g":3,"pa":["pellikkasr","kaisasorvo"],"sp":["lizzieb"],"ch":["arvob","johnbellikka","hildabellikka","estherbellikka","arthurbellikka","annabellikka","edwinbellikka","arnebellikka","lydiabellikka","ellenbellikka","almabellikka"],"b":["25 Nov 1878","Revonlahti, Finland"],"d":["4 Oct 1963",""],"bu":["","Homola Cemetery, Gackle, Logan, North Dakota, USA"],"r":"Tawni's 2nd great grandfather","kf":{"Born":"November 25, 1878, Revonlahti, Finland","Parents":"Pellikka (b. 1836) and Kaisa Sorvo","Immigrated":"1885, through Rockport, MA","Homestead":"Filed summer 1902, 19 miles SW of Gackle, ND","Married":"Lizzie Lippo, fall 1902, Ellendale, ND","Children":"Twelve","Buried":"Homola Cemetery, Gackle, ND"},"f":["Jacob, son of Joseph Pellikka and Kaisa Sorvo, was born November 25, 1878 in Revonlahti, Finland, a farming parish south of Oulu.","In 1885, at age seven, he crossed with his family to Rockport, Massachusetts, then traveled to Carbon, Wyoming, and finally to Frederick, Dakota Territory, reaching Brown County in 1886, where the family farmed beside the Savo colony.","In the summer of 1902 he filed a homestead nineteen miles southwest of Gackle, North Dakota, and that fall married Lizzie Lippo at Ellendale.","They bought a few head of cattle and a horse and buggy, returned to the claim, and stayed with their neighbor John Homola until their sod house was finished.","With another neighbor, Jakob Allila, he broke the prairie with a horse and hand plow; the first crop failed, giving only a few bushels of flax.","Year by year he built it back: a frame house, a barn, twelve children, and 43 years of farming before he and Lizzie retired into Gackle in 1945.","Married Elizabeth Lippo on Oct 23, 1902 at Ellendale, ND; died Oct 4, 1963 at Jamestown, ND.","Father of at least 11 children (Gackle family group sheet)."],"src":["Earlier family tree research notes","https://freepages.rootsweb.com/~cats61/genealogy/gacklend/gacklefam/gp2135.htm"]},{"id":"lizzieb","n":"Elizabeth 'Lizzie' (Lippo) Bellikka","sx":"F","s":"tawni","g":3,"pa":["paullippo","tinalippo"],"sp":["jacobbell"],"ch":["arvob","johnbellikka","hildabellikka","estherbellikka","arthurbellikka","annabellikka","edwinbellikka","arnebellikka","lydiabellikka","ellenbellikka","almabellikka"],"b":["6 Jun 1884","Oulu, Finland"],"d":["3 Jun 1968",""],"bu":["","Homola Cemetery, Gackle, Logan, North Dakota, USA"],"r":"Tawni's 2nd great grandmother","kf":{"Born":"June 6, 1884, near Oulu, Finland (grave says 1882)","Parents":"Paul and Tina Lippo","Crossed":"Alone at 19, Liverpool to New York","Married":"Jacob Bellikka, fall 1902, Ellendale","Buried":"Homola Cemetery, Gackle, ND"},"f":["Elizabeth Lippo was born June 6, 1884 near Oulu, Finland to Paul and Tina Lippo, one of eight children.","Her brothers crossed to America first and saved to pay her passage.","At nineteen she boarded a ship at Liverpool, England, crossed the Atlantic entirely alone, landed in New York, and rode the train by herself to Aberdeen, South Dakota, where she worked as a maid around Brown County, including a stretch at the Sherman House.","She married Jacob Bellikka in the fall of 1902 at Ellendale and moved to the sod house on the Gackle claim.","She bore twelve children, ten of whom grew up; her second baby, a girl, died at two months, and the loss put her in bed for six months.","She raised the rest through prairie winters and sent two sons to World War II, one of whom never came home.","Born June 8, 1882 in Oulu province (\"Oululand\"), Finland; died June 3, 1968 at Wishek, ND."],"src":["Earlier family tree research notes","https://freepages.rootsweb.com/~cats61/genealogy/gacklend/gacklefam/gp2135.htm"]},{"id":"pellikkasr","n":"Joseph Pellikka","sx":"M","s":"tawni","g":4,"pa":[],"sp":["kaisasorvo"],"ch":["jacobbell"],"b":["1836","Revonlahti, Finland"],"r":"Tawni's 3rd great grandfather","kf":{"Wife":"Kaisa Sorvo","Immigrated":"1885, Rockport, MA, then Carbon, WY, then Frederick, DT","Children":"Six: Joseph Jr., Henry, Jacob, Kaisa, Sakarias, and one more"},"f":["Joseph Pellikka, named by family memory, was born in 1836 in Revonlahti, Finland, and married Kaisa Sorvo, born the same year in the same parish.","Their firstborn son carried his name, Finnish custom, and their son Jacob carried the family to Dakota.","In 1885, at nearly fifty, Joseph took the whole family across: ship to Rockport, Massachusetts, west to the coal town of Carbon, Wyoming, and on to Frederick, Dakota Territory in 1886, joining the Brown County Finnish colony.","His own parents sit one layer deeper than any index reaches: the digitized HisKi parish index for Revonlahti and its neighbors has a gap from 1861 to 1880 and no Pellikka entries, which means the family was likely recorded under a farm name.","The original church books survive as page scans at Finland's National Archives, readable by eye.","That is the door to the 1700s on this line."],"src":["Earlier family tree research notes"]},{"id":"kaisasorvo","n":"Kaisa (Sorvo) Pellikka","sx":"F","s":"tawni","g":4,"pa":[],"sp":["pellikkasr"],"ch":["jacobbell"],"b":["1836","Revonlahti, Finland"],"r":"Tawni's 3rd great grandmother","kf":{"Husband":"Joseph Pellikka","Children":"Six"},"f":["Kaisa Sorvo was born in 1836 in Revonlahti, the same parish and year as her husband.","She crossed the Atlantic at nearly fifty with six children and made a third life in Dakota after Massachusetts and Wyoming.","Kaisa is the Finnish form of Katherine, the same name as Peyton's 4th great grandmother Caisa on the Koivu line."],"src":["Earlier family tree research notes"]},{"id":"paullippo","n":"Paul Lippo","sx":"M","s":"tawni","g":4,"pa":[],"sp":["tinalippo"],"ch":["lizzieb"],"r":"Tawni's 3rd great grandfather","kf":{"Wife":"Tina","Children":"Eight, including Elizabeth","Home":"Oulu region, Finland"},"f":["Paul Lippo raised eight children near Oulu, Finland.","Several of his sons crossed to America first and earned the passage money that brought their sister Lizzie over alone in 1903.","Whether Paul himself ever emigrated or lived out his days in Finland is an open question for the Oulu parish books."],"src":["Earlier family tree research notes"]},{"id":"tinalippo","n":"Tina Lippo","sx":"F","s":"tawni","g":4,"pa":[],"sp":["paullippo"],"ch":["lizzieb"],"r":"Tawni's 3rd great grandmother","kf":{"Husband":"Paul Lippo","Children":"Eight"},"f":["Tina, wife of Paul Lippo, mother of Lizzie and her three sisters and four brothers.","Her story sits in the Oulu region parish records alongside Paul's."],"src":["Earlier family tree research notes"]},{"id":"rogerb","n":"Roger Johnson Bludorn","sx":"M","s":"tawni","g":2,"pa":["henrybb","agnesj"],"sp":["leeb"],"ch":["bobb","brucebludorn","jimbludorn","petebludorn","janebludorn","lindabludorn"],"b":["1923",""],"d":["1978",""],"r":"Tawni's grandfather","kf":{"Born":"1923","Parents":"Henry Bernard Bludorn and Agnes Johnson","Served":"US Army, Technician 5th Grade, WWII","Wife":"Leola 'Lee' Helser","Died":"1978"},"f":["Roger Johnson Bludorn carried his mother's maiden name as his middle name, an old custom that preserved the Johnson line in his own.","He served in World War II as a Technician Fifth Grade in the US Army, the same war that had his future in-law Claris Kenoyer building aircraft in Los Angeles.","He and Lee raised their family in the Watertown area: Bob, Bruce, Jim, Pete, Jane, and Linda.","He died in 1978 at about 55, young enough that his grandchildren, including Tawni, never knew him.","Son Bruce's obituary says the family raised its kids in Florence and Watertown."],"src":["Earlier family tree research notes","https://www.furnessfuneralhome.com/obituaries/bruce-bludorn"]},{"id":"leeb","n":"Leola M 'Lee' (Helser) Bludorn","sx":"F","s":"tawni","g":2,"pa":["henryh","gladysd"],"sp":["rogerb"],"ch":["bobb","brucebludorn","jimbludorn","petebludorn","janebludorn","lindabludorn"],"b":["1924",""],"d":["2007",""],"r":"Tawni's grandmother","kf":{"Born":"1924","Parents":"Henry W. Helser and Gladys Blanche Deyo","Husband":"Roger Johnson Bludorn"},"f":["Leola, called Lee her whole life, came from the Helser family of the St.","Paul, Minnesota area; her parents rest at Union Cemetery in Maplewood.","Helser is German, but her mother's line, the Deyos, traces to French Huguenot stock, Protestant refugees whose descendants spread west from the historic New Paltz settlement in New York.","She outlived Roger by nearly thirty years, dying in 2007 at about 83."],"src":["Earlier family tree research notes","https://www.furnessfuneralhome.com/obituaries/bruce-bludorn"]},{"id":"henrybb","n":"Henry Bernard Bludorn","sx":"M","s":"tawni","g":3,"pa":["henryjb","louisas"],"sp":["agnesj"],"ch":["rogerb"],"b":["21 Apr 1897",""],"d":["21 Oct 1968",""],"bu":["","Mount Hope Cemetery, Watertown, Codington, South Dakota, USA"],"r":"Tawni's 2nd great grandfather","kf":{"Born":"April 21, 1897","Parents":"Henry J Bluedorn and Louisa Caroline Struss","Wife":"Agnes Johnson","Buried":"Mount Hope Cemetery, Watertown, SD"},"f":["Henry Bernard Bludorn, son of the German immigrant generation, brought the family from Minnesota into the Watertown and Florence country and dropped the 'e' from Bluedorn along the way.","He and Agnes ran deep roots: their children included Dale (who tended the Bludorn Tavern in Florence), Grant 'Speed' (the Hayti barber whose sons cut hair after him), Gordon 'Budd', Una, Ramona, and Roger, Tawni's grandfather.","He died October 21, 1968 at 71 and rests at Mount Hope Cemetery in Watertown."],"src":["Earlier family tree research notes"]},{"id":"agnesj","n":"Agnes (Johnson) Bludorn","sx":"F","s":"tawni","g":3,"pa":[],"sp":["henrybb"],"ch":["rogerb"],"r":"Tawni's 2nd great grandmother","kf":{"Maiden":"Johnson","Husband":"Henry Bernard Bludorn","Children":"Dale, Roger, Grant 'Speed', Gordon, Una, Ramona"},"f":["Agnes Johnson married Henry Bernard Bludorn and raised the family in Florence and Watertown.","Her maiden name lives on as her son Roger's middle name.","Her grave record isn't indexed publicly, so her dates and her parents are the open thread on this branch; whether her Johnsons were Scandinavian like Peyton's Tornio Johnsons or something else entirely is a question her obituary would answer."],"src":["Earlier family tree research notes"]},{"id":"henryjb","n":"Henry J Bluedorn","sx":"M","s":"tawni","g":4,"pa":[],"sp":["louisas"],"ch":["henrybb"],"b":["1862",""],"d":["1942",""],"r":"Tawni's 3rd great grandfather","kf":{"Born":"1862","Wife":"Louisa Caroline Struss","Spelling":"Bluedorn, the original German form"},"f":["Henry J Bluedorn, born 1862, belongs to the German immigrant generation that settled Scott County, Minnesota, the farming country around Shakopee, before the family pushed west into South Dakota.","Bluedorn is German; his wife's Struss is German; the whole line is German farm stock.","He died in 1942 at about 80."],"src":["Earlier family tree research notes"]},{"id":"louisas","n":"Louisa Caroline (Struss) Bluedorn","sx":"F","s":"tawni","g":4,"pa":[],"sp":["henryjb"],"ch":["henrybb"],"b":["7 Nov 1861",""],"d":["1 Jan 1913",""],"bu":["","Valley Cemetery, Shakopee, Scott, Minnesota, USA"],"r":"Tawni's 3rd great grandmother","kf":{"Born":"November 7, 1861","Husband":"Henry J Bluedorn","Buried":"Valley Cemetery, Shakopee, MN"},"f":["Louisa Caroline Struss, born November 7, 1861, married Henry Bluedorn and raised the family in the German community around Shakopee, Minnesota.","She died on New Year's Day 1913 at 51, before the family's South Dakota chapter began, and rests at Valley Cemetery in Shakopee."],"src":["Earlier family tree research notes"]},{"id":"henryh","n":"Henry W. Helser","sx":"M","s":"tawni","g":3,"pa":[],"sp":["gladysd"],"ch":["leeb"],"b":["1893",""],"d":["12 Jan 1962",""],"bu":["","Union Cemetery, Maplewood, Ramsey, Minnesota, USA"],"r":"Tawni's 2nd great grandfather","kf":{"Born":"1893","Wife":"Gladys Blanche Deyo","Buried":"Union Cemetery, Maplewood, MN"},"f":["Helser, born 1893, raised his family in the St.","His daughter Lee carried the line into South Dakota when she married Roger Bludorn.","He died January 12, 1962 and rests at Union Cemetery in Maplewood beside Gladys."],"src":["Earlier family tree research notes"]},{"id":"gladysd","n":"Gladys Blanche (Deyo) Helser","sx":"F","s":"tawni","g":3,"pa":["wmdeyo","maryjones"],"sp":["henryh"],"ch":["leeb"],"b":["10 Mar 1900",""],"d":["21 Aug 1985",""],"bu":["","Union Cemetery, Maplewood, Ramsey, Minnesota, USA"],"r":"Tawni's 2nd great grandmother","kf":{"Born":"March 10, 1900","Parents":"William Alexander Deyo and Mary Elizabeth Jones","Husband":"Henry W. Helser","Buried":"Union Cemetery, Maplewood, MN"},"f":["Gladys Blanche Deyo, born March 10, 1900, carries the most distinctive surname in Tawni's tree.","Deyo is French Huguenot: the family descends from Protestant refugees who fled France in the 1600s, and the Deyo name is one of the founding families of the historic Huguenot settlement at New Paltz, New York, where the original Deyo stone house still stands.","Her branch of the family had moved west to Mower County, Minnesota by her parents' generation.","She lived to 85, dying August 21, 1985."],"src":["Earlier family tree research notes"]},{"id":"wmdeyo","n":"William Alexander Deyo","sx":"M","s":"tawni","g":4,"pa":["abeld","hannajb"],"sp":["maryjones"],"ch":["gladysd"],"b":["27 Sep 1851",""],"d":["30 Sep 1932",""],"bu":["","Dexter Cemetery, Mower, Minnesota, USA"],"r":"Tawni's 3rd great grandfather","kf":{"Born":"September 27, 1851, Wisconsin","Parents":"Abel Deyo and Hanna Jane Brown","Wife":"Mary Elizabeth Jones","Buried":"Dexter Cemetery, Mower County, MN","Heritage":"French Huguenot descent"},"f":["William Alexander Deyo was born September 27, 1851 in Wisconsin, a waypoint in the family's march west, and farmed in Mower County in southern Minnesota.","Two independent record sets name his parents as Abel Deyo and Hanna Jane Brown.","His surname traces in an unbroken line back to the Huguenot refugees of New Paltz, New York, making this the oldest American line in either family: Deyos were on this continent by the 1660s, a full two centuries before any of the Finns, Danes, or Norwegians in this tree stepped off a boat.","He died September 30, 1932, three days past his 81st birthday, and rests at Dexter Cemetery."],"src":["Earlier family tree research notes"]},{"id":"maryjones","n":"Mary Elizabeth (Jones) Deyo","sx":"F","s":"tawni","g":4,"pa":[],"sp":["wmdeyo"],"ch":["gladysd"],"b":["24 Dec 1854",""],"d":["12 Oct 1930",""],"bu":["","Dexter Cemetery, Mower, Minnesota, USA"],"r":"Tawni's 3rd great grandmother","kf":{"Born":"December 24, 1854","Husband":"William Alexander Deyo","Buried":"Dexter Cemetery, Mower County, MN"},"f":["Mary Elizabeth Jones, born Christmas Eve 1854, married William Deyo and raised the family in Mower County, Minnesota.","Jones is Welsh or English, adding one more thread to Tawni's side.","She died October 12, 1930 at 75."],"src":["Earlier family tree research notes"]},{"id":"abeld","n":"Abel Deyo","sx":"M","s":"tawni","g":5,"pa":[],"sp":["hannajb"],"ch":["wmdeyo"],"b":["1824",""],"d":["Feb 1880",""],"bu":["","Washington Cemetery, Spring Valley, Fillmore, Minnesota, USA"],"r":"Tawni's 4th great grandfather","kf":{"Born":"1824","Wife":"Hanna Jane Brown","Son":"William Alexander Deyo","Buried":"Washington Cemetery, Spring Valley, MN"},"f":["Abel Deyo, born 1824, carried the Huguenot name west in stages: his son William was born in Wisconsin in 1851, and by the 1850s or 60s the family had settled the Spring Valley area of Fillmore County in southern Minnesota, where a small Deyo colony took root.","He died in February 1880 at about 55 and rests at Washington Cemetery in Spring Valley.","Every Deyo in America descends from Christian Deyo, born about 1610 in Artois, France, a Huguenot who fled to Mannheim, Germany in 1660, crossed to America in 1675, and in 1677 signed the New Paltz patent as one of its twelve founders; his son Pierre built the first stone house on Huguenot Street in 1692, and it still stands.","Abel sits five or six generations below Christian; the exact chain runs through the published Deyo genealogy and the Historic Huguenot Street archives, documented but not yet copied into this tree.","He is, either way, the carrier of the oldest American bloodline in either family."],"src":["Earlier family tree research notes"]},{"id":"hannajb","n":"Hanna Jane (Brown) Deyo","sx":"F","s":"tawni","g":5,"pa":[],"sp":["abeld"],"ch":["wmdeyo"],"b":["1837",""],"d":["20 Sep 1896",""],"bu":["","Blaisdell Cemetery, Minnesota, USA"],"r":"Tawni's 4th great grandmother","kf":{"Born":"1837","Husband":"Abel Deyo","Son":"William Alexander Deyo","Buried":"Blaisdell Cemetery, MN"},"f":["Hanna Jane Brown, born 1837, married Abel Deyo and raised the family through the move to Minnesota.","Brown adds an English thread beside the French.","She outlived Abel by sixteen years, dying September 20, 1896 at 59, and rests at Blaisdell Cemetery."],"src":["Earlier family tree research notes"]},{"id":"keith","n":"Keith Edwin Smith","sx":"M","s":"smith","g":1,"pa":["charles","joanne"],"sp":["marymom"],"ch":["dainsmith","peyton","ericsmith","chadsmith","brittanysmith","jadesmith"],"b":["1966","Watertown, Codington, South Dakota, USA"],"r":"Peyton's dad","kf":{"Parents":"Charles and Joanne Smith","Married":"Mary Ann Kenoyer, 1989, Spearfish","Siblings":"Michael, Tamara, Scott, Autumn, Wayne, Roger, Sonja"},"f":["One of Charles and Joanne's eight children, raised on the family farm in rural Hamlin County.","Lives in Lake Norden with his wife Mary.","His seven siblings and their families spread from Lake Norden and Hayti to Sheridan, Wyoming and Yacolt, Washington."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)"]},{"id":"marymom","n":"Mary Ann (Kenoyer) Smith","sx":"F","s":"kenoyer","g":1,"pa":["stevek","annak"],"sp":["keith"],"ch":["dainsmith","peyton","ericsmith","chadsmith","brittanysmith","jadesmith"],"b":["1968","Madison, Lake, South Dakota, USA"],"r":"Peyton's mom","kf":{"Parents":"Stephen and Anna (Koski) Kenoyer","Married":"Keith Smith","Raised":"Black Hills country, western SD","Siblings":"Daniel, Katrina, Sonja"},"f":["Daughter of Steve and Anna Kenoyer, raised in western South Dakota where her dad served as a Highway Patrolman.","Her brother Daniel lives in Belle Fourche and her sisters Katrina Johnston and Sonja Massie live in Yacolt, Washington.","Through her mother she carries the Koski line, Finnish and Old Apostolic Lutheran, the same faith community as Keith's family in Lake Norden.","Both sides of this tree run through the same small Finnish church, one congregation on the prairie and one in the Black Hills, which is almost certainly the bridge that brought a Kenoyer from Rapid City together with a Smith from Lake Norden."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)"]},{"id":"stevek","n":"Stephen Lee Kenoyer","sx":"M","s":"kenoyer","g":2,"pa":["claris","helenr"],"sp":["annak"],"ch":["danielkenoyer","marymom","katrinakenoyer","sonjakenoyer"],"b":["7 Aug 1938","Hot Springs, Fall River, South Dakota, USA"],"d":["17 Jan 2026",""],"bu":["","Black Hills National Cemetery, Sturgis, Meade, South Dakota, USA"],"r":"Peyton's grandpa","kf":{"Born":"Hot Springs, SD","Parents":"Claris and Helen (Rickenbach) Kenoyer","Served":"US Army, drafted 1961, Ft. Hood","Married":"Anna Koski, June 19, 1965, Sturgis","Career":"SD Highway Patrol, 1965 to 1983","Buried":"Black Hills National Cemetery"},"f":["Steve was born August 7, 1938 in Hot Springs and lived his first four years in Oelrichs.","During World War II the family moved near Los Angeles, where his father built aircraft, then to Wichita, and after the war back to a farm east of Sturgis.","After high school he spent three years near San Diego working in an aircraft factory himself, then came home to Sturgis and joined the city police force.","He was drafted into the Army in 1961 and stationed at Ft.","On June 19, 1965 he married Anna Koski in Sturgis, and that same year he was hired by the South Dakota Highway Patrol, serving four years stationed in Howard and then many more in Wall, patrolling until retirement in 1983.","He later worked for Dave Hahn in Wall and spent years at a gold processing company in Rapid City."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)"]},{"id":"annak","n":"Anna Phyllis (Koski) Kenoyer","sx":"F","s":"kenoyer","g":2,"pa":["arvok","alinak"],"sp":["stevek"],"ch":["danielkenoyer","marymom","katrinakenoyer","sonjakenoyer"],"r":"Peyton's grandma","kf":{"Parents":"Arvo and Alina Koski","Married":"Steve Kenoyer, 1965, Sturgis","Siblings":"Tom, Norma, Donald, Darlene, Barbara, Clarence 'Willie'","Church":"Old Apostolic Lutheran"},"f":["Anna comes from the Koski family, Finnish ranchers of the Black Hills country.","Her parents Arvo and Alina raised their family on a ranch near Highmore, with children born in Deadwood, and the family was rooted in the Old Apostolic Lutheran Church, the same Finnish Laestadian denomination as the Kangas and Johnson families of Lake Norden.","She married Steve Kenoyer in Sturgis in 1965 and raised four children through his Highway Patrol postings in Howard and Wall before the family settled west of Rapid City in 1990.","Her siblings spread across the region: Tom in Wyoming, Norma Hoffman in Belle Fourche, Donald in Sheridan, and Willie in Whitewood, with a family connection reaching back to Lake Norden through the Wilens.","Koski is Finnish for rapids."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)"]},{"id":"claris","n":"Claris Ervin Kenoyer","sx":"M","s":"kenoyer","g":3,"pa":[],"sp":["helenr"],"ch":["stevek"],"b":["16 Oct 1902",""],"d":["6 Oct 1995",""],"bu":["","Bear Butte Cemetery, Sturgis, Meade, South Dakota, USA"],"r":"Peyton's great grandfather","kf":{"Born":"October 16, 1902","WWII":"Aircraft factory worker, Los Angeles and Wichita","Farmed":"East of Sturgis, SD","Wife":"Helen Rickenbach","Buried":"Bear Butte Cemetery, Sturgis, SD"},"f":["Claris Ervin Kenoyer was born October 16, 1902, outside South Dakota; the Kenoyers are a German Swiss family that moved west through the Midwest before reaching the Black Hills country.","He raised his family in Hot Springs and Oelrichs, then moved them near Los Angeles during World War II to build aircraft, then to Wichita, and home again to a farm east of Sturgis.","He was a charter board member of the Western Dakota Antique Club at its 1969 founding, and the club's permanent 40 acre showgrounds east of the Sturgis airport is land purchased from Claris and Helen.","His sons were Robert, Clifford, Stephen, and Donald.","He died October 6, 1995, ten days short of 93, and rests at Bear Butte Cemetery in Sturgis in the shadow of the mountain."],"src":["Earlier family tree research notes"]},{"id":"helenr","n":"Helen M (Rickenbach) Kenoyer","sx":"F","s":"kenoyer","g":3,"pa":[],"sp":["claris"],"ch":["stevek"],"b":["8 Aug 1910",""],"d":["10 Feb 2001",""],"bu":["","Bear Butte Cemetery, Sturgis, Meade, South Dakota, USA"],"r":"Peyton's great grandmother","kf":{"Born":"August 8, 1910","Maiden":"Rickenbach, a Swiss German name","Husband":"Claris Kenoyer","Sons":"Robert, Clifford, Stephen, Donald","Buried":"Bear Butte Cemetery, Sturgis, SD"},"f":["Helen Rickenbach was born August 8, 1910, from the Rickenbach family of the Hot Springs area in the southern Black Hills.","Rickenbach is a Swiss German name, a river town in Switzerland.","She followed Claris through the wartime moves to California and Kansas and back to the Sturgis farm, raising four boys along the way, and later selling the showgrounds land with Claris to the antique club he helped found.","She died February 10, 2001 at 90 and rests beside Claris at Bear Butte Cemetery."],"src":["Earlier family tree research notes"]},{"id":"arvok","n":"Arvo Nestor Koski","sx":"M","s":"kenoyer","g":3,"pa":["nestor","ainam"],"sp":["alinak"],"ch":["annak"],"b":["1906",""],"d":["1987",""],"bu":["","Rose Hill Cemetery, Spearfish, Lawrence, South Dakota, USA"],"r":"Peyton's great grandfather","kf":{"Born":"1906","Parents":"Nestor Koski and Aina Maria","Ranched":"Near Highmore, SD","Children":"Seven known","Buried":"Rose Hill Cemetery, Spearfish, SD"},"f":["Arvo Nestor Koski, born 1906 to the Finnish immigrants Nestor and Aina Maria Koski, ranched near Highmore in central South Dakota and raised at least seven children: Tom, Norma, Anna, Donald, Darlene, Barbara, and Clarence 'Willie', the older ones born in Deadwood.","The family anchored itself in the Old Apostolic Lutheran Church, the same Finnish Laestadian denomination as the Kangas and Johnson families of Lake Norden, with the Black Hills congregation at Spearfish.","He died in 1987 and rests at Rose Hill Cemetery in Spearfish, where his daughter Norma joined him in 2025."],"src":["Earlier family tree research notes"]},{"id":"alinak","n":"Mary Alina Koski","sx":"F","s":"kenoyer","g":3,"pa":["johnjern","annaherr"],"sp":["arvok"],"ch":["annak"],"b":["1905",""],"d":["4 Jan 1987",""],"bu":["","Rose Hill Cemetery, Spearfish, Lawrence, South Dakota, USA"],"r":"Peyton's great grandmother","kf":{"Born":"1905","Husband":"Arvo Nestor Koski","Children":"Seven known","Buried":"Rose Hill Cemetery, Spearfish, SD"},"f":["Mary Alina, who went by Alina, was born in 1905 and raised seven children on the Highmore ranch with Arvo.","Alina is a Finnish name; her maiden name is still the open question on this line, one that grandma Anna can answer.","She and Arvo died the same year: she went first, January 4, 1987, and he followed within months.","They rest together at Rose Hill Cemetery in Spearfish."],"src":["Earlier family tree research notes"]},{"id":"johnjern","n":"John Jernberg","sx":"M","s":"kenoyer","g":4,"pa":[],"sp":["annaherr"],"ch":["alinak"],"b":["1873",""],"d":["1949",""],"bu":["","Grand River Cemetery, Harding, South Dakota, USA"],"r":"Peyton's 2nd great grandfather","kf":{"Born":"1873","Wife":"Anna Herrala","Homesteaded":"Finnish colony, Harding County, SD","Children":"Alina, Julia, John Hubert, Matt, Innes, and more","Buried":"Grand River Cemetery, Harding County, SD"},"f":["John Jernberg, born 1873, carried a Swedish name, iron mountain, but lived his life among Finns, marrying Anna Herrala and homesteading in the Finnish colony of Harding County, the remote shortgrass country in South Dakota's far northwest corner near Buffalo.","He was born the same year as John Everett Johnson on the other side of Peyton's family, another Swedish-named man in a Finnish world.","His children included Alina, Julia (who married a Katka), John Hubert, Matt, and Innes; two of his sons were military veterans.","He outlived his wife by ten years, dying in 1949, and rests at Grand River Cemetery among the colony he helped build."],"src":["Earlier family tree research notes"]},{"id":"annaherr","n":"Anna (Herrala) Jernberg","sx":"F","s":"kenoyer","g":4,"pa":["manuelh","johannah"],"sp":["johnjern"],"ch":["alinak"],"b":["1880",""],"d":["1939",""],"bu":["","Grand River Cemetery, Harding, South Dakota, USA"],"r":"Peyton's 2nd great grandmother","kf":{"Born":"1880","Parents":"Manuel and Johanna Herrala","Husband":"John Jernberg","Buried":"Grand River Cemetery, Harding County, SD"},"f":["Anna Herrala, born 1880 to Manuel and Johanna Herrala, raised her family on the Harding County homestead.","Herrala is a Finnish place surname, from Herrala in southern Finland.","Her name has now traveled the generations: Anna Herrala to her granddaughter Anna Koski, who is Peyton's grandma Anna Kenoyer, who confirmed this very line by text message at one in the morning.","She died in 1939 at about 59 and rests at Grand River Cemetery beside John and her parents."],"src":["Earlier family tree research notes"]},{"id":"manuelh","n":"Manuel Herrala","sx":"M","s":"kenoyer","g":5,"pa":[],"sp":["johannah"],"ch":["annaherr"],"b":["1852","Finland"],"d":["2 Feb 1924",""],"bu":["","Grand River Cemetery, Harding, South Dakota, USA"],"r":"Peyton's 3rd great grandfather","kf":{"Born":"1852, Finland","Wife":"Johanna","Buried":"Grand River Cemetery, Harding County, SD"},"f":["Manuel Herrala, born 1852 in Finland, is the Herrala immigrant, one of the Finns who carried the colony impulse to its furthest edge: Harding County, about as remote as Dakota homesteading ever got.","He died February 2, 1924 at about 71.","He and Johanna, born the same year, died the same year too, ten weeks apart, and rest together at Grand River Cemetery.","He is the deepest confirmed root on Peyton's mother's side, born the same decade as Erick Kangas on his father's side and the Pellikka patriarch on Tawni's."],"src":["Earlier family tree research notes"]},{"id":"johannah","n":"Johanna Herrala","sx":"F","s":"kenoyer","g":5,"pa":[],"sp":["manuelh"],"ch":["annaherr"],"b":["1852","Finland"],"d":["13 Apr 1924",""],"bu":["","Grand River Cemetery, Harding, South Dakota, USA"],"r":"Peyton's 3rd great grandmother","kf":{"Born":"1852, Finland","Husband":"Manuel Herrala","Buried":"Grand River Cemetery, Harding County, SD"},"f":["Johanna, born 1852 in Finland like her husband, crossed the ocean and ended on the shortgrass prairie of Harding County.","She followed Manuel in death by just ten weeks in the spring of 1924, a pattern this family repeats: Arvo and Alina Koski also died within months of each other in 1987.","She rests beside Manuel at Grand River Cemetery."],"src":["Earlier family tree research notes"]},{"id":"charles","n":"Charles Peter Smith","sx":"M","s":"smith","g":2,"pa":["eddie","esther"],"sp":["joanne"],"ch":["keith","michaelsmith","tamarasmith","scottsmith","autumnsmith","rogersmith","sonjasmithhomola","waynesmith"],"b":["20 Apr 1932","Erwin, Kingsbury, South Dakota, USA"],"d":["13 Mar 2025",""],"bu":["","Old Apostolic Lutheran Church, Lake Norden, Hamlin, South Dakota, USA"],"r":"Peyton's grandpa","kf":{"Born":"Rural Erwin, SD","Parents":"Eddie and Esther (Berger) Smith","Married":"Audrey Joanne Johnson, June 2, 1956","Children":"Eight","Buried":"Old Apostolic Lutheran Church, Lake Norden"},"f":["Charles was born at rural Erwin, South Dakota on April 20, 1932 to Eddie and Esther (Berger) Smith, one of at least six kids alongside Elwood, Donald, Leonard, Marvin, and Joy.","He served four years in the US Air Force, worked at Cy Jensen's gas station, then farmed until retirement, with a twelve year stretch as a substitute mail carrier on top.","On June 2, 1956 he married Audrey Joanne Johnson, and together they raised eight children on a farm in rural Hamlin County: Michael, Tamara, Scott, Autumn, Keith, Wayne, Roger, and Sonja.","A lifelong member of the Old Apostolic Lutheran Church, he stayed steadfast in his faith to the end.","In his later years he loved driving around the area visiting family and friends.","He died of natural causes on March 13, 2025 at 92, having outlived Joanne by two and a half years, his grandson Logan, granddaughter Laurel, and six great grandchildren.","Served four years in the US Air Force, worked at Cy Jensen's gas station, farmed, and was a substitute mail carrier for 12 years.","Outlived his brothers Elwood, Donald, Leonard and Marvin, his grandson Logan, granddaughter Laurel and six great-grandchildren, including Trenton Monty Smith (d. 2022)."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)","https://www.geisefuneralhome.com/obituary/charles-smith","https://www.geisefuneralhome.com/obituaries/trenton-smith"]},{"id":"joanne","n":"Audrey Joanne (Johnson) Smith","sx":"F","s":"smith","g":2,"pa":["edwinj","lempi"],"sp":["charles"],"ch":["keith","michaelsmith","tamarasmith","scottsmith","autumnsmith","rogersmith","sonjasmithhomola","waynesmith"],"b":["17 Jul 1934","Bryant, Hamlin, South Dakota, USA"],"d":["12 Sep 2022","Lake Norden, Hamlin, South Dakota, USA"],"bu":["","Lake Norden, Hamlin, South Dakota, USA"],"r":"Peyton's grandma","kf":{"Born":"Rural Bryant, SD","Parents":"Edwin and Lempi (Kangas) Johnson","Education":"Aberdeen Teaching College","Married":"Charles P. Smith, June 2, 1956","Buried":"Lake Norden"},"f":["Joanne was born July 17, 1934 in rural Bryant, South Dakota to Edwin and Lempi (Kangas) Johnson.","Her siblings were Alfred, Leon, Eldon, Joyce, and Jean.","Note the family pattern: her brother Alfred carried her grandfather Alfred Kangas's name, and her brother Eldon was formally Edwin, after their dad.","She graduated from Lake Norden High School, earned a teaching degree from Aberdeen Teaching College, and taught in the local country schools until she married Charles in 1956.","From then on her work was the farm and the eight kids they raised on it.","She was a member of the Old Apostolic Lutheran Church, the same Finnish Laestadian congregation her mother's family helped anchor for three generations."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)","https://www.geisefuneralhome.com/obituary/audrey-smith"]},{"id":"eddie","n":"Eddie Smith","sx":"M","s":"smith","g":3,"pa":["peters","elsiec"],"sp":["esther"],"ch":["elwoodsmith","donaldsmith","leonardsmith","marvinsmith","joysmith","charles"],"b":["28 May 1899","Kingsbury, South Dakota, USA"],"d":["20 Jan 1985",""],"bu":["","Badger Cemetery, Badger, Kingsbury, South Dakota, USA"],"r":"Peyton's great grandfather","kf":{"Born":"May 28, 1899, Kingsbury County, SD","Parents":"Peter Christian Smith and Elsie Marie Christensen","Wife":"Esther Berger","Farmed":"Near Erwin, SD","Buried":"Badger Cemetery, Badger, SD"},"f":["Eddie was born May 28, 1899 in Kingsbury County, one of at least nine children of Peter Christian Smith and Elsie Marie Christensen; his siblings carried names like Ludolph, Martin, Carl, George, Clarence, Albert, and Mary.","The family was Danish on both sides.","He farmed near Erwin and raised six children with Esther: Charles, Elwood, Donald, Leonard, Marvin, and Joy.","His delayed birth registration, filed August 10, 1957 with the file number right before Esther's, records the day the two of them went to the courthouse together.","He died January 20, 1985 at 85 and rests at Badger Cemetery in Badger, the little Kingsbury County town at the center of the family's world.","Badger Cemetery (Kingsbury Co.) gravestone listings include \"SMITH, Eddie\" and \"SMITH, Esther A.\"","Son Donald's obituary says Donald was born on \"the family homestead near Badger\" in 1933.","Children confirmed by obituaries: Elwood, Charles, Donald, Leonard, Marvin and Joy. Son Donald alone had 11 children."],"src":["Earlier family tree research notes","https://southdakotagravestones.org/cemetery.php?cemID=156","https://www.madisondailyleader.com/obituaries/archives/article_1a8d43a6-93c8-57f4-abd6-796bce2dc2c4.html","https://www.geisefuneralhome.com/obituary/charles-smith"]},{"id":"esther","n":"Esther Anna (Berger) Smith","sx":"F","s":"smith","g":3,"pa":["henryb","thea"],"sp":["eddie"],"ch":["charles","elwoodsmith","donaldsmith","leonardsmith","marvinsmith","joysmith"],"b":["8 Oct 1904","Kingsbury, South Dakota, USA"],"d":["15 May 2004",""],"bu":["","Badger Cemetery, Badger, Kingsbury, South Dakota, USA"],"r":"Peyton's great grandmother","kf":{"Born":"October 8, 1904, Kingsbury County, SD","Parents":"Henry Christian Berger and Thea Anderson","Husband":"Eddie Smith","Buried":"Badger Cemetery, Badger, SD"},"f":["Esther was born October 8, 1904 in Kingsbury County to Henry Christian Berger, of German stock, and Thea Anderson, of Danish stock.","Her mother died in 1917 when Esther was only twelve, leaving Henry with the family.","She married Eddie Smith and raised their six children on the farm near Erwin.","She outlived Eddie by nineteen years and lived to see the year 2000, dying May 15, 2004 at 99 years old, five months short of a century that began with horse-drawn plows and ended with the internet.","She rests beside Eddie at Badger Cemetery.","Recorded as \"Esther A. Berger\" and \"Esther Berger\" as the mother on her sons' Social Security claims.","Gravestone listed at Badger Cemetery as \"SMITH, Esther A.\""],"src":["Earlier family tree research notes","https://sortedbyname.com/letter_s/smith/eddie_smith_4.html","https://sortedbyname.com/letter_s/smith/index_4188.html","https://southdakotagravestones.org/cemetery.php?cemID=156"]},{"id":"peters","n":"Peter Christian Smith","sx":"M","s":"smith","g":4,"pa":["laurst","elsemarie"],"sp":["elsiec"],"ch":["ludolphsmithpc","martinsmithpc","carlsmithpc","georgesmithpc","clarencesmithpc","albertsmithpc","marysmithpc","eddie"],"b":["1869","Denmark"],"d":["1939",""],"bu":["","Kingsbury, South Dakota, USA"],"r":"Peyton's 2nd great grandfather","kf":{"Born":"1869, Denmark","Parents":"Laurst Pedersen and Else Marie Madsen","Wife":"Elsie Marie Christensen","Name":"Born a Pedersen; became Smith in America","Buried":"Kingsbury County, SD"},"f":["Here's the answer to why the family is named Smith: Peter Christian was born a PEDERSEN in Denmark in 1869, son of Laurst Pedersen and Else Marie Madsen.","His father died when Peter was about seven.","His mother remarried, and between 1883 and 1886 she brought the family to America, settling in Hamlin County.","Somewhere in that crossing, Peter Christian Pedersen became Peter Christian Smith, a common move for Danes tired of spelling their name for Yankee clerks.","He married Elsie Marie Christensen, daughter of Kingsbury County's first settlers, and they raised at least nine children on the Kingsbury County land, including Eddie, born 1899.","His great grandson Charles carried his name: Charles Peter Smith."],"src":["Earlier family tree research notes"]},{"id":"elsiec","n":"Elsie Marie (Christensen) Smith","sx":"F","s":"smith","g":4,"pa":["larsc","marenk"],"sp":["peters"],"ch":["ludolphsmithpc","martinsmithpc","carlsmithpc","georgesmithpc","clarencesmithpc","albertsmithpc","marysmithpc","eddie"],"b":["1875","Renner, Minnehaha, South Dakota, USA"],"d":["1932",""],"r":"Peyton's 2nd great grandmother","kf":{"Born":"1875, near Renner, SD","Parents":"Lars Christensen and Maren Katherene Pedersen","Husband":"Peter Christian Smith","Family":"Daughter of Kingsbury County's first settlers"},"f":["Elsie Marie was born in 1875 near Renner in southeastern Dakota Territory, and at age two her parents carried her and her little brother Chris to Kingsbury County, where, in the words recorded on her memorial, her parents Lars and Maren Christensen were the first white settlers in Kingsbury County.","She grew up with the county itself, married the Danish immigrant Peter Christian Smith, and raised at least nine children.","She died in 1932 at about 57, the same year her grandson Charles was born."],"src":["Earlier family tree research notes"]},{"id":"henryb","n":"Henry Christian Berger","sx":"M","s":"smith","g":4,"pa":["henrich","annaliz"],"sp":["thea"],"ch":["esther"],"b":["5 May 1875",""],"d":["10 Feb 1940",""],"bu":["","St. Peters German Lutheran Cemetery, Badger, Kingsbury, South Dakota, USA"],"r":"Peyton's 2nd great grandfather","kf":{"Born":"May 5, 1875","Parents":"Henrich Berger and Anna Elizabeth Laker","Wife":"Thea Anderson","Buried":"St. Peters German Lutheran Cemetery, Badger, SD"},"f":["Henry Christian Berger was born May 5, 1875 to Henrich Berger and Anna Elizabeth Laker, a German family; the Bergers worshipped at St.","Peters German Lutheran Church at Badger, and three generations of them rest in its cemetery.","He married Thea Anderson, a Danish girl from the neighboring community, and their daughter Esther was born in 1904.","Thea died young in 1917, leaving Henry a widower at 42 with children still at home.","He died February 10, 1940 at 64 and was buried beside Thea at St."],"src":["Earlier family tree research notes"]},{"id":"thea","n":"Thea (Anderson) Berger","sx":"F","s":"smith","g":4,"pa":["andrewa","josephine"],"sp":["henryb"],"ch":["esther"],"b":["9 Feb 1884",""],"d":["29 Aug 1917",""],"bu":["","St. Peters German Lutheran Cemetery, Badger, Kingsbury, South Dakota, USA"],"r":"Peyton's 2nd great grandmother","kf":{"Born":"February 9, 1884","Parents":"Andrew J Anderson and Josephine Anderson","Husband":"Henry Christian Berger","Buried":"St. Peters German Lutheran Cemetery, Badger, SD"},"f":["Thea Anderson was born February 9, 1884 to Andrew and Josephine Anderson, a Danish family of the Badger community whose graves lie in the Danish Lutheran Cemetery there.","She married the German Henry Berger and bore Esther in 1904.","She died August 29, 1917, just 33 years old, when Esther was twelve.","The year suggests the era's hard realities: 1917 and 1918 took many young mothers through influenza and childbirth, though her cause isn't recorded in what's public.","Peters German Lutheran Cemetery at Badger, and her daughter lived another 87 years carrying her memory."],"src":["Earlier family tree research notes"]},{"id":"laurst","n":"Laurst 'Lars' Pedersen","sx":"M","s":"smith","g":5,"pa":[],"sp":["elsemarie"],"ch":["peters"],"b":["1824","Denmark"],"d":["1876","Denmark"],"r":"Peyton's 3rd great grandfather","kf":{"Born":"1824, Denmark","Died":"1876, Denmark","Wife":"Else Marie Madsen, m. 1868","Children":"Three known, including Peter Christian"},"f":["Laurst Pedersen lived and died entirely in Denmark, born 1824, married Else Marie Madsen in 1868, father of three, dead by 1876 when his son Peter was about seven.","He never saw America; America came for his children.","He is the ancestor the Smith name erased and the reason it exists: his son dropped Pedersen at the water's edge."],"src":["Earlier family tree research notes"]},{"id":"elsemarie","n":"Else Marie (Madsen) Pedersen","sx":"F","s":"smith","g":5,"pa":[],"sp":["laurst"],"ch":["peters"],"b":["1844","Denmark"],"d":["1890",""],"r":"Peyton's 3rd great grandmother","kf":{"Born":"1844, Denmark","Married":"Laurst Pedersen 1868; widowed 1876; remarried Lars Madsen 1879","Immigrated":"Between 1883 and 1886","Settled":"Hamlin County, SD"},"f":["Else Marie Madsen is the one who made the crossing.","Widowed at about 32 with three children, she remarried in Denmark in 1879 and had four more, then between 1883 and 1886 brought the blended family across the Atlantic to Hamlin County, Dakota Territory.","She got seven years on the prairie before dying in 1890 at about 46.","Her son Peter Christian, by then a Smith, carried the family forward.","Every Smith in this tree descends from her decision to leave."],"src":["Earlier family tree research notes"]},{"id":"larsc","n":"Lars Christensen","sx":"M","s":"smith","g":5,"pa":[],"sp":["marenk"],"ch":["elsiec"],"b":["25 Nov 1841","Denmark"],"d":["27 Jan 1913",""],"bu":["","Poinsett Cemetery, Kingsbury, South Dakota, USA"],"r":"Peyton's 3rd great grandfather · first settler","kf":{"Born":"November 25, 1841, Denmark","Wife":"Maren Katherene Pedersen","Arrived":"Kingsbury County about 1877","Buried":"Poinsett Cemetery, Kingsbury County, SD"},"f":["Lars Christensen holds the biggest title in the tree: family and community memory records that he and Maren were the first white settlers in Kingsbury County, arriving around 1877 with a two year old daughter, Elsie, and infant son Chris, before Erwin, before Badger, before the railroads.","A Dane who chose empty prairie and made it home, he lived 36 years on the land he broke first, dying January 27, 1913 at 71.","He's buried at Poinsett Cemetery near the lake, in ground he settled before it had a name on any map.","Between Lars breaking Kingsbury County and Joseph Roisum's farm becoming Lake Norden, Peyton descends from the founding families of two counties."],"src":["Earlier family tree research notes"]},{"id":"marenk","n":"Maren Katherene (Pedersen) Christensen","sx":"F","s":"smith","g":5,"pa":[],"sp":["larsc"],"ch":["elsiec"],"b":["21 Apr 1843","Denmark"],"d":["24 Jul 1921",""],"bu":["","Poinsett Cemetery, Kingsbury, South Dakota, USA"],"r":"Peyton's 3rd great grandmother · first settler","kf":{"Born":"April 21, 1843, Denmark","Husband":"Lars Christensen","Buried":"Poinsett Cemetery, Kingsbury County, SD"},"f":["Maren Katherene crossed the ocean and then crossed the prairie with a toddler and a baby, arriving in an empty Kingsbury County around 1877 as its first settler alongside Lars.","Whatever the first winter in a claim shanty on treeless ground was like, she survived it and forty more.","She outlived Lars by eight years, dying July 24, 1921 at 78, and rests beside him at Poinsett Cemetery."],"src":["Earlier family tree research notes"]},{"id":"henrich","n":"Henrich 'Henry' Berger","sx":"M","s":"smith","g":5,"pa":[],"sp":["annaliz"],"ch":["henryb"],"b":["1 Mar 1840","Germany"],"d":["17 Jun 1898",""],"bu":["","St. Peters German Lutheran Cemetery, Badger, Kingsbury, South Dakota, USA"],"r":"Peyton's 4th great grandfather","kf":{"Born":"March 1, 1840, Germany","Wife":"Anna Elizabeth Laker","Buried":"St. Peters German Lutheran Cemetery, Badger, SD"},"f":["Henrich Berger, born March 1, 1840 in Germany, brought the Berger name to Dakota and helped anchor the German Lutheran community at Badger.","He died June 17, 1898 at 58 and lies at St.","Peters German Lutheran Cemetery, the oldest Berger in its ground."],"src":["Earlier family tree research notes"]},{"id":"annaliz","n":"Anna Elizabeth (Laker) Berger","sx":"F","s":"smith","g":5,"pa":[],"sp":["henrich"],"ch":["henryb"],"b":["3 Feb 1838","Germany"],"d":["18 Jun 1925",""],"bu":["","St. Peters German Lutheran Cemetery, Badger, Kingsbury, South Dakota, USA"],"r":"Peyton's 4th great grandmother","kf":{"Born":"February 3, 1838, Germany","Husband":"Henrich Berger","Buried":"St. Peters German Lutheran Cemetery, Badger, SD"},"f":["Anna Elizabeth Laker, born February 3, 1838, outlived Henrich by 27 years, dying June 18, 1925 at 87.","Born when Martin Van Buren was president, she lived to the age of radio.","She rests beside Henrich at St.","Peters, the deepest documented root on the German side."],"src":["Earlier family tree research notes"]},{"id":"andrewa","n":"Andrew J Anderson","sx":"M","s":"smith","g":5,"pa":[],"sp":["josephine"],"ch":["thea"],"b":["8 Nov 1849","Denmark"],"d":["8 Jun 1919",""],"bu":["","Danish Lutheran Cemetery, Badger, Kingsbury, South Dakota, USA"],"r":"Peyton's 4th great grandfather","kf":{"Born":"November 8, 1849, Denmark","Wife":"Josephine","Buried":"Danish Lutheran Cemetery, Badger, SD"},"f":["Andrew J Anderson, born November 8, 1849, was part of the Danish colony at Badger; he and Josephine lie in the Danish Lutheran Cemetery there, a few miles from the German Lutheran cemetery holding their daughter Thea and her Berger in-laws.","He died June 8, 1919, having outlived Thea by two years."],"src":["Earlier family tree research notes"]},{"id":"josephine","n":"Josephine Anderson","sx":"F","s":"smith","g":5,"pa":[],"sp":["andrewa"],"ch":["thea"],"b":["8 Jan 1856",""],"d":["26 May 1932",""],"bu":["","Danish Lutheran Cemetery, Badger, Kingsbury, South Dakota, USA"],"r":"Peyton's 4th great grandmother","kf":{"Born":"January 8, 1856","Husband":"Andrew J Anderson","Buried":"Danish Lutheran Cemetery, Badger, SD"},"f":["Josephine Anderson, born January 8, 1856, buried her daughter Thea in 1917 and her husband Andrew in 1919, then carried on another thirteen years, dying May 26, 1932 at 76.","She rests at the Danish Lutheran Cemetery at Badger."],"src":["Earlier family tree research notes"]},{"id":"nestor","n":"Nestor Koski","sx":"M","s":"kenoyer","g":4,"pa":[],"sp":["ainam"],"ch":["arvok"],"b":["1877","Finland"],"d":["1934",""],"r":"Peyton's 2nd great grandfather","kf":{"Born":"1877, Finland","Wife":"Aina Maria","Son":"Arvo Nestor Koski","Settled":"South Dakota"},"f":["Nestor Koski, born 1877, is the Koski immigrant, a Finn who brought the family to South Dakota.","His son carried his name as a middle name, Arvo Nestor.","He died in 1934 at about 57.","Koski means rapids, the white water of a Finnish river."],"src":["Earlier family tree research notes"]},{"id":"ainam","n":"Aina Maria Koski","sx":"F","s":"kenoyer","g":4,"pa":[],"sp":["nestor"],"ch":["arvok"],"r":"Peyton's 2nd great grandmother","kf":{"Husband":"Nestor Koski","Son":"Arvo Nestor Koski"},"f":["Aina Maria, wife of Nestor, mother of Arvo.","Aina is another deeply Finnish name.","Her dates and maiden name sit one record deeper than public sources reach today; her grave record is linked to Nestor's and would give both."],"src":["Earlier family tree research notes"]},{"id":"edwinj","n":"Edwin Joel Johnson","sx":"M","s":"smith","g":3,"pa":["johne","matilda"],"sp":["lempi"],"ch":["eldonjohnson","alfredjohnsonj","leonjohnsonj","joycejohnsonj","jeanjohnsonj","joanne"],"b":["23 Nov 1906","Braddock, Emmons, North Dakota, USA"],"d":["18 Mar 1981","Robbinsdale, Hennepin, Minnesota, USA"],"bu":["","Apostolic Cemetery, Lake Norden, Hamlin, South Dakota, USA"],"r":"Peyton's great grandfather","kf":{"Born":"Braddock, Emmons County, North Dakota","Parents":"John Everett Johnson and Matilda Anna Roisum","Married":"Lempi Kangas, Dec 20, 1930, Watertown, SD","Farmed":"Opdahl Township, Hamlin County","Died":"Robbinsdale, Minnesota","Buried":"Apostolic Cemetery, Lake Norden"},"f":["Edwin was born November 23, 1906 in Braddock, North Dakota, where his parents had moved to homestead after marrying in Lake Norden.","The family later returned to the Lake Norden area.","On December 20, 1930, in Watertown, he married Lempi Kangas, joining two of the area's founding Finnish families.","They farmed in Opdahl Township near Bryant and raised their children there, including Joanne, born 1934, and son Eldon, born 1932.","He died March 18, 1981 in Robbinsdale, Minnesota at 74, and was brought home to the Apostolic Cemetery in Lake Norden."],"src":["Earlier family tree research notes","https://www.geisefuneralhome.com/obituary/audrey-smith"]},{"id":"lempi","n":"Lempi A (Kangas) Johnson","sx":"F","s":"smith","g":3,"pa":["alfred","marykurkela"],"sp":["edwinj"],"ch":["eldonjohnson","alfredjohnsonj","leonjohnsonj","joycejohnsonj","jeanjohnsonj","joanne"],"b":["15 Jan 1907","Hamlin, South Dakota, USA"],"d":["17 Aug 1995",""],"bu":["","Apostolic Cemetery, Lake Norden, Hamlin, South Dakota, USA"],"r":"Peyton's great grandmother","kf":{"Born":"Hamlin County, SD","Parents":"Alfred Erick Kangas and Mary Kurkela","Married":"Edwin Joel Johnson, Dec 20, 1930","Lived":"Opdahl Township, near Bryant","Buried":"Apostolic Cemetery, Lake Norden"},"f":["Lempi was born January 15, 1907 in Hamlin County, the fifth of Alfred and Mary Kangas's twelve children.","Lempi is a Finnish name meaning love.","She married Edwin Joel Johnson on December 20, 1930 in Watertown and they made their life farming in Opdahl Township near Bryant.","She named her firstborn son Edwin after her husband, and the family called him Eldon; the naming honor for her father Alfred went to another son.","She outlived Edwin by fourteen years, dying August 17, 1995 at 88, and rests beside him at the Apostolic Cemetery in Lake Norden, the same ground as her parents and grandparents.","In the 1950 census she was in Opdahl Township, Hamlin County, with children Eldon, Jo Ann, Joyce, Alfred and Jean.","Social Security death index: last residence Bryant (57221)."],"src":["Earlier family tree research notes","https://www.myheritage.com/census/us/1950census/johnson/11_8_0","https://www.locateancestors.com/lempi-a/"]},{"id":"johne","n":"John Everett Johnson","sx":"M","s":"smith","g":4,"pa":["peterj","brita"],"sp":["matilda"],"ch":["edwinj"],"b":["18 Aug 1873","Tornio, Finland"],"d":["3 Jan 1949","Braddock, Emmons, North Dakota, USA"],"bu":["","Tell Cemetery, Tell Township, Emmons, North Dakota, USA"],"r":"Peyton's 2nd great grandfather","kf":{"Born":"Tornio, Finland","Parents":"Peter Johnson and Brita Jonsdotter","Married":"Matilda Roisum, Dec 26, 1900, Lake Norden","Children":"At least 13","Later":"Emmons County, ND from about 1906","Buried":"Tell Cemetery, Tell Township, ND"},"f":["Here's the twist in the Johnson line: it's Finnish too.","John was born August 18, 1873 in Tornio, a Finnish town right on the Swedish border at the top of the Gulf of Bothnia.","The family name was anglicized to Johnson in America, a common move for Finns and Swedes alike.","He immigrated to the Lake Norden Finnish colony and on December 26, 1900, the day after Christmas, married Matilda Roisum there.","Around 1906 they joined a wave of settlers heading to newly opened land in Emmons County, North Dakota, where son Edwin was born in Braddock that year.","They farmed Tell Township for decades and raised at least thirteen children."],"src":["Earlier family tree research notes"]},{"id":"matilda","n":"Matilda Anna (Roisum) Johnson","sx":"F","s":"smith","g":4,"pa":["josephr","sophia"],"sp":["johne"],"ch":["edwinj"],"b":["15 Nov 1881","Lake Norden, Hamlin, South Dakota, USA"],"d":["8 Sep 1954","Braddock, Emmons, North Dakota, USA"],"bu":["","Tell Cemetery, Tell Township, Emmons, North Dakota, USA"],"r":"Peyton's 2nd great grandmother","kf":{"Born":"Lake Norden, SD","Parents":"Joseph Rognaldsen Roisum and Sophia Swenson","Married":"John Everett Johnson, Dec 26, 1900","Children":"At least 13","Buried":"Tell Cemetery, Tell Township, ND"},"f":["Matilda brings the Norwegian blood into the line.","She was born November 15, 1881 right in Lake Norden, making her one of the earliest children born in the new settlement, to Joseph Rognaldsen Roisum and Sophia Swenson.","Roisum is a Norwegian farm name, and Rognaldsen means son of Rognald.","She married the Finnish immigrant John Johnson at Lake Norden in 1900, and together they homesteaded in Emmons County, North Dakota, raising at least thirteen children through prairie winters that make Hamlin County look mild.","She died September 8, 1954 in Braddock and is buried beside John at Tell Cemetery."],"src":["Earlier family tree research notes"]},{"id":"peterj","n":"Peter Johnson","sx":"M","s":"smith","g":5,"pa":[],"sp":["brita"],"ch":["johne"],"b":["13 Mar 1852","Finland"],"d":["10 Sep 1926",""],"r":"Peyton's 3rd great grandfather","kf":{"Born":"Finland region, 1852","Wife":"Brita Jonsdotter","Son":"John Everett Johnson"},"f":["Peter, father of John Everett Johnson, was born March 13, 1852.","His son was born in Tornio, Finland, placing the family in the far north of the Gulf of Bothnia, borderland country where Finnish and Swedish families mixed.","The name Johnson is the American form; the original family name may have been Juhonpoika or a Swedish patronymic.","His detailed record sits behind FamilySearch's private layer.","Finnish and Swedish parish records for the Tornio valley are well preserved and would carry this line back further."],"src":["Earlier family tree research notes"]},{"id":"brita","n":"Brita Jonsdotter","sx":"F","s":"smith","g":5,"pa":[],"sp":["peterj"],"ch":["johne"],"b":["25 Sep 1842",""],"d":["19 Nov 1916",""],"r":"Peyton's 3rd great grandmother","kf":{"Born":"1842","Husband":"Peter Johnson","Son":"John Everett Johnson"},"f":["Brita Jonsdotter, born September 25, 1842, was ten years older than her husband Peter.","Jonsdotter is a Swedish-style patronymic meaning daughter of Jon, common in the Tornio valley where Swedish naming customs ran deep even among Finnish speakers.","She lived to 74, dying in November 1916."],"src":["Earlier family tree research notes"]},{"id":"josephr","n":"Joseph Rognaldsen Roisum","sx":"M","s":"smith","g":5,"pa":[],"sp":["sophia"],"ch":["matilda"],"b":["9 May 1850","Norway"],"d":["1936",""],"r":"Peyton's 3rd great grandfather","kf":{"Born":"1850, Norway","Wife":"Sophia Swenson","Daughter":"Matilda Anna Roisum","Settled":"Lake Norden area by 1881"},"f":["Joseph Rognaldsen Roisum was born May 9, 1850 in Norway.","Roisum is a farm name from the Sogn region of western Norway, and Rognaldsen marks him as the son of a man named Rognald.","He was in the Lake Norden area by 1881 at the latest, when his daughter Matilda was born there, twenty six years before any town existed.","That means the Roisum farm sat on or beside the future townsite.","When the South Dakota Central Railway came through in October 1907 and the town was platted in 1908, part of Lake Norden was laid out on Roisum land: family memory holds that the town began on the Roisum's Addition block, and with roughly 300 Roisums in the entire country, any Roisum on a Lake Norden plat is this family.","The plat itself sits at the Hamlin County Register of Deeds in Hayti, waiting to be copied."],"src":["Earlier family tree research notes"]},{"id":"sophia","n":"Sophia Swenson","sx":"F","s":"smith","g":5,"pa":[],"sp":["josephr"],"ch":["matilda"],"b":["Jan 1851",""],"d":["11 Aug 1939",""],"r":"Peyton's 3rd great grandmother","kf":{"Born":"1851","Husband":"Joseph Rognaldsen Roisum","Daughter":"Matilda Anna Roisum"},"f":["Sophia Swenson, born January 1851, married Joseph Roisum and raised her family in the young Lake Norden settlement.","Swenson is Scandinavian, son of Sven, fitting the Norwegian household.","She lived to 88, dying in August 1939, one of the last of the original settler generation."],"src":["Earlier family tree research notes"]},{"id":"alfred","n":"Alfred Erick Kangas","sx":"M","s":"smith","g":4,"pa":["erick","briita"],"sp":["marykurkela"],"ch":["lempi"],"b":["Apr 1870","Finland"],"d":["11 Jan 1944",""],"bu":["","Apostolic Cemetery, Lake Norden, Hamlin, South Dakota, USA"],"r":"Peyton's 2nd great grandfather","kf":{"Born":"Finland, April 1870","Parents":"Erick Alfred Kangas and Briita Magdalena Koivu","Married":"Mary Kurkela, 1897, Brookings, SD","Children":"Twelve","Farmed":"Hamlin County","Buried":"Apostolic Cemetery, Lake Norden"},"f":["Alfred was born in Finland in April 1870, the firstborn of Erick and Briita, and crossed the Atlantic as a boy when his family joined the Finnish migration to Dakota Territory.","His seven younger siblings, Johanna, Elizabeth, Anna, Emil, Edward, Mary, and David, mostly settled the same townships.","In 1897 he married Mary Kurkela in Brookings, and over the next 24 years they had twelve children: Mildred, Frederick, Emil, Emma, Lempi, George, Edward, Ellen, Eldora, Wesley, Bernice, and Viola.","Two died as infants, and Bernice died in 1944 at just 26, the same year as her father.","Alfred farmed Hamlin County his whole adult life and died January 11, 1944 at 73.","He's buried at the Apostolic Cemetery in Lake Norden."],"src":["Earlier family tree research notes"]},{"id":"marykurkela","n":"Mary (Kurkela) Kangas","sx":"F","s":"smith","g":4,"pa":["jacobk","annabrita"],"sp":["alfred"],"ch":["lempi"],"b":["27 Jul 1877","Haukipudas, Oulu, Finland"],"d":["19 Jun 1955","Lake Norden, Hamlin, South Dakota, USA"],"bu":["","Apostolic Cemetery, Lake Norden, Hamlin, South Dakota, USA"],"r":"Peyton's 2nd great grandmother","kf":{"Born":"Haukipudas, Oulu, Finland","Parents":"Jacob Kurkela and Anna Brita Hali","Married":"Alfred Kangas, 1897, Brookings","Children":"Twelve","Buried":"Apostolic Cemetery, Lake Norden"},"f":["Mary was born July 27, 1877 in Haukipudas, a coastal parish just north of Oulu, Finland, to Jacob Kurkela and Anna Brita Hali.","This is the single most precise Finnish origin point found in the whole tree: the Kurkela family can be traced in Haukipudas parish books.","She emigrated as a young woman and married Alfred Kangas in Brookings in 1897, then spent nearly fifty years raising twelve children on the Hamlin County farm and burying two of them as infants.","She outlived Alfred by eleven years, dying June 19, 1955 in Lake Norden at 77, and rests with him at the Apostolic Cemetery."],"src":["Earlier family tree research notes"]},{"id":"erick","n":"Erick Alfred Kangas","sx":"M","s":"smith","g":5,"pa":["matti","lisa"],"sp":["briita"],"ch":["alfred"],"b":["30 Aug 1847","Finland"],"d":["10 Dec 1926","Clatsop, Oregon, USA"],"bu":["","Elim Cemetery, Brush Prairie, Clark, Washington, USA"],"r":"Peyton's 3rd great grandfather · the immigrant","kf":{"1910":"Clark County, Washington","1920":"Cleveland Township, Hamlin County","Born":"Finland, 1847","Parents":"Matti Jylhänkangas and Lisa Andersdotter","Wife":"Briita Magdalena Koivu","Children":"At least 8","Died":"Clatsop County, Oregon","Buried":"Elim Cemetery, Brush Prairie, WA"},"f":["Erick is the immigrant, the man who moved the family from Finland to Dakota.","Born August 30, 1847 to Matti Jylhänkangas and Lisa Andersdotter, he shortened the surname to Kangas in America.","An Erick Kangas is recorded as one of the builders of the 1881 Hendrickson Farm two miles west of Lake Norden, a property now on the National Register of Historic Places specifically as an example of Finnish settlement architecture.","That is almost certainly him, swinging a hammer in the settlement's very first years.","His later life had a westward chapter most of the family never took: by 1910 he and Briita were living in Clark County, Washington, in the Finnish community around Brush Prairie.","Census records show them back in Cleveland Township, Hamlin County by 1920, but Erick died December 10, 1926 in Clatsop County, Oregon, on the coast at the mouth of the Columbia."],"src":["Earlier family tree research notes"]},{"id":"briita","n":"Briita Magdalena (Koivu) Kangas","sx":"F","s":"smith","g":5,"pa":["jacobkoivu","caisa"],"sp":["erick"],"ch":["alfred"],"b":["30 Jan 1845","Finland"],"d":["30 Dec 1929","Hamlin, South Dakota, USA"],"bu":["","Elim Cemetery, Brush Prairie, Clark, Washington, USA"],"r":"Peyton's 3rd great grandmother","kf":{"Born":"Finland, 1845","Parents":"Jacob Koivu and Caisa","Husband":"Erick Alfred Kangas","Children":"At least 8","Died":"Hamlin County, SD","Buried":"Elim Cemetery, Brush Prairie, WA"},"f":["Briita Magdalena Koivu was born January 30, 1845 in Finland to Jacob Koivu and his wife Caisa.","Koivu is Finnish for birch tree.","She was two years older than Erick, crossed the ocean with him, raised at least eight children on the Dakota prairie, and followed him west to Washington in their later years before returning to Hamlin County.","She died December 30, 1929 in Hamlin County at 84, three years after Erick, but was carried back to Elim Cemetery in Brush Prairie, Washington to be buried beside him.","Whatever pulled them to the Northwest held them both in the end."],"src":["Earlier family tree research notes"]},{"id":"jacobk","n":"Jacob Kurkela","sx":"M","s":"smith","g":5,"pa":[],"sp":["annabrita"],"ch":["marykurkela"],"b":["18 Oct 1843","Finland"],"d":["6 May 1908",""],"r":"Peyton's 3rd great grandfather","kf":{"Born":"Finland, 1843","Wife":"Anna Brita Hali","Daughter":"Mary Kurkela","Parish":"Haukipudas, Oulu"},"f":["Jacob Kurkela, born October 18, 1843, raised his family in Haukipudas parish on the Gulf of Bothnia coast just north of Oulu.","Kurkela is a Finnish farm name.","Whether Jacob himself ever emigrated or stayed in Finland while his daughter Mary crossed over is an open question his parish records would answer."],"src":["Earlier family tree research notes"]},{"id":"annabrita","n":"Anna Brita Hali","sx":"F","s":"smith","g":5,"pa":[],"sp":["jacobk"],"ch":["marykurkela"],"b":["28 Jan 1849",""],"d":["15 Jan 1916",""],"r":"Peyton's 3rd great grandmother","kf":{"Born":"Finland, 1849","Husband":"Jacob Kurkela","Daughter":"Mary Kurkela"},"f":["Anna Brita Hali, born January 28, 1849, married Jacob Kurkela and was mother to Mary, who left Haukipudas for South Dakota.","Anna Brita died in January 1916, two weeks short of her 67th birthday."],"src":["Earlier family tree research notes"]},{"id":"matti","n":"Matti Jylhänkangas","sx":"M","s":"smith","g":6,"pa":[],"sp":["lisa"],"ch":["erick"],"b":["1826","Finland"],"r":"Peyton's 4th great grandfather · oldest confirmed ancestor","kf":{"Wife":"Lisa Andersdotter","Son":"Erick Alfred Kangas","Surname":"Jylhänkangas, shortened to Kangas in America"},"f":["Matti Jylhänkangas, born 1826, is the oldest confirmed ancestor in the tree, a Finn born while Finland was a Grand Duchy of the Russian Empire.","The full surname Jylhänkangas roughly combines jylhä, meaning rugged or majestic, with kangas, meaning heathland or dry pine forest: rugged heath.","The name describes the kind of land the family came from.","His son Erick carried the shortened name Kangas to America.","Matti's own parents, and the exact home parish, sit one layer deeper in Finnish church books, which are extensively digitized.","This is the next door to open on the Kangas line."],"src":["Earlier family tree research notes"]},{"id":"lisa","n":"Lisa Andersdotter","sx":"F","s":"smith","g":6,"pa":[],"sp":["matti"],"ch":["erick"],"b":["1823","Finland"],"r":"Peyton's 4th great grandmother","kf":{"Husband":"Matti Jylhänkangas","Son":"Erick Alfred Kangas"},"f":["Lisa Andersdotter was born 1823.","Her patronymic surname means daughter of Anders, so her father's name is already half known: Anders.","She married Matti Jylhänkangas and their son Erick became the family's American founder."],"src":["Earlier family tree research notes"]},{"id":"jacobkoivu","n":"Jacob Koivu","sx":"M","s":"smith","g":6,"pa":[],"sp":["caisa"],"ch":["briita"],"r":"Peyton's 4th great grandfather","kf":{"Wife":"Caisa","Daughter":"Briita Magdalena Koivu"},"f":["Jacob Koivu is known from his daughter Briita's records.","His dates and parish are in the private layer of the Finnish records; Briita's 1845 birth record in Finland would name his farm and village."],"src":["Earlier family tree research notes"]},{"id":"caisa","n":"Caisa","sx":"F","s":"smith","g":6,"pa":[],"sp":["jacobkoivu"],"ch":["briita"],"r":"Peyton's 4th great grandmother","kf":{"Husband":"Jacob Koivu","Daughter":"Briita Magdalena Koivu"},"f":["Caisa, wife of Jacob Koivu and mother of Briita, is the faintest confirmed name in the tree, recorded only by her first name, a Finnish form of Katherine.","Her full record waits in the same parish books as Jacob's."],"src":["Earlier family tree research notes"]},{"id":"danielkenoyer","n":"Daniel Lee Kenoyer","sx":"M","s":"kenoyer","g":1,"pa":["stevek","annak"],"sp":["loricederstrom"],"ch":["calisakenoyer","annakenoyer","patrickkenoyer","williamkenoyer","larskenoyer","laceykenoyer","claykenoyer","jameskenoyer"],"b":["1966","Madison, Lake, South Dakota, USA"],"r":"Peyton's uncle","kf":{"Parents":"Stephen Lee Kenoyer and Anna Phyllis Koski","Spouse":"Lori Lyn Cederstrom","Married":"Lori Lyn Cederstrom 1990 in Spearfish, SD","Children":"Calisa, Anna, Patrick, William, Lars, Lacey, Clay, James"},"f":["Daniel Lee Kenoyer, son of Stephen Lee Kenoyer and Anna Phyllis Koski, born 1966 in Madison, SD.","Daniel was baptized in Spearfish SD - Sponsors : Herschell and Norma Hoffman and David and Evelyn Wilen."],"src":["Anna Kenoyer Family Group Sheets (Oct 2026)"]},{"id":"danmassie","n":"Dan Randal Massie","sx":"M","s":"kenoyer","g":1,"pa":["jackmassie","nancynorby"],"sp":["sonjakenoyer"],"ch":["justinmassie","jacemassie","kristinamassie","briellemassie","wesleymassie","jaylenmassie","brylenmassie"],"b":["1968","Vancouver, Clark, Washington, USA"],"r":"Peyton's uncle by marriage","kf":{"Parents":"Jack Lee Massie and Nancy Ann Norby","Spouse":"Sonja Marie Kenoyer","Married":"Sonja Marie Kenoyer 1991 in Spearfish, SD","Children":"Justin, Jace, Kristina, Brielle, Wesley, Jaylen, Brylen"},"f":["Dan Randal Massie, son of Jack Lee Massie and Nancy Ann Norby, born 1968 in Vancouver, WA."],"src":["Anna Kenoyer Family Group Sheets (Oct 2026)"]},{"id":"katrinakenoyer","n":"Katrina Lynn Kenoyer","sx":"F","s":"kenoyer","g":1,"pa":["stevek","annak"],"sp":["andyjohnston"],"ch":["tianajohnston","alesiajohnston","austinjohnston","spencerjohnston","sethjohnston","wyattjohnston","laylajohnston","blaynejohnston"],"b":["1969","Madison, Lake, South Dakota, USA"],"r":"Peyton's aunt","kf":{"Parents":"Stephen Lee Kenoyer and Anna Phyllis K const P = {}; DATA.people.forEach(p => P[p.id] = p);
const SIDES = [["core","Your family"],["smith","Smith"],["kenoyer","Kenoyer"],["tawni","Tawni's"],["all","All"]];
const SIDE_COLOR = {core:"var(--core)",smith:"var(--smith)",kenoyer:"var(--kenoyer)",tawni:"var(--tawni)"};
const SIDE_NAME = {core:"Your family",smith:"Smith side",kenoyer:"Kenoyer side",tawni:"Tawni's side"};
const GEN_NAME = g => ({"-2":"Grandkids' gen","-1":"Kids' gen",0:"Your gen",1:"Parents' gen",2:"Grandparents' gen",3:"Great-grandparents' gen"})[g] ?? (g>3 ? `${g-2}× great-grandparents' gen` : `Gen ${g}`);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GEN_SHORT = g => ({"-2":"Grandkids","-1":"Kids",0:"You",1:"Parents",2:"Grandparents",3:"Great-GP"})[g] ?? (g>3 ? `${g-2}× Great-GP` : `Gen ${g}`);
const gk = g => g === 0 ? 0 : g < 0 ? -g + 0.5 : g;
const yr = d => { const m = d && String(d).match(/(\d{4})/); return m ? m[1] : ""; };

const life = p => { const b = yl(p.b && p.b[0]), d = yl(p.d && p.d[0]); if (!b && !d) return ""; if (!b) return "d. " + d; return d ? `${b}–${d}` : `b. ${b}`; };
const birthSort = p => +(yr(p.b && p.b[0]) || 9999);

let stack = [];

function inSide(p, s) { return s === "all" || p.s === s || (p.as || []).includes(s); }

  const n = p.pa.map(id => P[id]).filter(Boolean).map(x => x.n.split(" ")[0]);
  return n.length ? "Child of " + n.join(" & ") : "";
}
function rowHTML(p, extra) {
  const meta = [life(p), extra ?? (p.r || parentsLine(p))].filter(Boolean).join(" · ");
  return `<button class="row" data-id="${p.id}"><span class="bar" style="background:${SIDE_COLOR[p.s]}"></span>
  <span class="rc"><div class="nm">${esc(p.n)}${p.new ? '<span class="dot" title="Added Oct 10, 2026"></span>' : ""}</div>
  <div class="meta">${esc(meta)}</div></span><span class="chev">›</span></button>`;
}
function renderChips() {
  document.getElementById("sides").innerHTML = SIDES.map(([k, l]) =>
    `<button class="chip ${state.side === k ? "on" : ""}" data-side="${k}">${l}</button>`).join("");
  const gens = [...new Set(DATA.people.filter(p => inSide(p, state.side)).map(p => p.g))].sort((a, b) => gk(a) - gk(b));
  document.getElementById("gens").innerHTML = `<button class="chip small ${state.gen === "all" ? "on" : ""}" data-gen="all">All</button>` +
    gens.map(g => `<button class="chip small ${String(state.gen) === String(g) ? "on" : ""}" data-gen="${g}">${GEN_SHORT(g)}</button>`).join("");
  document.getElementById("gens").style.display = state.q ? "none" : "flex";
}
function renderList() {
  renderChips();
  const el = document.getElementById("list");
  const q = state.q.trim().toLowerCase();
  if (q) {
    const terms = q.split(/\s+/);
    const hits = DATA.people.filter(p => terms.every(t => p.n.toLowerCase().includes(t)))
      .sort((a, b) => a.n.localeCompare(b.n));
    el.innerHTML = `<div class="gh">${hits.length} match${hits.length === 1 ? "" : "es"}</div>` +
      (hits.map(p => rowHTML(p, SIDE_NAME[p.s] + (p.r ? " · " + p.r : ""))).join("") || `<div class="empty">No one by that name.</div>`);
    return;
  }
  let ps = DATA.people.filter(p => inSide(p, state.side) && (state.gen === "all" || String(p.g) === String(state.gen)));
  const groups = {};
  ps.forEach(p => (groups[p.g] = groups[p.g] || []).push(p));
  el.innerHTML = Object.keys(groups).map(Number).sort((a, b) => gk(a) - gk(b)).map(g => {
    const arr = groups[g].sort((a, b) => birthSort(a) - birthSort(b) || a.n.localeCompare(b.n));
    // Peyton first in his generation
    arr.sort((a, b) => (b.id === DATA.root) - (a.id === DATA.root));
    return `<div class="gh">${GEN_NAME(g)} · ${arr.length}</div>` + arr.map(p => rowHTML(p)).join("");
  }).join("") || `<div class="empty">No one here.</div>`;
}
