<style>
:root{--bg:#f7f2ea;--card:#fffdf9;--ink:#2b2420;--mut:#7a6d63;--line:#e7ddd0;--acc:#8a4b2a;--acc2:#f0e2d3;
--smith:#2f5d7c;--kenoyer:#5d7a3a;--tawni:#9a4f6a;--core:#8a4b2a;--new:#c98a1b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
.serif{font-family:"Source Serif 4",Georgia,serif}
header{padding:18px 16px 6px;max-width:640px;margin:0 auto}
h1{font-family:"Source Serif 4",Georgia,serif;font-size:26px;margin:0 0 2px}
.sub{color:var(--mut);font-size:13px}
.note{margin-top:8px;font-size:12.5px;color:var(--mut);background:var(--acc2);border-radius:10px;padding:8px 10px}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 16px 8px;max-width:640px;margin:0 auto;border-bottom:1px solid var(--line)}
.search{width:100%;font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 9px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.small{padding:4px 9px;font-size:12px}
main{max-width:640px;margin:0 auto;padding:6px 16px 60px}
.gh{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:16px 2px 6px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.row:active{background:var(--acc2)}
.bar{width:4px;align-self:stretch;border-radius:3px;flex:none}
.rc{flex:1;min-width:0}
.nm{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:16.5px;line-height:1.25}
.meta{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:#bbb;font-size:18px}
.newtag{display:inline-block;font:600 10px Inter,sans-serif;color:var(--new);border:1px solid var(--new);border-radius:6px;padding:0 4px;margin-left:6px;vertical-align:2px;letter-spacing:.03em}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--new);margin-left:6px;vertical-align:2px}
.empty{color:var(--mut);text-align:center;padding:30px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .22s ease;-webkit-overflow-scrolling:touch}
.sheet.open{transform:none}
.shead{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);z-index:2}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.sbody{max-width:640px;margin:0 auto;padding:14px 16px 80px}
.pname{font-family:"Source Serif 4",Georgia,serif;font-size:25px;font-weight:700;line-height:1.2;margin:2px 0 4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--acc2);color:var(--acc)}
.nav3{display:flex;gap:6px;margin:10px 0 4px}
.nav3 a{flex:1;text-align:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px;font-size:13px;font-weight:600}
.nav3 a.dis{opacity:.35;pointer-events:none}
.sec{margin-top:18px}
.sec h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 6px;font-weight:600}
.kv{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px}
.kv div{padding:7px 0;border-bottom:1px solid var(--line)}
.kv div:last-child{border:0}
.kv b{display:block;font-size:11.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
ul.facts{margin:0;padding:0 0 0 18px}
ul.facts li{margin:0 0 8px}
.srcs a,.srcs span{display:block;font-size:12.5px;color:var(--acc);word-break:break-word;margin-bottom:6px}
.srcs span{color:var(--mut)}
.conf{font-size:12.5px;color:var(--mut);margin-top:4px}
footer{max-width:640px;margin:0 auto;padding:0 16px 40px;color:var(--mut);font-size:12px}
</style>

<script>
const DATA = {"root":"peyton","people":[{"id":"peyton","n":"Peyton Paul Smith","sx":"M","s":"core","g":0,"pa":["keith","marymom"],"sp":["tawni"],"ch":["paxtonsmith","kierrasmith","keetonsmith","brittonsmith","kanyonsmith","tayleesmith"],"b":["1991","Watertown, Codington, South Dakota, USA"],"r":"You","kf":{"Married":"Tawni Lee Bludorn, 2011, Lake Norden","Family":"Father of six, seventh on the way"},"f":["Sixth confirmed generation of the family, living near Lake Norden on the same Hamlin County ground the Kangas and Johnson families broke in the 1880s and 1890s.","His six children are the seventh generation."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)"]},{"id":"tawni","n":"Tawni Lee (Bludorn) Smith","sx":"F","s":"core","g":0,"pa":["bobb","brendab"],"sp":["peyton"],"ch":["paxtonsmith","kierrasmith","keetonsmith","brittonsmith","kanyonsmith","tayleesmith"],"b":["1992","Watertown, Codington, South Dakota, USA"],"r":"Peyton's wife","kf":{"Maiden":"Bludorn, originally Bluedorn","Parents":"Bob and Brenda Bludorn","Married":"Peyton Paul Smith, 2011, Lake Norden","Work":"Founder of Drip Coffee"},"f":["Tawni Lee Bludorn grew up in the same Hamlin County world as Peyton; the Bludorns have been a Watertown, Florence, Hayti, and Lake Norden family for over a century, running the Bludorn Tavern in Florence and three generations of barbers in Hayti among her grandfather's brothers.","The name was originally Bluedorn, German, and her lines run German on the Bludorn, Struss, and Helser sides and French Huguenot on the Deyo side, the first non-Nordic half of this family tree.","Founder of Drip Coffee and mom of the seventh generation."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)"]},{"id":"bobb","n":"Robert H 'Bob' Bludorn","sx":"M","s":"tawni","g":1,"pa":["rogerb","leeb"],"sp":["brendab"],"ch":["tawni"],"r":"Tawni's dad","kf":{"Parents":"Roger Johnson Bludorn and Leola 'Lee' Helser","Wife":"Brenda","Home":"Lake Norden, SD","Siblings":"Bruce, Jim, Pete, Jane, Linda"},"f":["Bob Bludorn, son of Roger and Lee, settled in Lake Norden and raised his family there.","His siblings spread from Watertown to Mesa, Arizona; his brother Bruce (1956 to 2019) rests at Rose Hill Cemetery in Clark.","Through his father he descends from the Bluedorn Germans who came through Scott County, Minnesota, and through his mother from the Helsers and the French Huguenot Deyos.","Listed as \"Bob (Brenda) Bludorn of Lake Norden\" in his brother Bruce's 2019 obituary."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)","https://www.furnessfuneralhome.com/obituaries/bruce-bludorn"]},{"id":"brendab","n":"Brenda J (Bellikka) Bludorn","sx":"F","s":"tawni","g":1,"pa":["arvob","ardiss"],"sp":["bobb"],"ch":["tawni"],"b":["1954","Aberdeen, Brown, South Dakota, USA"],"r":"Tawni's mom","kf":{"Parents":"Arvo Evertt Bellikka and Ardis Erna Schlosser","Maiden":"Bellikka, originally Pellikka","Husband":"Bob Bludorn","Siblings":"Nine: six brothers, three sisters"},"f":["Brenda Bellikka, born 1954, is one of Arvo and Ardis Bellikka's ten children, raised in the Aberdeen Finnish community around the Old Apostolic Lutheran Church.","Her brothers Neil, Daryl, Gary, Glen, Scott, and Brian mostly stayed in Aberdeen; her sisters Connie Berg, Debra Landsem, and Rhonda Lock spread from Aberdeen to Battle Ground, Washington.","Bellikka is the Americanized form of Pellikka, a Finnish surname, which means both of Tawni's grandmothers' worlds and Peyton's entire mother's and father's mother's worlds trace to the same small Finnish Laestadian church.","The Bludorn and Smith families were connected through that network generations before Peyton and Tawni ever met."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)"]},{"id":"arvob","n":"Arvo Everett Bellikka","sx":"M","s":"tawni","g":2,"pa":["jacobbell","lizzieb"],"sp":["ardiss"],"ch":["brendab","bell_neil","bell_daryl","bell_gary","bell_glen","bell_scott","bell_brian","bell_connie","bell_debra","bell_rhonda"],"b":["14 Nov 1917",""],"d":["17 Oct 2002",""],"bu":["","Riverside Memorial Park, Aberdeen, Brown, South Dakota, USA"],"r":"Tawni's grandfather","kf":{"Born":"November 14, 1917","Parents":"Jacob and Lizzie Bellikka","Name":"Originally Pellikka, Finnish","Served":"Private First Class, US Army, WWII","Married":"Ardis Schlosser, June 16, 1946, Aberdeen","Children":"Ten","Buried":"Riverside Memorial Park, Aberdeen, SD"},"f":["Arvo Evertt Bellikka was born November 14, 1917 to Jacob and Lizzie Bellikka, confirmed by family memory and consistent with the records: Jacob, born 1878, was raising his family in the Finnish colony at Gackle, North Dakota in those years.","The family name was originally Pellikka; like Bluedorn to Bludorn and Pedersen to Smith, it got smoothed out in America.","He served as a Private First Class in the US Army in World War II and came home; his brother Arne, born two years after him and so alike that people took them for twins, was killed in battle in the Philippines in 1945.","Arvo married the schoolteacher Ardis Schlosser on June 16, 1946 in Aberdeen.","They farmed near Aberdeen and raised ten children, who gave them 55 grandchildren, including Tawni.","He died October 17, 2002 at 84 and rests at Riverside Memorial Park in Aberdeen."],"src":["Earlier family tree research notes"]},{"id":"ardiss","n":"Ardis Erna (Schlosser) Bellikka","sx":"F","s":"tawni","g":2,"pa":["johns","ernar"],"sp":["arvob"],"ch":["brendab","bell_neil","bell_daryl","bell_gary","bell_glen","bell_scott","bell_brian","bell_connie","bell_debra","bell_rhonda"],"b":["29 Aug 1926","Appleton, Swift, Minnesota, USA"],"d":["17 Mar 2007",""],"bu":["","Riverside Memorial Park, Aberdeen, Brown, South Dakota, USA"],"r":"Tawni's grandmother","kf":{"Born":"August 29, 1926, Appleton, MN","Parents":"John and Erna (Radke) Schlosser","Raised":"Farm near Frederick, SD","Education":"Northern State Teachers' College","Church":"Old Apostolic Lutheran, Aberdeen","Buried":"Riverside Memorial Park, Aberdeen, SD"},"f":["Ardis Erna Schlosser was born August 29, 1926 at Appleton, Minnesota to John and Erna (Radke) Schlosser, a German family, and was raised on their farm near Frederick, South Dakota, right beside the historic Savo Finnish colony.","She earned her teaching certificate at Northern State Teachers' College and taught in Brown County country schools, the same path Peyton's grandma Joanne walked in Hamlin County a few years later.","She married Arvo Bellikka in 1946, raised ten children on the farm, and was a lifelong member of the Old Apostolic Lutheran Church in Aberdeen, the same denomination as the Kangas, Johnson, Koski, and Kurkela families on Peyton's side.","She died March 17, 2007 at 80 and rests beside Arvo at Riverside Memorial Park.","Her obituary counted 55 grandchildren and 17 great grandchildren."],"src":["Earlier family tree research notes"]},{"id":"johns","n":"John Schlosser","sx":"M","s":"tawni","g":3,"pa":[],"sp":["ernar"],"ch":["ardiss"],"r":"Tawni's 2nd great grandfather","kf":{"Wife":"Erna Radke","Farmed":"Near Frederick, SD","Heritage":"German"},"f":["John Schlosser, a German farmer, raised his family at Appleton, Minnesota and then on the farm near Frederick, South Dakota.","Schlosser is German for locksmith.","His dates and parents are the open thread on this branch; the Frederick area records and his obituary in the Aberdeen American News would carry it back."],"src":["Earlier family tree research notes"]},{"id":"ernar","n":"Erna (Radke) Schlosser","sx":"F","s":"tawni","g":3,"pa":[],"sp":["johns"],"ch":["ardiss"],"r":"Tawni's 2nd great grandmother","kf":{"Husband":"John Schlosser","Maiden":"Radke, German"},"f":["Erna Radke, wife of John Schlosser, mother of Ardis.","Radke is a German surname from the northeast, Pomerania and Prussia country, which fits the German farming settlements around Frederick and Leola.","Her dates await her obituary or grave record."],"src":["Earlier family tree research notes"]},{"id":"jacobbell","n":"Jacob (Pellikka) Bellikka","sx":"M","s":"tawni","g":3,"pa":["pellikkasr","kaisasorvo"],"sp":["lizzieb"],"ch":["arvob","johnbellikka","hildabellikka","estherbellikka","arthurbellikka","annabellikka","edwinbellikka","arnebellikka","lydiabellikka","ellenbellikka","almabellikka"],"b":["25 Nov 1878","Revonlahti, Finland"],"d":["4 Oct 1963",""],"bu":["","Homola Cemetery, Gackle, Logan, North Dakota, USA"],"r":"Tawni's 2nd great grandfather","kf":{"Born":"November 25, 1878, Revonlahti, Finland","Parents":"Pellikka (b. 1836) and Kaisa Sorvo","Immigrated":"1885, through Rockport, MA","Homestead":"Filed summer 1902, 19 miles SW of Gackle, ND","Married":"Lizzie Lippo, fall 1902, Ellendale, ND","Children":"Twelve","Buried":"Homola Cemetery, Gackle, ND"},"f":["Jacob, son of Joseph Pellikka and Kaisa Sorvo, was born November 25, 1878 in Revonlahti, Finland, a farming parish south of Oulu.","In 1885, at age seven, he crossed with his family to Rockport, Massachusetts, then traveled to Carbon, Wyoming, and finally to Frederick, Dakota Territory, reaching Brown County in 1886, where the family farmed beside the Savo colony.","In the summer of 1902 he filed a homestead nineteen miles southwest of Gackle, North Dakota, and that fall married Lizzie Lippo at Ellendale.","They bought a few head of cattle and a horse and buggy, returned to the claim, and stayed with their neighbor John Homola until their sod house was finished.","With another neighbor, Jakob Allila, he broke the prairie with a horse and hand plow; the first crop failed, giving only a few bushels of flax.","Year by year he built it back: a frame house, a barn, twelve children, and 43 years of farming before he and Lizzie retired into Gackle in 1945.","Married Elizabeth Lippo on Oct 23, 1902 at Ellendale, ND; died Oct 4, 1963 at Jamestown, ND.","Father of at least 11 children (Gackle family group sheet)."],"src":["Earlier family tree research notes","https://freepages.rootsweb.com/~cats61/genealogy/gacklend/gacklefam/gp2135.htm"]},{"id":"lizzieb","n":"Elizabeth 'Lizzie' (Lippo) Bellikka","sx":"F","s":"tawni","g":3,"pa":["paullippo","tinalippo"],"sp":["jacobbell"],"ch":["arvob","johnbellikka","hildabellikka","estherbellikka","arthurbellikka","annabellikka","edwinbellikka","arnebellikka","lydiabellikka","ellenbellikka","almabellikka"],"b":["6 Jun 1884","Oulu, Finland"],"d":["3 Jun 1968",""],"bu":["","Homola Cemetery, Gackle, Logan, North Dakota, USA"],"r":"Tawni's 2nd great grandmother","kf":{"Born":"June 6, 1884, near Oulu, Finland (grave says 1882)","Parents":"Paul and Tina Lippo","Crossed":"Alone at 19, Liverpool to New York","Married":"Jacob Bellikka, fall 1902, Ellendale","Buried":"Homola Cemetery, Gackle, ND"},"f":["Elizabeth Lippo was born June 6, 1884 near Oulu, Finland to Paul and Tina Lippo, one of eight children.","Her brothers crossed to America first and saved to pay her passage.","At nineteen she boarded a ship at Liverpool, England, crossed the Atlantic entirely alone, landed in New York, and rode the train by herself to Aberdeen, South Dakota, where she worked as a maid around Brown County, including a stretch at the Sherman House.","She married Jacob Bellikka in the fall of 1902 at Ellendale and moved to the sod house on the Gackle claim.","She bore twelve children, ten of whom grew up; her second baby, a girl, died at two months, and the loss put her in bed for six months.","She raised the rest through prairie winters and sent two sons to World War II, one of whom never came home.","Born June 8, 1882 in Oulu province (\"Oululand\"), Finland; died June 3, 1968 at Wishek, ND."],"src":["Earlier family tree research notes","https://freepages.rootsweb.com/~cats61/genealogy/gacklend/gacklefam/gp2135.htm"]},{"id":"pellikkasr","n":"Joseph Pellikka","sx":"M","s":"tawni","g":4,"pa":[],"sp":["kaisasorvo"],"ch":["jacobbell"],"b":["1836","Revonlahti, Finland"],"r":"Tawni's 3rd great grandfather","kf":{"Born":"1836, Revonlahti, Finland","Wife":"Kaisa Sorvo","Immigrated":"1885, Rockport, MA, then Carbon, WY, then Frederick, DT","Children":"Six: Joseph Jr., Henry, Jacob, Kaisa, Sakarias, and one more"},"f":["Joseph Pellikka, named by family memory, was born in 1836 in Revonlahti, Finland, and married Kaisa Sorvo, born the same year in the same parish.","Their firstborn son carried his name, Finnish custom, and their son Jacob carried the family to Dakota.","In 1885, at nearly fifty, Joseph took the whole family across: ship to Rockport, Massachusetts, west to the coal town of Carbon, Wyoming, and on to Frederick, Dakota Territory in 1886, joining the Brown County Finnish colony.","His own parents sit one layer deeper than any index reaches: the digitized HisKi parish index for Revonlahti and its neighbors has a gap from 1861 to 1880 and no Pellikka entries, which means the family was likely recorded under a farm name.","The original church books survive as page scans at Finland's National Archives, readable by eye.","That is the door to the 1700s on this line.","Possible lead: HisKi records a marriage on July 5, 1856 in Revonlahti between \"farmer's son Josef Samuelsson Nahkala\" and \"farmer's daughter Caisa Henriksdotter Sorvo\". The names fit Joseph and Kaisa (Sorvo) Pellikka, but the farm name differs, so this is POSSIBLE only (HisKi Revonlahti marriages)."],"src":["Earlier family tree research notes","https://hiski.genealogia.fi/hiski?en+0453+vihityt"],"upd":1},{"id":"kaisasorvo","n":"Kaisa (Sorvo) Pellikka","sx":"F","s":"tawni","g":4,"pa":[],"sp":["pellikkasr"],"ch":["jacobbell"],"b":["1836","Revonlahti, Finland"],"r":"Tawni's 3rd great grandmother","kf":{"Born":"1836, Revonlahti, Finland","Husband":"Joseph Pellikka","Children":"Six"},"f":["Kaisa Sorvo was born in 1836 in Revonlahti, the same parish and year as her husband.","She crossed the Atlantic at nearly fifty with six children and made a third life in Dakota after Massachusetts and Wyoming.","Kaisa is the Finnish form of Katherine, the same name as Peyton's 4th great grandmother Caisa on the Koivu line."],"src":["Earlier family tree research notes"]},{"id":"paullippo","n":"Paul Lippo","sx":"M","s":"tawni","g":4,"pa":[],"sp":["tinalippo"],"ch":["lizzieb"],"r":"Tawni's 3rd great grandfather","kf":{"Wife":"Tina","Children":"Eight, including Elizabeth","Home":"Oulu region, Finland"},"f":["Paul Lippo raised eight children near Oulu, Finland.","Several of his sons crossed to America first and earned the passage money that brought their sister Lizzie over alone in 1903.","Whether Paul himself ever emigrated or lived out his days in Finland is an open question for the Oulu parish books."],"src":["Earlier family tree research notes"]},{"id":"tinalippo","n":"Tina Lippo","sx":"F","s":"tawni","g":4,"pa":[],"sp":["paullippo"],"ch":["lizzieb"],"r":"Tawni's 3rd great grandmother","kf":{"Husband":"Paul Lippo","Children":"Eight"},"f":["Tina, wife of Paul Lippo, mother of Lizzie and her three sisters and four brothers.","Her story sits in the Oulu region parish records alongside Paul's."],"src":["Earlier family tree research notes"]},{"id":"rogerb","n":"Roger Johnson Bludorn","sx":"M","s":"tawni","g":2,"pa":["henrybb","agnesj"],"sp":["leeb"],"ch":["bobb","brucebludorn","jimbludorn","petebludorn","janebludorn","lindabludorn"],"b":["1923",""],"d":["1978",""],"r":"Tawni's grandfather","kf":{"Born":"1923","Parents":"Henry Bernard Bludorn and Agnes Johnson","Served":"US Army, Technician 5th Grade, WWII","Wife":"Leola 'Lee' Helser","Died":"1978"},"f":["Roger Johnson Bludorn carried his mother's maiden name as his middle name, an old custom that preserved the Johnson line in his own.","He served in World War II as a Technician Fifth Grade in the US Army, the same war that had his future in-law Claris Kenoyer building aircraft in Los Angeles.","He and Lee raised their family in the Watertown area: Bob, Bruce, Jim, Pete, Jane, and Linda.","He died in 1978 at about 55, young enough that his grandchildren, including Tawni, never knew him.","Son Bruce's obituary says the family raised its kids in Florence and Watertown."],"src":["Earlier family tree research notes","https://www.furnessfuneralhome.com/obituaries/bruce-bludorn"]},{"id":"leeb","n":"Leola M 'Lee' (Helser) Bludorn","sx":"F","s":"tawni","g":2,"pa":["henryh","gladysd"],"sp":["rogerb"],"ch":["bobb","brucebludorn","jimbludorn","petebludorn","janebludorn","lindabludorn"],"b":["1924",""],"d":["2007",""],"r":"Tawni's grandmother","kf":{"Born":"1924","Parents":"Henry W. Helser and Gladys Blanche Deyo","Husband":"Roger Johnson Bludorn"},"f":["Leola, called Lee her whole life, came from the Helser family of the St.","Paul, Minnesota area; her parents rest at Union Cemetery in Maplewood.","Helser is German, but her mother's line, the Deyos, traces to French Huguenot stock, Protestant refugees whose descendants spread west from the historic New Paltz settlement in New York.","She outlived Roger by nearly thirty years, dying in 2007 at about 83."],"src":["Earlier family tree research notes","https://www.furnessfuneralhome.com/obituaries/bruce-bludorn"]},{"id":"henrybb","n":"Henry Bernard Bludorn","sx":"M","s":"tawni","g":3,"pa":["henryjb","louisas"],"sp":["agnesj"],"ch":["rogerb"],"b":["21 Apr 1897",""],"d":["21 Oct 1968",""],"bu":["","Mount Hope Cemetery, Watertown, Codington, South Dakota, USA"],"r":"Tawni's 2nd great grandfather","kf":{"Born":"April 21, 1897","Parents":"Henry J Bluedorn and Louisa Caroline Struss","Wife":"Agnes Johnson","Buried":"Mount Hope Cemetery, Watertown, SD"},"f":["Henry Bernard Bludorn, son of the German immigrant generation, brought the family from Minnesota into the Watertown and Florence country and dropped the 'e' from Bluedorn along the way.","He and Agnes ran deep roots: their children included Dale (who tended the Bludorn Tavern in Florence), Grant 'Speed' (the Hayti barber whose sons cut hair after him), Gordon 'Budd', Una, Ramona, and Roger, Tawni's grandfather.","He died October 21, 1968 at 71 and rests at Mount Hope Cemetery in Watertown."],"src":["Earlier family tree research notes"]},{"id":"agnesj","n":"Agnes (Johnson) Bludorn","sx":"F","s":"tawni","g":3,"pa":[],"sp":["henrybb"],"ch":["rogerb"],"r":"Tawni's 2nd great grandmother","kf":{"Maiden":"Johnson","Husband":"Henry Bernard Bludorn","Children":"Dale, Roger, Grant 'Speed', Gordon, Una, Ramona"},"f":["Agnes Johnson married Henry Bernard Bludorn and raised the family in Florence and Watertown.","Her maiden name lives on as her son Roger's middle name.","Her grave record isn't indexed publicly, so her dates and her parents are the open thread on this branch; whether her Johnsons were Scandinavian like Peyton's Tornio Johnsons or something else entirely is a question her obituary would answer."],"src":["Earlier family tree research notes"]},{"id":"henryjb","n":"Henry J Bluedorn","sx":"M","s":"tawni","g":4,"pa":[],"sp":["louisas"],"ch":["henrybb","frankbluedorn","laurabluedorn"],"b":["about 1862","Mecklenburg, Germany"],"d":["29 Dec 1942","Hennepin County, Minnesota, USA"],"r":"Tawni's 3rd great grandfather","kf":{"Born":"1862","Wife":"Louisa Caroline Struss","Spelling":"Bluedorn, the original German form"},"f":["Henry J Bluedorn, born 1862, belongs to the German immigrant generation that settled Scott County, Minnesota, the farming country around Shakopee, before the family pushed west into South Dakota.","Bluedorn is German; his wife's Struss is German; the whole line is German farm stock.","He died in 1942 at about 80.","The census record found is likely, not certain, to be him: \"Bludorn, Henry, 56, born Mecklenburg\" heads a Shakopee household in 1920. In 1930 he is 67, first married at 28 (about 1890), immigrated in 1883, and works as a section hand for the railroad (Scott County census transcriptions, genealogytrails.com).","After Louisa died in 1913 he married the widow Flora (Deck) Haack, whose sons Earl and Frank Haack lived with them. Henry J. Bluedorn died December 29, 1942 in Hennepin County; Flora died June 9, 1943 (Minnesota county death records, genealogytrails.com)."],"src":["Earlier family tree research notes","http://www.genealogytrails.com/minn/scott/families_lenz.html"],"upd":1},{"id":"louisas","n":"Louisa Caroline (Struss) Bluedorn","sx":"F","s":"tawni","g":4,"pa":[],"sp":["henryjb"],"ch":["henrybb","frankbluedorn","laurabluedorn"],"b":["7 Nov 1861",""],"d":["1 Jan 1913",""],"bu":["","Valley Cemetery, Shakopee, Scott, Minnesota, USA"],"r":"Tawni's 3rd great grandmother","kf":{"Born":"November 7, 1861","Husband":"Henry J Bluedorn","Buried":"Valley Cemetery, Shakopee, MN"},"f":["Louisa Caroline Struss, born November 7, 1861, married Henry Bluedorn and raised the family in the German community around Shakopee, Minnesota.","She died on New Year's Day 1913 at 51, before the family's South Dakota chapter began, and rests at Valley Cemetery in Shakopee."],"src":["Earlier family tree research notes"]},{"id":"henryh","n":"Henry W. Helser","sx":"M","s":"tawni","g":3,"pa":[],"sp":["gladysd"],"ch":["leeb"],"b":["1893",""],"d":["12 Jan 1962",""],"bu":["","Union Cemetery, Maplewood, Ramsey, Minnesota, USA"],"r":"Tawni's 2nd great grandfather","kf":{"Born":"1893","Wife":"Gladys Blanche Deyo","Buried":"Union Cemetery, Maplewood, MN"},"f":["Helser, born 1893, raised his family in the St.","His daughter Lee carried the line into South Dakota when she married Roger Bludorn.","He died January 12, 1962 and rests at Union Cemetery in Maplewood beside Gladys."],"src":["Earlier family tree research notes"]},{"id":"gladysd","n":"Gladys Blanche (Deyo) Helser","sx":"F","s":"tawni","g":3,"pa":["wmdeyo","maryjones"],"sp":["henryh"],"ch":["leeb"],"b":["10 Mar 1900",""],"d":["21 Aug 1985",""],"bu":["","Union Cemetery, Maplewood, Ramsey, Minnesota, USA"],"r":"Tawni's 2nd great grandmother","kf":{"Born":"March 10, 1900","Parents":"William Alexander Deyo and Mary Elizabeth Jones","Husband":"Henry W. Helser","Buried":"Union Cemetery, Maplewood, MN"},"f":["Gladys Blanche Deyo, born March 10, 1900, carries the most distinctive surname in Tawni's tree.","Deyo is French Huguenot: the family descends from Protestant refugees who fled France in the 1600s, and the Deyo name is one of the founding families of the historic Huguenot settlement at New Paltz, New York, where the original Deyo stone house still stands.","Her branch of the family had moved west to Mower County, Minnesota by her parents' generation.","She lived to 85, dying August 21, 1985."],"src":["Earlier family tree research notes"]},{"id":"wmdeyo","n":"William Alexander Deyo","sx":"M","s":"tawni","g":4,"pa":["abeld","hannajb"],"sp":["maryjones"],"ch":["gladysd"],"b":["27 Sep 1851",""],"d":["30 Sep 1932",""],"bu":["","Dexter Cemetery, Mower, Minnesota, USA"],"r":"Tawni's 3rd great grandfather","kf":{"Born":"September 27, 1851, Wisconsin","Parents":"Abel Deyo and Hanna Jane Brown","Wife":"Mary Elizabeth Jones","Buried":"Dexter Cemetery, Mower County, MN","Heritage":"French Huguenot descent"},"f":["William Alexander Deyo was born September 27, 1851 in Wisconsin, a waypoint in the family's march west, and farmed in Mower County in southern Minnesota.","Two independent record sets name his parents as Abel Deyo and Hanna Jane Brown.","His surname traces in an unbroken line back to the Huguenot refugees of New Paltz, New York, making this the oldest American line in either family: Deyos were on this continent by the 1660s, a full two centuries before any of the Finns, Danes, or Norwegians in this tree stepped off a boat.","He died September 30, 1932, three days past his 81st birthday, and rests at Dexter Cemetery."],"src":["Earlier family tree research notes"]},{"id":"maryjones","n":"Mary Elizabeth (Jones) Deyo","sx":"F","s":"tawni","g":4,"pa":[],"sp":["wmdeyo"],"ch":["gladysd"],"b":["24 Dec 1854",""],"d":["12 Oct 1930",""],"bu":["","Dexter Cemetery, Mower, Minnesota, USA"],"r":"Tawni's 3rd great grandmother","kf":{"Born":"December 24, 1854","Husband":"William Alexander Deyo","Buried":"Dexter Cemetery, Mower County, MN"},"f":["Mary Elizabeth Jones, born Christmas Eve 1854, married William Deyo and raised the family in Mower County, Minnesota.","Jones is Welsh or English, adding one more thread to Tawni's side.","She died October 12, 1930 at 75."],"src":["Earlier family tree research notes"]},{"id":"abeld","n":"Abel Deyo","sx":"M","s":"tawni","g":5,"pa":[],"sp":["hannajb"],"ch":["wmdeyo"],"b":["1824",""],"d":["Feb 1880",""],"bu":["","Washington Cemetery, Spring Valley, Fillmore, Minnesota, USA"],"r":"Tawni's 4th great grandfather","kf":{"Born":"1824","Wife":"Hanna Jane Brown","Son":"William Alexander Deyo","Buried":"Washington Cemetery, Spring Valley, MN"},"f":["Abel Deyo, born 1824, carried the Huguenot name west in stages: his son William was born in Wisconsin in 1851, and by the 1850s or 60s the family had settled the Spring Valley area of Fillmore County in southern Minnesota, where a small Deyo colony took root.","He died in February 1880 at about 55 and rests at Washington Cemetery in Spring Valley.","Every Deyo in America descends from Christian Deyo, born about 1610 in Artois, France, a Huguenot who fled to Mannheim, Germany in 1660, crossed to America in 1675, and in 1677 signed the New Paltz patent as one of its twelve founders; his son Pierre built the first stone house on Huguenot Street in 1692, and it still stands.","Abel sits five or six generations below Christian; the exact chain runs through the published Deyo genealogy and the Historic Huguenot Street archives, documented but not yet copied into this tree.","He is, either way, the carrier of the oldest American bloodline in either family."],"src":["Earlier family tree research notes"]},{"id":"hannajb","n":"Hanna Jane (Brown) Deyo","sx":"F","s":"tawni","g":5,"pa":[],"sp":["abeld"],"ch":["wmdeyo"],"b":["1837",""],"d":["20 Sep 1896",""],"bu":["","Blaisdell Cemetery, Minnesota, USA"],"r":"Tawni's 4th great grandmother","kf":{"Born":"1837","Husband":"Abel Deyo","Son":"William Alexander Deyo","Buried":"Blaisdell Cemetery, MN"},"f":["Hanna Jane Brown, born 1837, married Abel Deyo and raised the family through the move to Minnesota.","Brown adds an English thread beside the French.","She outlived Abel by sixteen years, dying September 20, 1896 at 59, and rests at Blaisdell Cemetery."],"src":["Earlier family tree research notes"]},{"id":"keith","n":"Keith Edwin Smith","sx":"M","s":"smith","g":1,"pa":["charles","joanne"],"sp":["marymom"],"ch":["dainsmith","peyton","ericsmith","chadsmith","brittanysmith","jadesmith"],"b":["1966","Watertown, Codington, South Dakota, USA"],"r":"Peyton's dad","kf":{"Parents":"Charles and Joanne Smith","Married":"Mary Ann Kenoyer, 1989, Spearfish","Siblings":"Michael, Tamara, Scott, Autumn, Wayne, Roger, Sonja"},"f":["One of Charles and Joanne's eight children, raised on the family farm in rural Hamlin County.","Lives in Lake Norden with his wife Mary.","His seven siblings and their families spread from Lake Norden and Hayti to Sheridan, Wyoming and Yacolt, Washington."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)"]},{"id":"marymom","n":"Mary Ann (Kenoyer) Smith","sx":"F","s":"kenoyer","g":1,"pa":["stevek","annak"],"sp":["keith"],"ch":["dainsmith","peyton","ericsmith","chadsmith","brittanysmith","jadesmith"],"b":["1968","Madison, Lake, South Dakota, USA"],"r":"Peyton's mom","kf":{"Parents":"Stephen and Anna (Koski) Kenoyer","Married":"Keith Smith","Raised":"Black Hills country, western SD","Siblings":"Daniel, Katrina, Sonja"},"f":["Daughter of Steve and Anna Kenoyer, raised in western South Dakota where her dad served as a Highway Patrolman.","Her brother Daniel lives in Belle Fourche and her sisters Katrina Johnston and Sonja Massie live in Yacolt, Washington.","Through her mother she carries the Koski line, Finnish and Old Apostolic Lutheran, the same faith community as Keith's family in Lake Norden.","Both sides of this tree run through the same small Finnish church, one congregation on the prairie and one in the Black Hills, which is almost certainly the bridge that brought a Kenoyer from Rapid City together with a Smith from Lake Norden."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)"]},{"id":"stevek","n":"Stephen Lee Kenoyer","sx":"M","s":"kenoyer","g":2,"pa":["claris","helenr"],"sp":["annak"],"ch":["danielkenoyer","marymom","katrinakenoyer","sonjakenoyer"],"b":["7 Aug 1938","Hot Springs, Fall River, South Dakota, USA"],"d":["17 Jan 2026","Rapid City, Pennington, South Dakota, USA"],"bu":["","Black Hills National Cemetery, Sturgis, Meade, South Dakota, USA"],"r":"Peyton's grandpa","kf":{"Born":"Hot Springs, SD","Parents":"Claris and Helen (Rickenbach) Kenoyer","Served":"US Army, drafted 1961, Ft. Hood","Married":"Anna Koski, June 19, 1965, Sturgis","Career":"SD Highway Patrol, 1965 to 1983","Buried":"Black Hills National Cemetery"},"f":["Steve was born August 7, 1938 in Hot Springs and lived his first four years in Oelrichs.","During World War II the family moved near Los Angeles, where his father built aircraft, then to Wichita, and after the war back to a farm east of Sturgis.","After high school he spent three years near San Diego working in an aircraft factory himself, then came home to Sturgis and joined the city police force.","He was drafted into the Army in 1961 and stationed at Ft.","On June 19, 1965 he married Anna Koski in Sturgis, and that same year he was hired by the South Dakota Highway Patrol, serving four years stationed in Howard and then many more in Wall, patrolling until retirement in 1983.","He later worked for Dave Hahn in Wall and spent years at a gold processing company in Rapid City.","Married Anna Phyllis \"Ann\" Koski 19 Jun 1965 in Sturgis."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)","John Kenoyer genealogy reports emailed Oct 12 2026 (Modified Register for Claris Ervin Kenoyer; Leonhard Gnärr Individual & Scrapbook Reports)"]},{"id":"annak","n":"Anna Phyllis (Koski) Kenoyer","sx":"F","s":"kenoyer","g":2,"pa":["arvok","alinak"],"sp":["stevek"],"ch":["danielkenoyer","marymom","katrinakenoyer","sonjakenoyer"],"r":"Peyton's grandma","kf":{"Parents":"Arvo and Alina Koski","Married":"Steve Kenoyer, 1965, Sturgis","Siblings":"Tom, Norma, Donald, Darlene, Barbara, Clarence 'Willie'","Church":"Old Apostolic Lutheran"},"f":["Anna comes from the Koski family, Finnish ranchers of the Black Hills country.","Her parents Arvo and Alina raised their family on a ranch near Highmore, with children born in Deadwood, and the family was rooted in the Old Apostolic Lutheran Church, the same Finnish Laestadian denomination as the Kangas and Johnson families of Lake Norden.","She married Steve Kenoyer in Sturgis in 1965 and raised four children through his Highway Patrol postings in Howard and Wall before the family settled west of Rapid City in 1990.","Her siblings spread across the region: Tom in Wyoming, Norma Hoffman in Belle Fourche, Donald in Sheridan, and Willie in Whitewood, with a family connection reaching back to Lake Norden through the Wilens.","Koski is Finnish for rapids.","Born 1943 in Deadwood, Lawrence Co., SD (per John Kenoyer register)."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)","John Kenoyer genealogy reports emailed Oct 12 2026 (Modified Register for Claris Ervin Kenoyer; Leonhard Gnärr Individual & Scrapbook Reports)"]},{"id":"claris","n":"Claris Ervin Kenoyer","sx":"M","s":"kenoyer","g":3,"pa":["johnskenoyer","norabelle"],"sp":["helenr"],"ch":["stevek","cliffkenoyer","donkenoyer","bobkenoyer"],"b":["16 Oct 1902","Broken Bow, Custer, Nebraska, USA"],"d":["6 Oct 1995","Sturgis, Meade, South Dakota, USA"],"bu":["","Bear Butte Cemetery, Sturgis, Meade, South Dakota, USA"],"r":"Peyton's great grandfather","kf":{"Born":"October 16, 1902","WWII":"Aircraft factory worker, Los Angeles and Wichita","Farmed":"East of Sturgis, SD","Wife":"Helen Rickenbach","Buried":"Bear Butte Cemetery, Sturgis, SD"},"f":["Claris Ervin Kenoyer was born October 16, 1902, outside South Dakota; the Kenoyers are a German Swiss family that moved west through the Midwest before reaching the Black Hills country.","He raised his family in Hot Springs and Oelrichs, then moved them near Los Angeles during World War II to build aircraft, then to Wichita, and home again to a farm east of Sturgis.","He was a charter board member of the Western Dakota Antique Club at its 1969 founding, and the club's permanent 40 acre showgrounds east of the Sturgis airport is land purchased from Claris and Helen.","His sons were Robert, Clifford, Stephen, and Donald.","He died October 6, 1995, ten days short of 93, and rests at Bear Butte Cemetery in Sturgis in the shadow of the mountain.","He married Helen Margaret Rickenbach at Oelrichs, Fall River County, on November 15, 1930 (Helen's obituary).","His parents are not yet identified. This is the biggest gap on Peyton's mother's side.","Married Helen Margaret Rickenbach 15 Nov 1930 in Oelrichs, Fall River Co., SD. Died of cancer in Sturgis, 10 days short of his 93rd birthday. Four sons: Cliff, Don, Steve and Bob."],"src":["Earlier family tree research notes","https://www.genlookups.com/sd/webbbs_config.pl/noframes/read/345","John Kenoyer genealogy reports emailed Oct 12 2026 (Modified Register for Claris Ervin Kenoyer; Leonhard Gnärr Individual & Scrapbook Reports)"],"upd":1},{"id":"helenr","n":"Helen Margaret (Rickenbach) Kenoyer","sx":"F","s":"kenoyer","g":3,"pa":["bfrickenbach","marycolyer"],"sp":["claris"],"ch":["stevek","cliffkenoyer","donkenoyer","bobkenoyer"],"b":["9 Aug 1910","Pittsburgh, Pennsylvania, USA"],"d":["10 Feb 2001","Sturgis, Meade, South Dakota, USA"],"bu":["","Bear Butte Cemetery, Sturgis, Meade, South Dakota, USA"],"r":"Peyton's great grandmother","kf":{"Born":"August 8, 1910","Maiden":"Rickenbach, a Swiss German name","Husband":"Claris Kenoyer","Sons":"Robert, Clifford, Stephen, Donald","Buried":"Bear Butte Cemetery, Sturgis, SD"},"f":["Helen Rickenbach was born August 9, 1910, from the Rickenbach family of the Hot Springs area in the southern Black Hills.","Rickenbach is a Swiss German name, a river town in Switzerland.","She followed Claris through the wartime moves to California and Kansas and back to the Sturgis farm, raising four boys along the way, and later selling the showgrounds land with Claris to the antique club he helped found.","She died February 10, 2001 at 90 and rests beside Claris at Bear Butte Cemetery.","Born in Pittsburgh, Pennsylvania on August 9, 1910 (her obituary; the tree had August 8). Her son Clifford's obituary says he was \"born on his mother's birthday August 9\". Her parents were Benjamin Franklin and Mary (Colyer) Rickenbach.","When she was two the family moved to Oelrichs, where her father homesteaded. She married Claris Ervin Kenoyer at Oelrichs on November 15, 1930.","The moves: Glendale, California from November 1940 to spring 1941; Hot Springs; Augusta, Kansas from summer 1941 to summer 1944; back to Hot Springs; then rural Sturgis from March 1945. She moved into Sturgis in 1997 (2001 obituary).","She belonged to the United Methodist Church, the United Methodist Women, the Idle Hour Extension Club and the Western Dakota Antique Club. At her death she had 11 grandchildren and 28 great-grandchildren."],"src":["Earlier family tree research notes","https://www.genlookups.com/sd/webbbs_config.pl/noframes/read/345","https://www.legacy.com/us/obituaries/rapidcity/name/clifford-kenoyer-obituary?id=51677813","John Kenoyer genealogy reports emailed Oct 12 2026 (Modified Register for Claris Ervin Kenoyer; Leonhard Gnärr Individual & Scrapbook Reports)"],"upd":1},{"id":"arvok","n":"Arvo Nestor Koski","sx":"M","s":"kenoyer","g":3,"pa":["nestor","ainam"],"sp":["alinak"],"ch":["annak"],"b":["10 Dec 1905","Deerton, Onota Township, Alger County, Michigan, USA"],"d":["9 Oct 1987","Kalispell, Flathead County, Montana, USA"],"bu":["","Rose Hill Cemetery, Spearfish, Lawrence, South Dakota, USA"],"r":"Peyton's great grandfather","kf":{"Born":"1906","Parents":"Nestor Koski and Aina Maria","Ranched":"Near Highmore, SD","Children":"Seven known","Buried":"Rose Hill Cemetery, Spearfish, SD"},"f":["Arvo Nestor Koski, born December 10, 1905 to the Finnish immigrants Nestor and Aina Maria Koski, ranched near Highmore in central South Dakota and raised at least seven children: Tom, Norma, Anna, Donald, Darlene, Barbara, and Clarence 'Willie', the older ones born in Deadwood.","The family anchored itself in the Old Apostolic Lutheran Church, the same Finnish Laestadian denomination as the Kangas and Johnson families of Lake Norden, with the Black Hills congregation at Spearfish.","He died in 1987 and rests at Rose Hill Cemetery in Spearfish, where his daughter Norma joined him in 2025.","WikiTree (citing the 1940 census) gives his birth as December 10, 1905 at Deerton, Onota Township, Alger County, Michigan, on the Lake Superior shore, and his death as October 9, 1987 at Kalispell, Montana. The tree had 1906.","He married Maria Alina Jernberg October 4, 1932 at Spearfish, South Dakota (WikiTree).","His siblings were Arne Alfanso, Alfred Arthur, Isaac Wilhelm, Matt, Ellyn Maria (Owens) and Frank Oscar Koski.","He married Mary Alina Jernberg on October 4, 1932 at Spearfish, joining the Koski and Jernberg lines. Find a Grave gives his birth year as 1906."],"src":["Earlier family tree research notes","https://www.wikitree.com/wiki/Koski-310","WikiTree Koski-310","Find a Grave 108843450"],"upd":1},{"id":"alinak","n":"Mary Alina (Jernberg) Koski","sx":"F","s":"kenoyer","g":3,"pa":["johnjern","annaherr"],"sp":["arvok"],"ch":["annak"],"b":["1905",""],"d":["4 Jan 1987",""],"bu":["","Rose Hill Cemetery, Spearfish, Lawrence, South Dakota, USA"],"r":"Peyton's great grandmother","kf":{"Born":"1905","Husband":"Arvo Nestor Koski","Children":"Seven known","Buried":"Rose Hill Cemetery, Spearfish, SD"},"f":["Mary Alina, who went by Alina, was born in 1905 and raised seven children on the Highmore ranch with Arvo.","Alina is a Finnish name; her maiden name was Jernberg, daughter of John Jernberg and Anna Herrala.","She and Arvo died the same year: she went first, January 4, 1987, and he followed within months.","They rest together at Rose Hill Cemetery in Spearfish.","Maiden name Jernberg. She married Arvo Nestor Koski October 4, 1932 at Spearfish (WikiTree Koski-310)."],"src":["Earlier family tree research notes","https://www.wikitree.com/wiki/Koski-310"],"upd":1},{"id":"johnjern","n":"John Jernberg","sx":"M","s":"kenoyer","g":4,"pa":[],"sp":["annaherr"],"ch":["alinak","jernberg_john","jernberg_aino","jernberg_matt"],"b":["31 Jan 1873","Finland"],"d":["13 Nov 1949","Lawrence County, South Dakota, USA"],"bu":["","Grand River Cemetery, Harding, South Dakota, USA"],"r":"Peyton's 2nd great grandfather","kf":{"Born":"1873","Wife":"Anna Herrala","Homesteaded":"Finnish colony, Harding County, SD","Children":"Alina, Julia, John Hubert, Matt, Innes, and more","Buried":"Grand River Cemetery, Harding County, SD"},"f":["John Jernberg, born 1873, carried a Swedish name, iron mountain, but lived his life among Finns, marrying Anna Herrala and homesteading in the Finnish colony of Harding County, the remote shortgrass country in South Dakota's far northwest corner near Buffalo.","He was born the same year as John Everett Johnson on the other side of Peyton's family, another Swedish-named man in a Finnish world.","His children included Alina, Julia (who married a Katka), John Hubert, Matt, and Innes; two of his sons were military veterans.","He outlived his wife by ten years, dying in 1949, and rests at Grand River Cemetery among the colony he helped build.","Family memory (Grandma Anna, 2026): the Jernberg place was north of the highway near the Short Pines, Harding County, SD. The cemetery sits out in a pasture with a long driveway; the landowner asks for a heads-up before visits.","Find a Grave gives his birth as January 31, 1873 in Finland and death November 13, 1949 in Lawrence County. One family tree places his birth at Kivijärvi, Finland, son of Gustaf Ersson and Lovisa Järnberg (unverified).","His son Innes Andrew Jernberg (1915-1943) was a Pfc. in Company F, 1st Ranger Battalion, Darby's Rangers, and died in World War II."],"src":["Earlier family tree research notes","Phone call with Grandma Anna Kenoyer, Oct 12 2026","Find a Grave 87379980","RootsWeb Grand River Cemetery, Harding Co."]},{"id":"annaherr","n":"Anna (Herrala) Jernberg","sx":"F","s":"kenoyer","g":4,"pa":["manuelh","johannah"],"sp":["johnjern"],"ch":["alinak","jernberg_john","jernberg_aino","jernberg_matt"],"b":["1 Dec 1880","Haapajärvi, Finland"],"d":["5 May 1939","Harding County, South Dakota, USA"],"bu":["","Grand River Cemetery, Harding, South Dakota, USA"],"r":"Peyton's 2nd great grandmother","kf":{"Born":"December 1, 1880, Haapajärvi, Finland","Parents":"Manuel and Johanna Herrala","Husband":"John Jernberg","Buried":"Grand River Cemetery, Harding County, SD"},"f":["Anna Herrala, born 1880 to Manuel and Johanna Herrala, raised her family on the Harding County homestead.","Herrala is a Finnish place surname, from Herrala in southern Finland.","Her name has now traveled the generations: Anna Herrala to her granddaughter Anna Koski, who is Peyton's grandma Anna Kenoyer, who confirmed this very line by text message at one in the morning.","She died in 1939 at about 59 and rests at Grand River Cemetery beside John and her parents.","The Haapajärvi parish register shows Anna born December 1, 1880 and christened December 5 to the crofter Emanuel Herrala and his wife Johanna, 28.","Her father Manuel Herrala received a 158-acre homestead patent in Harding County in 1919, and her brother Andrew E. Herrala (1883-1948) is also buried at Grand River."],"src":["Earlier family tree research notes","HisKi, Haapajärvi christenings 1880","RootsWeb Grand River Cemetery, Harding Co."]},{"id":"manuelh","n":"Manuel Herrala","sx":"M","s":"kenoyer","g":5,"pa":[],"sp":["johannah"],"ch":["annaherr"],"b":["1852","Finland"],"d":["2 Feb 1924","Harding County, South Dakota, USA"],"bu":["","Grand River Cemetery, Harding, South Dakota, USA"],"r":"Peyton's 3rd great grandfather","kf":{"Born":"1852, Finland","Wife":"Johanna","Buried":"Grand River Cemetery, Harding County, SD"},"f":["Manuel Herrala, born 1852 in Finland, is the Herrala immigrant, one of the Finns who carried the colony impulse to its furthest edge: Harding County, about as remote as Dakota homesteading ever got.","He died February 2, 1924 at about 71.","He and Johanna, born the same year, died the same year too, ten weeks apart, and rest together at Grand River Cemetery.","He is the deepest confirmed root on Peyton's mother's side, born the same decade as Erick Kangas on his father's side and the Pellikka patriarch on Tawni's.","From Haapajärvi, Finland; buried at Grand River Cemetery, Harding County."],"src":["Earlier family tree research notes","RootsWeb Grand River Cemetery, Harding Co."]},{"id":"johannah","n":"Johanna Herrala","sx":"F","s":"kenoyer","g":5,"pa":[],"sp":["manuelh"],"ch":["annaherr"],"b":["1852","Finland"],"d":["13 Apr 1924","Harding County, South Dakota, USA"],"bu":["","Grand River Cemetery, Harding, South Dakota, USA"],"r":"Peyton's 3rd great grandmother","kf":{"Born":"1852, Finland","Husband":"Manuel Herrala","Buried":"Grand River Cemetery, Harding County, SD"},"f":["Johanna, born 1852 in Finland like her husband, crossed the ocean and ended on the shortgrass prairie of Harding County.","She followed Manuel in death by just ten weeks in the spring of 1924, a pattern this family repeats: Arvo and Alina Koski also died within months of each other in 1987.","She rests beside Manuel at Grand River Cemetery.","From Haapajärvi, Finland; buried at Grand River Cemetery, Harding County."],"src":["Earlier family tree research notes","RootsWeb Grand River Cemetery, Harding Co."]},{"id":"charles","n":"Charles Peter Smith","sx":"M","s":"smith","g":2,"pa":["eddie","esther"],"sp":["joanne"],"ch":["keith","michaelsmith","tamarasmith","scottsmith","autumnsmith","rogersmith","sonjasmithhomola","waynesmith"],"b":["20 Apr 1932","Erwin, Kingsbury, South Dakota, USA"],"d":["13 Mar 2025",""],"bu":["","Old Apostolic Lutheran Church, Lake Norden, Hamlin, South Dakota, USA"],"r":"Peyton's grandpa","kf":{"Born":"Rural Erwin, SD","Parents":"Eddie and Esther (Berger) Smith","Married":"Audrey Joanne Johnson, June 2, 1956","Children":"Eight","Buried":"Old Apostolic Lutheran Church, Lake Norden"},"f":["Charles was born at rural Erwin, South Dakota on April 20, 1932 to Eddie and Esther (Berger) Smith, one of at least six kids alongside Elwood, Donald, Leonard, Marvin, and Joy.","He served four years in the US Air Force, worked at Cy Jensen's gas station, then farmed until retirement, with a twelve year stretch as a substitute mail carrier on top.","On June 2, 1956 he married Audrey Joanne Johnson, and together they raised eight children on a farm in rural Hamlin County: Michael, Tamara, Scott, Autumn, Keith, Wayne, Roger, and Sonja.","A lifelong member of the Old Apostolic Lutheran Church, he stayed steadfast in his faith to the end.","In his later years he loved driving around the area visiting family and friends.","He died of natural causes on March 13, 2025 at 92, having outlived Joanne by two and a half years, his grandson Logan, granddaughter Laurel, and six great grandchildren.","Served four years in the US Air Force, worked at Cy Jensen's gas station, farmed, and was a substitute mail carrier for 12 years.","Outlived his brothers Elwood, Donald, Leonard and Marvin, his grandson Logan, granddaughter Laurel and six great-grandchildren, including Trenton Monty Smith (d. 2022)."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)","https://www.geisefuneralhome.com/obituary/charles-smith","https://www.geisefuneralhome.com/obituaries/trenton-smith"]},{"id":"joanne","n":"Audrey Joanne (Johnson) Smith","sx":"F","s":"smith","g":2,"pa":["edwinj","lempi"],"sp":["charles"],"ch":["keith","michaelsmith","tamarasmith","scottsmith","autumnsmith","rogersmith","sonjasmithhomola","waynesmith"],"b":["17 Jul 1934","Bryant, Hamlin, South Dakota, USA"],"d":["12 Sep 2022","Lake Norden, Hamlin, South Dakota, USA"],"bu":["","Lake Norden, Hamlin, South Dakota, USA"],"r":"Peyton's grandma","kf":{"Born":"Rural Bryant, SD","Parents":"Edwin and Lempi (Kangas) Johnson","Education":"Aberdeen Teaching College","Married":"Charles P. Smith, June 2, 1956","Buried":"Lake Norden"},"f":["Joanne was born July 17, 1934 in rural Bryant, South Dakota to Edwin and Lempi (Kangas) Johnson.","Her siblings were Alfred, Leon, Eldon, Joyce, and Jean.","Note the family pattern: her brother Alfred carried her grandfather Alfred Kangas's name, and her brother Eldon was formally Edwin, after their dad.","She graduated from Lake Norden High School, earned a teaching degree from Aberdeen Teaching College, and taught in the local country schools until she married Charles in 1956.","From then on her work was the farm and the eight kids they raised on it.","She was a member of the Old Apostolic Lutheran Church, the same Finnish Laestadian congregation her mother's family helped anchor for three generations.","Joanne is the mother of Peyton's dad. Her mother was Lempi Kangas and her paternal grandmother Matilda Roisum, daughter of Joseph Roisum (1850-1936)."],"src":["Earlier family tree research notes","Anna Kenoyer Family Group Sheets (Oct 2026)","https://www.geisefuneralhome.com/obituary/audrey-smith"]},{"id":"eddie","n":"Eddie Smith","sx":"M","s":"smith","g":3,"pa":["peters","elsiec"],"sp":["esther"],"ch":["elwoodsmith","donaldsmith","leonardsmith","marvinsmith","joysmith","charles"],"b":["28 May 1899","Kingsbury, South Dakota, USA"],"d":["20 Jan 1985",""],"bu":["","Badger Cemetery, Badger, Kingsbury, South Dakota, USA"],"r":"Peyton's great grandfather","kf":{"Born":"May 28, 1899, Kingsbury County, SD","Parents":"Peter Christian Smith and Elsie Marie Christensen","Wife":"Esther Berger","Farmed":"Near Erwin, SD","Buried":"Badger Cemetery, Badger, SD"},"f":["Eddie was born May 28, 1899 in Kingsbury County, one of at least nine children of Peter Christian Smith and Elsie Marie Christensen; his siblings carried names like Ludolph, Martin, Carl, George, Clarence, Albert, and Mary.","The family was Danish on both sides.","He farmed near Erwin and raised six children with Esther: Charles, Elwood, Donald, Leonard, Marvin, and Joy.","His delayed birth registration, filed August 10, 1957 with the file number right before Esther's, records the day the two of them went to the courthouse together.","He died January 20, 1985 at 85 and rests at Badger Cemetery in Badger, the little Kingsbury County town at the center of the family's world.","Badger Cemetery (Kingsbury Co.) gravestone listings include \"SMITH, Eddie\" and \"SMITH, Esther A.\"","Son Donald's obituary says Donald was born on \"the family homestead near Badger\" in 1933.","Children confirmed by obituaries: Elwood, Charles, Donald, Leonard, Marvin and Joy. Son Donald alone had 11 children.","He farmed the Berger homestead after marrying Esther Berger. When the old wooden silo fell in 1954 he put up a concrete-stave silo in 1955 and \"painted his name and the date of construction on the west side of the silo\" (Berger Farmstead NRHP nomination, 2005)."],"src":["Earlier family tree research notes","https://southdakotagravestones.org/cemetery.php?cemID=156","https://www.madisondailyleader.com/obituaries/archives/article_1a8d43a6-93c8-57f4-abd6-796bce2dc2c4.html","https://www.geisefuneralhome.com/obituary/charles-smith","https://npgallery.nps.gov/GetAsset/00005b2f-b57b-43f5-9f9c-f9f7cca776d0"],"upd":1},{"id":"esther","n":"Esther Anna (Berger) Smith","sx":"F","s":"smith","g":3,"pa":["henryb","thea"],"sp":["eddie"],"ch":["charles","elwoodsmith","donaldsmith","leonardsmith","marvinsmith","joysmith"],"b":["8 Oct 1904","Kingsbury, South Dakota, USA"],"d":["15 May 2004",""],"bu":["","Badger Cemetery, Badger, Kingsbury, South Dakota, USA"],"r":"Peyton's great grandmother","kf":{"Born":"October 8, 1904, Kingsbury County, SD","Parents":"Henry Christian Berger and Thea Anderson","Husband":"Eddie Smith","Buried":"Badger Cemetery, Badger, SD"},"f":["Esther was born October 8, 1904 in Kingsbury County to Henry Christian Berger, of German stock, and Thea Anderson, of Danish stock.","Her mother died in 1917 when Esther was only twelve, leaving Henry with the family.","She married Eddie Smith and raised their six children on the farm near Erwin.","She outlived Eddie by nineteen years and lived to see the year 2000, dying May 15, 2004 at 99 years old, five months short of a century that began with horse-drawn plows and ended with the internet.","She rests beside Eddie at Badger Cemetery.","Recorded as \"Esther A. Berger\" and \"Esther Berger\" as the mother on her sons' Social Security claims.","Gravestone listed at Badger Cemetery as \"SMITH, Esther A.\"","The farm she grew up on, her grandfather Heinrich's 1883 homestead, was listed on the National Register of Historic Places in 2005 as the Berger Farmstead (also called the Smith Farmstead). Her children Marvin, Donald, Charles and Joy were among the owners named in the nomination."],"src":["Earlier family tree research notes","https://sortedbyname.com/letter_s/smith/eddie_smith_4.html","https://sortedbyname.com/letter_s/smith/index_4188.html","https://southdakotagravestones.org/cemetery.php?cemID=156","https://npgallery.nps.gov/GetAsset/00005b2f-b57b-43f5-9f9c-f9f7cca776d0"],"upd":1},{"id":"peters","n":"Peter Christian Smith","sx":"M","s":"smith","g":4,"pa":["laurst","elsemarie"],"sp":["elsiec"],"ch":["ludolphsmithpc","martinsmithpc","carlsmithpc","georgesmithpc","clarencesmithpc","albertsmithpc","marysmithpc","eddie"],"b":["24 Aug 1869","Denmark"],"d":["30 Jul 1939",""],"bu":["","Danish Lutheran Cemetery, Badger, Kingsbury County, South Dakota, USA"],"r":"Peyton's 2nd great grandfather","kf":{"Born":"1869, Denmark","Parents":"Laurst Pedersen and Else Marie Madsen","Wife":"Elsie Marie Christensen","Name":"Born a Pedersen; became Smith in America","Buried":"Kingsbury County, SD"},"f":["Here's the answer to why the family is named Smith: Peter Christian was born a PEDERSEN in Denmark in 1869, son of Laurst Pedersen and Else Marie Madsen.","His father died when Peter was about seven.","His mother remarried, and between 1883 and 1886 she brought the family to America, settling in Hamlin County.","Somewhere in that crossing, Peter Christian Pedersen became Peter Christian Smith, a common move for Danes tired of spelling their name for Yankee clerks.","He married Elsie Marie Christensen, daughter of Kingsbury County's first settlers, and they raised at least nine children on the Kingsbury County land, including Eddie, born 1899.","His great grandson Charles carried his name: Charles Peter Smith.","Born August 24, 1869 in Denmark; died July 30, 1939. Buried at Badger, Lot 11 Grave 7 Section 8, beside Elsie (Find a Grave).","Full brother: Martin Larsen Smith (1870-1935), who also took the name Smith. Half-siblings from his mother's second marriage to Lars Dahl Madsen: Lars Smed Madson (1881-1968), Johanne Marie (1882-1893), Magnus Johannes \"John\" (1884-1921) and Martin Madson (1886-1948) (Find a Grave memorial 144983039).","On the 1897 Abbott map of Hamlin County, \"P.C. Smith\" owns the SW quarter of Sec. 18, Cleveland township, south and west of Lake Norden.","Peter Christian Smith is Peyton's great-great-grandfather: father of Eddie, grandfather of Charles."],"src":["Earlier family tree research notes","https://www.findagrave.com/memorial/144983039","https://www.findagrave.com/memorial/search?firstname=Peter&lastname=Smith&birthyear=1869&deathyear=1939&location=South+Dakota","https://www.loc.gov/item/2012593118/"],"upd":1},{"id":"elsiec","n":"Elsie Marie (Christensen) Smith","sx":"F","s":"smith","g":4,"pa":["larsc","marenk"],"sp":["peters"],"ch":["ludolphsmithpc","martinsmithpc","carlsmithpc","georgesmithpc","clarencesmithpc","albertsmithpc","marysmithpc","eddie"],"b":["23 Mar 1875","near Renner, Minnehaha County, Dakota Territory"],"d":["17 Jun 1932",""],"bu":["","Danish Lutheran Cemetery, Badger, Kingsbury County, South Dakota, USA"],"r":"Peyton's 2nd great grandmother","kf":{"Born":"1875, near Renner, SD","Parents":"Lars Christensen and Maren Katherene Pedersen","Husband":"Peter Christian Smith","Family":"Daughter of Kingsbury County's first settlers"},"f":["Elsie Marie was born in 1875 near Renner in southeastern Dakota Territory, and at age two her parents carried her and her little brother Chris to Kingsbury County, where, in the words recorded on her memorial, her parents Lars and Maren Christensen were the first white settlers in Kingsbury County.","She grew up with the county itself, married the Danish immigrant Peter Christian Smith, and raised at least nine children.","She died in 1932 at about 57, the same year her grandson Charles was born.","Born March 23, 1875; died June 17, 1932. Buried in the Danish Lutheran Cemetery at Badger, Lot 11 Grave 6 Section 8, next to her husband Peter in Grave 7 (Find a Grave).","Listed as \"Elsie\", 5, in the 1880 census of Badger township.","Her younger brother Albert was the first child born in Badger Township (October 15, 1878)."],"src":["Earlier family tree research notes","https://www.findagrave.com/memorial/search?firstname=Elsie&lastname=Smith&birthyear=1875&deathyear=1932"],"upd":1},{"id":"henryb","n":"Henry Christian Berger","sx":"M","s":"smith","g":4,"pa":["henrich","annaliz"],"sp":["thea"],"ch":["esther"],"b":["5 May 1875",""],"d":["10 Feb 1940",""],"bu":["","St. Peters German Lutheran Cemetery, Badger, Kingsbury, South Dakota, USA"],"r":"Peyton's 2nd great grandfather","kf":{"Born":"May 5, 1875","Parents":"Henrich Berger and Anna Elizabeth Laker","Wife":"Thea Anderson","Buried":"St. Peters German Lutheran Cemetery, Badger, SD"},"f":["Henry Christian Berger was born May 5, 1875 to Henrich Berger and Anna Elizabeth Laker, a German family; the Bergers worshipped at St.","Peters German Lutheran Church at Badger, and three generations of them rest in its cemetery.","He married Thea Anderson, a Danish girl from the neighboring community, and their daughter Esther was born in 1904.","Thea died young in 1917, leaving Henry a widower at 42 with children still at home.","He died February 10, 1940 at 64 and was buried beside Thea at St.","He grew up on his father's Section 14 homestead (claim shack 1883) and built it out. The farmstead's Folk Victorian house dates to 1902, the garage/washhouse to 1914, the Wisconsin dairy barn to 1911, the windmill to 1912 and the granary to 1919, which still has bushel tallies carved into its walls (Berger Farmstead NRHP nomination)."],"src":["Earlier family tree research notes","https://npgallery.nps.gov/GetAsset/00005b2f-b57b-43f5-9f9c-f9f7cca776d0"],"upd":1},{"id":"thea","n":"Thea (Anderson) Berger","sx":"F","s":"smith","g":4,"pa":["andrewa","josephine"],"sp":["henryb"],"ch":["esther"],"b":["9 Feb 1884",""],"d":["29 Aug 1917",""],"bu":["","St. Peters German Lutheran Cemetery, Badger, Kingsbury, South Dakota, USA"],"r":"Peyton's 2nd great grandmother","kf":{"Born":"February 9, 1884","Parents":"Andrew J Anderson and Josephine Anderson","Husband":"Henry Christian Berger","Buried":"St. Peters German Lutheran Cemetery, Badger, SD"},"f":["Thea Anderson was born February 9, 1884 to Andrew and Josephine Anderson, a Danish family of the Badger community whose graves lie in the Danish Lutheran Cemetery there.","She married the German Henry Berger and bore Esther in 1904.","She died August 29, 1917, just 33 years old, when Esther was twelve.","The year suggests the era's hard realities: 1917 and 1918 took many young mothers through influenza and childbirth, though her cause isn't recorded in what's public.","Peters German Lutheran Cemetery at Badger, and her daughter lived another 87 years carrying her memory."],"src":["Earlier family tree research notes"]},{"id":"laurst","n":"Laurst 'Lars' Pedersen","sx":"M","s":"smith","g":5,"pa":[],"sp":["elsemarie"],"ch":["peters","martinlarsensmith"],"b":["1824","Denmark"],"d":["1876","Denmark"],"r":"Peyton's 3rd great grandfather","kf":{"Born":"1824, Denmark","Died":"1876, Denmark","Wife":"Else Marie Madsen, m. 1868","Children":"Three known, including Peter Christian"},"f":["Laurst Pedersen lived and died entirely in Denmark, born 1824, married Else Marie Madsen in 1868, father of three, dead by 1876 when his son Peter was about seven.","He never saw America; America came for his children.","He is the ancestor the Smith name erased and the reason it exists: his son dropped Pedersen at the water's edge.","Find a Grave links him to Else Marie as \"Laurst 'Lars' Pedersen\", 1824-1876, married 1868 (memorial 144983039)."],"src":["Earlier family tree research notes","https://www.findagrave.com/memorial/144983039"],"upd":1},{"id":"elsemarie","n":"Else Marie Pedersen Madsen","sx":"F","s":"smith","g":5,"pa":[],"sp":["laurst","larsdahlmadsen"],"ch":["peters","martinlarsensmith","larssmedmadson","johannemmadsen","magnusjmadsen","martinmadson1886"],"b":["15 Apr 1844","Denmark"],"d":["21 Nov 1890","South Dakota, USA"],"bu":["","Scandinavian Cemetery, Bryant, Hamlin County, South Dakota, USA"],"r":"Peyton's 3rd great grandmother","kf":{"Born":"1844, Denmark","Married":"Laurst Pedersen 1868; widowed 1876; remarried Lars Madsen 1879","Immigrated":"Between 1883 and 1886","Settled":"Hamlin County, SD"},"f":["Else Marie Madsen is the one who made the crossing.","Widowed at about 32 with three children, she remarried in Denmark in 1879 and had four more, then between 1883 and 1886 brought the blended family across the Atlantic to Hamlin County, Dakota Territory.","She got seven years on the prairie before dying in 1890 at about 46.","Her son Peter Christian, by then a Smith, carried the family forward.","Every Smith in this tree descends from her decision to leave.","Born April 15, 1844 in Denmark; died November 21, 1890 at 46; buried in the Scandinavian Cemetery at Bryant, Hamlin County, under a stone that reads \"Mother\" (Find a Grave memorial 144983039, \"Else Marie Pedersen Madsen\").","Married Lars (Laurst) Pedersen in 1868. They had three known children, and he died in Denmark in 1876. In 1879 she married Lars Dahl Madsen, about 13 years younger, and had four more children. The family emigrated between 1883 and 1886.","NAME CHECK: Find a Grave and WikiTree file her as \"Else Marie Pedersen Madsen\", which reads as Pedersen by first marriage and Madsen by second. Her maiden name is therefore not proven. The \"Madsen\" used in this tree may be her second husband's name, not her father's."],"src":["Earlier family tree research notes","https://www.findagrave.com/memorial/144983039","https://www.wikitree.com/wiki/Pedersen-5871"],"upd":1},{"id":"larsc","n":"Lars Christensen","sx":"M","s":"smith","g":5,"pa":["christenskindhoj1804","anecathrinebech"],"sp":["marenk"],"ch":["elsiec","chrislchristensen","albertchristensen1878","parmerchristensen","annalouisechristensen","marychristensen1885"],"b":["25 Nov 1841","Snedsted parish, Hassing herred, Thisted amt, Denmark"],"d":["27 Jan 1913","Laketon Township, Brookings County, South Dakota, USA"],"bu":["","Poinsett Cemetery, Kingsbury, South Dakota, USA"],"r":"Peyton's 3rd great grandfather · first settler","kf":{"Born":"November 25, 1841, Snedsted, Thy, Denmark","Called":"Laust in Denmark, Lewis in Dakota","Wife":"Maren Cathrine Pedersen (first cousin)","Arrived":"East bank of Lake Albert, June 1877, first settler of Badger Township","Buried":"Poinsett Cemetery, Kingsbury County, SD"},"f":["Lars Christensen holds the biggest title in the tree: family and community memory records that he and Maren were the first white settlers in Kingsbury County, arriving around 1877 with a two year old daughter, Elsie, and infant son Chris, before Erwin, before Badger, before the railroads.","A Dane who chose empty prairie and made it home, he lived 36 years on the land he broke first, dying January 27, 1913 at 71.","He's buried at Poinsett Cemetery near the lake, in ground he settled before it had a name on any map.","Between Lars breaking Kingsbury County and Joseph Roisum's farm becoming Lake Norden, Peyton descends from the founding families of two counties.","Also called Laust Christensen in Denmark, and \"Lewis\" in Dakota. The 1880 census of Badger township lists the family as \"Lewis Christeanson\", 39, with Mary, Elsie, Christ and Albert (us-census.org transcription, ED 87).","Born November 25, 1841 in Snedsted parish in Thy. His father, the farmer Christen Christensen Skindhøj, died when Lars was two, and his mother remarried Christen Pedersen Hyldahl (gravgaard.familyds.com #18919).","He married his first cousin Maren Cathrine Pedersen (their mothers were sisters). Find a Grave gives the marriage year as 1874.","\"The first white settler in the township was Lewis Christensen, a native of Denmark, who settled on the east bank of Lake Albert, on the eastern border of the township in June 1877.\" He named Lake Thisted \"after a lake near his old home in Denmark\" (P.R. Crothers, History of Badger Township, 1925).","He and his family lived through the Hard Winter of 1880-81, the season Laura Ingalls Wilder wrote about in \"The Long Winter\". No train reached Volga from January 20 until May 6, 1881, and settlers ground wheat in coffee mills and burned twisted slough hay for heat. The Badger history records no deaths in the township (Crothers 1925).","Land: a cash patent of February 20, 1882 for 174.64 acres in Sec. 12, T112N R53W, on the east shore of Lake Albert (BLM GLO). An 1889 Lake Poinsett timber-culture patent of 159 acres in Brookings County is also in his name (thelandpatents.com), probably the same man but not confirmed.","Died January 27, 1913 in Laketon Township, Brookings County, and buried at Lake Poinsett Cemetery."],"src":["Earlier family tree research notes","https://gravgaard.familyds.com/slaegt/18919.htm","https://www.findagrave.com/memorial/33743565","http://www.solutionsandsystems.com/docs/History_of_Badger_Township.pdf","https://www.us-census.org/pub/usgenweb/census/sd/kingsbury/1880/ed087-pg156a.txt","https://thelandpatents.com/patents/sdmtaa-093153","https://thelandpatents.com/patents/sdmtaa-088958"],"upd":1},{"id":"marenk","n":"Maren Katherene (Pedersen) Christensen","sx":"F","s":"smith","g":5,"pa":["pederkortegaard","elsecathrinebech"],"sp":["larsc"],"ch":["elsiec","chrislchristensen","albertchristensen1878","parmerchristensen","annalouisechristensen","marychristensen1885"],"b":["21 Apr 1843","Tingstrup, Thisted landsogn, Hundborg herred, Thisted amt, Denmark"],"d":["24 Jul 1921","Laketon Township, Brookings County, South Dakota, USA"],"bu":["","Poinsett Cemetery, Kingsbury, South Dakota, USA"],"r":"Peyton's 3rd great grandmother · first settler","kf":{"Born":"April 21, 1843, Denmark","Husband":"Lars Christensen","Buried":"Poinsett Cemetery, Kingsbury County, SD"},"f":["Maren Katherene crossed the ocean and then crossed the prairie with a toddler and a baby, arriving in an empty Kingsbury County around 1877 as its first settler alongside Lars.","Whatever the first winter in a claim shanty on treeless ground was like, she survived it and forty more.","She outlived Lars by eight years, dying July 24, 1921 at 78, and rests beside him at Poinsett Cemetery.","Born April 21, 1843 at Tingstrup just outside Thisted town, home-baptized May 14, 1843 and presented in Thisted church June 18, 1843, the daughter of Peder Olesen Kortegaard and Else Cathrine Larsdatter Bech (gravgaard.familyds.com #18918).","Recorded as \"Mary\", 38, in the 1880 census of Badger township.","She lost two children young: Mary in 1888 at about three and Parmer in 1895 at about 14. Both are buried at Poinsett Cemetery (Find a Grave)."],"src":["Earlier family tree research notes","https://gravgaard.familyds.com/slaegt/18918.htm","https://www.us-census.org/pub/usgenweb/census/sd/kingsbury/1880/ed087-pg156a.txt"],"upd":1},{"id":"henrich","n":"Henrich 'Henry' Berger","sx":"M","s":"smith","g":5,"pa":[],"sp":["annaliz"],"ch":["henryb"],"b":["1 Mar 1840","Germany"],"d":["17 Jun 1898",""],"bu":["","St. Peters German Lutheran Cemetery, Badger, Kingsbury, South Dakota, USA"],"r":"Peyton's 4th great grandfather","kf":{"Born":"March 1, 1840, Germany","Wife":"Anna Elizabeth Laker","Buried":"St. Peters German Lutheran Cemetery, Badger, SD"},"f":["Henrich Berger, born March 1, 1840 in Germany, brought the Berger name to Dakota and helped anchor the German Lutheran community at Badger.","He died June 17, 1898 at 58 and lies at St.","Peters German Lutheran Cemetery, the oldest Berger in its ground.","The Bergers emigrated from Germany in 1879, spent a short time in Nebraska, and came to Badger Township in 1883. Heinrich filed on 160 acres in Section 14. On his 1883 homestead affidavit (Application No. 12445) his improvements were \"a house and eleven acres of broken land\". The house was the 12 by 16 foot claim shack that still stands (Berger Farmstead NRHP nomination, 2005).","The land was deeded to him on May 16, 1887. The NRHP nomination notes that \"the original 160-acre section remains in the same family today\".","In 2005 the Berger Farmstead, also called the Smith Farmstead, about four miles northwest of Badger, was listed on the National Register of Historic Places for its link to the settlement of Kingsbury County (NRIS 05000179).","He helped found the German Lutheran (St. Peter's) congregation organized in western Badger Township in 1889. Its church was rebuilt in 1914 (Crothers 1925)."],"src":["Earlier family tree research notes","https://npgallery.nps.gov/GetAsset/00005b2f-b57b-43f5-9f9c-f9f7cca776d0","https://npgallery.nps.gov/AssetDetail/NRIS/05000179","http://www.solutionsandsystems.com/docs/History_of_Badger_Township.pdf"],"upd":1},{"id":"annaliz","n":"Anna Elizabeth (Laker) Berger","sx":"F","s":"smith","g":5,"pa":[],"sp":["henrich"],"ch":["henryb"],"b":["3 Feb 1838","Germany"],"d":["18 Jun 1925",""],"bu":["","St. Peters German Lutheran Cemetery, Badger, Kingsbury, South Dakota, USA"],"r":"Peyton's 4th great grandmother","kf":{"Born":"February 3, 1838, Germany","Husband":"Henrich Berger","Buried":"St. Peters German Lutheran Cemetery, Badger, SD"},"f":["Anna Elizabeth Laker, born February 3, 1838, outlived Henrich by 27 years, dying June 18, 1925 at 87.","Born when Martin Van Buren was president, she lived to the age of radio.","She rests beside Henrich at St.","Peters, the deepest documented root on the German side.","She came with Heinrich from Germany in 1879, by way of Nebraska, to the Badger Township claim in 1883, and lived to see the 1902 Folk Victorian farmhouse, the 1911 dairy barn and the 1919 granary go up on the homestead (Berger Farmstead NRHP nomination)."],"src":["Earlier family tree research notes","https://npgallery.nps.gov/GetAsset/00005b2f-b57b-43f5-9f9c-f9f7cca776d0"],"upd":1},{"id":"andrewa","n":"Andrew J Anderson","sx":"M","s":"smith","g":5,"pa":[],"sp":["josephine"],"ch":["thea"],"b":["8 Nov 1849","Denmark"],"d":["8 Jun 1919",""],"bu":["","Danish Lutheran Cemetery, Badger, Kingsbury, South Dakota, USA"],"r":"Peyton's 4th great grandfather","kf":{"Born":"November 8, 1849, Denmark","Wife":"Josephine","Buried":"Danish Lutheran Cemetery, Badger, SD"},"f":["Andrew J Anderson, born November 8, 1849, was part of the Danish colony at Badger; he and Josephine lie in the Danish Lutheran Cemetery there, a few miles from the German Lutheran cemetery holding their daughter Thea and her Berger in-laws.","He died June 8, 1919, having outlived Thea by two years."],"src":["Earlier family tree research notes"]},{"id":"josephine","n":"Josephine Anderson","sx":"F","s":"smith","g":5,"pa":[],"sp":["andrewa"],"ch":["thea"],"b":["8 Jan 1856",""],"d":["26 May 1932",""],"bu":["","Danish Lutheran Cemetery, Badger, Kingsbury, South Dakota, USA"],"r":"Peyton's 4th great grandmother","kf":{"Born":"January 8, 1856","Husband":"Andrew J Anderson","Buried":"Danish Lutheran Cemetery, Badger, SD"},"f":["Josephine Anderson, born January 8, 1856, buried her daughter Thea in 1917 and her husband Andrew in 1919, then carried on another thirteen years, dying May 26, 1932 at 76.","She rests at the Danish Lutheran Cemetery at Badger."],"src":["Earlier family tree research notes"]},{"id":"nestor","n":"Nestor Koski","sx":"M","s":"kenoyer","g":4,"pa":[],"sp":["ainam"],"ch":["arvok","koski_arne","koski_alfred","koski_isaac","koski_matt","koski_ellyn","koski_frank"],"b":["1877","Finland"],"d":["4 Aug 1934","Custer, South Dakota, USA"],"bu":["","South Lead Cemetery, Lead, Lawrence, South Dakota, USA"],"r":"Peyton's 2nd great grandfather","kf":{"Born":"1877, Finland","Wife":"Aina Maria","Son":"Arvo Nestor Koski","Settled":"South Dakota","Last home in Finland":"Kankaanpää (probable)","Arrived":"Ellis Island, December 14, 1902 (probable)","Buried":"South Lead Cemetery, Lead, SD"},"f":["Nestor Koski, born 1877, is the Koski immigrant, a Finn who brought the family to South Dakota.","His son carried his name as a middle name, Arvo Nestor.","He died in 1934 at about 57.","Koski means rapids, the white water of a Finnish river.","Died August 4, 1934 at Custer, South Dakota (WikiTree Koski-310).","Possible: a Nestor Koski received an 80-acre homestead patent near Gackle, Logan County, North Dakota in 1917 (BLM GLO). Gackle is the same small Finnish settlement where Tawni's great-grandparents Jacob and Lizzie Bellikka homesteaded in 1902. It may be the same man; not confirmed.","Unverified (Grandma Anna, 2026): buried in the old unkept hill cemetery south of Buffalo, Harding County, SD. Willie, Vicki, Steve and Anna have cleaned it; Willie and Vicki go most years.","Note: Grandma recalled he died at about 56 during wartime, which conflicts with the 1934 date. Needs checking.","A single 26-year-old Nestor Koski of Kankaanpää, Finland, landed at Ellis Island on December 14, 1902 aboard the Ethiopia from Glasgow; this is probably him (medium confidence).","His Lead Daily Call obituary (August 6, 1934) says he was born in Finland and ranched near Newell for a number of years; he left a widow and twelve children. He is buried at South Lead Cemetery.","Possible parents: Frans Michel Michelsson and Ida Mattsdotter of the Nauriskoski farm, Kankaanpää, whose son Nestor was christened September 24, 1876. Unproven."],"src":["Earlier family tree research notes","https://www.wikitree.com/wiki/Koski-310","https://thelandpatents.com/patents/ndbis-0017465","Phone call with Grandma Anna Kenoyer, Oct 12 2026","Find a Grave 77241335","Ellis Island passenger record JFLW-PTG"],"upd":1},{"id":"ainam","n":"Aina Maria (Vasikkaoja) Koski","sx":"F","s":"kenoyer","g":4,"pa":["johanpetterv","gretawiippa"],"sp":["nestor"],"ch":["arvok","koski_arne","koski_alfred","koski_isaac","koski_matt","koski_ellyn","koski_frank"],"b":["31 May 1887","Armasjärvi, Hietaniemi parish (Övertorneå), Norrbotten, Sweden"],"d":["19 Nov 1964","Oroville, Butte, California, USA"],"bu":["","Memorial Park Cemetery, Oroville, Butte, California, USA"],"r":"Peyton's 2nd great grandmother","kf":{"Husband":"Nestor Koski","Son":"Arvo Nestor Koski","Born":"May 31, 1887, Armasjärvi, Hietaniemi, Sweden","Christened":"June 26, 1887","Parents":"Johan Petter Vasikkaoja and Greta Mathilda Wiippa","Emigrated":"June 3, 1903, age 16","Died":"November 19, 1964, Oroville, CA"},"f":["Aina Maria, wife of Nestor, mother of Arvo.","Aina is another deeply Finnish name.","Her dates and maiden name sit one record deeper than public sources reach today; her grave record is linked to Nestor's and would give both.","Maiden name Vasikkaoja, a Finnish farm name. WikiTree gives her as born
