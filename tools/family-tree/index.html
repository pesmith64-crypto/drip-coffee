<style>
:root{--bg:#f7f2ea;--card:#fffdf9;--ink:#2b2420;--mut:#7a6d63;--line:#e7ddd0;--acc:#8a4b2a;--acc2:#f0e2d3;
--smith:#2f5d7c;--kenoyer:#5d7a3a;--tawni:#9a4f6a;--core:#8a4b2a;--new:#c98a1b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
.serif{font-family:"Source Serif 4",Georgia,serif}
header{padding:18px 16px 6px;max-width:640px;margin:0 auto}
h1{font-family:"Source Serif 4",Georgia,serif;font-size:26px;margin:0 0 2px}
.sub{color:var(--mut);font-size:13px}
.note{margin-top:8px;font-size:12.5px;color:var(--mut);background:var(--acc2);border-radius:10px;padding:8px 10px}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 16px 8px;max-width:640px;margin:0 auto;border-bottom:1px solid var(--line)}
.search{width:100%;font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 9px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.small{padding:4px 9px;font-size:12px}
main{max-width:640px;margin:0 auto;padding:6px 16px 60px}
.gh{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:16px 2px 6px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.row:active{background:var(--acc2)}
.bar{width:4px;align-self:stretch;border-radius:3px;flex:none}
.rc{flex:1;min-width:0}
.nm{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:16.5px;line-height:1.25}
.meta{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:#bbb;font-size:18px}
.newtag{display:inline-block;font:600 10px Inter,sans-serif;color:var(--new);border:1px solid var(--new);border-radius:6px;padding:0 4px;margin-left:6px;vertical-align:2px;letter-spacing:.03em}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--new);margin-left:6px;vertical-align:2px}
.empty{color:var(--mut);text-align:center;padding:30px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .22s ease;-webkit-overflow-scrolling:touch}
.sheet.open{transform:none}
.shead{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);z-index:2}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.sbody{max-width:640px;margin:0 auto;padding:14px 16px 80px}
.pname{font-family:"Source Serif 4",Georgia,serif;font-size:25px;font-weight:700;line-height:1.2;margin:2px 0 4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--acc2);color:var(--acc)}
.nav3{display:flex;gap:6px;margin:10px 0 4px}
.nav3 a{flex:1;text-align:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px;font-size:13px;font-weight:600}
.nav3 a.dis{opacity:.35;pointer-events:none}
.sec{margin-top:18px}
.sec h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 6px;font-weight:600}
.kv{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px}
.kv div{padding:7px 0;border-bottom:1px solid var(--line)}
.kv div:last-child{border:0}
.kv b{display:block;font-size:11.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
ul.facts{margin:0;padding:0 0 0 18px}
ul.facts li{margin:0 0 8px}
.srcs a,.srcs span{display:block;font-size:12.5px;color:var(--acc);word-break:break-word;margin-bottom:6px}
.srcs span{color:var(--mut)}
.conf{font-size:12.5px;color:var(--mut);margin-top:4px}
footer{max-width:640px;margin:0 auto;padding:0 16px 40px;color:var(--mut);font-size:12px}
</style>
