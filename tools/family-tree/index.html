 May 31, 1887 and died November 19, 1964 (Koski-310). Her birthplace is shown only as \"Sweden\", possibly meaning the Swedish-speaking Torne valley; this is unconfirmed.","Unverified (Grandma Anna, 2026): buried in California. After Nestor died, her children moved to California during the war and she followed.","Aina is now found in the Swedish records: born May 31, 1887 in Armasjärvi village, Hietaniemi parish, in the Finnish-speaking Torne Valley on the Swedish side of the border, and christened June 26.","Her mother was Greta Mathilda Wiippa (born 1845). She grew up in the cottage household of Johan Petter Vasikkaoja, a backstugusittare (landless cottager), one of at least thirteen children: Ida, Hilda, Maria, Johan Petter, Sofia, Hilma, Selma, Isak, Henrik, Aina and Hulda.","The parish birth book names a neighbor, Erik Granbom of Vuomajärvi, on the father line of her entry, while every census lists her as Johan Petter's daughter. Her legal father was Johan Petter; her biological father is an open question.","At sixteen, on June 3, 1903, she left for America (EMUS emigrant database), following older sisters who had gone before her.","She died November 19, 1964 at Oroville, California, where her children had moved during the war, and is buried at Memorial Park Cemetery."],"src":["Earlier family tree research notes","https://www.wikitree.com/wiki/Koski-310","Phone call with Grandma Anna Kenoyer, Oct 12 2026","Riksarkivet (Swedish National Archives): 1870/1890/1900 census and Hietaniemi birth book C:5, 1887","EMUS emigrant database, Haparanda-Torneå Släktforskarförening","Find a Grave 93804139"],"upd":1},{"id":"edwinj","n":"Edwin Joel Johnson","sx":"M","s":"smith","g":3,"pa":["johne","matilda"],"sp":["lempi"],"ch":["eldonjohnson","alfredjohnsonj","leonjohnsonj","joycejohnsonj","jeanjohnsonj","joanne"],"b":["23 Nov 1906","Braddock, Emmons, North Dakota, USA"],"d":["18 Mar 1981","Robbinsdale, Hennepin, Minnesota, USA"],"bu":["","Apostolic Cemetery, Lake Norden, Hamlin, South Dakota, USA"],"r":"Peyton's great grandfather","kf":{"Born":"Braddock, Emmons County, North Dakota","Parents":"John Everett Johnson and Matilda Anna Roisum","Married":"Lempi Kangas, Dec 20, 1930, Watertown, SD","Farmed":"Opdahl Township, Hamlin County","Died":"Robbinsdale, Minnesota","Buried":"Apostolic Cemetery, Lake Norden"},"f":["Edwin was born November 23, 1906 in Braddock, North Dakota, where his parents had moved to homestead after marrying in Lake Norden.","The family later returned to the Lake Norden area.","On December 20, 1930, in Watertown, he married Lempi Kangas, joining two of the area's founding Finnish families.","They farmed in Opdahl Township near Bryant and raised their children there, including Joanne, born 1934, and son Eldon, born 1932.","He died March 18, 1981 in Robbinsdale, Minnesota at 74, and was brought home to the Apostolic Cemetery in Lake Norden."],"src":["Earlier family tree research notes","https://www.geisefuneralhome.com/obituary/audrey-smith"]},{"id":"lempi","n":"Lempi A (Kangas) Johnson","sx":"F","s":"smith","g":3,"pa":["alfred","marykurkela"],"sp":["edwinj"],"ch":["eldonjohnson","alfredjohnsonj","leonjohnsonj","joycejohnsonj","jeanjohnsonj","joanne"],"b":["15 Jan 1907","Hamlin, South Dakota, USA"],"d":["17 Aug 1995",""],"bu":["","Apostolic Cemetery, Lake Norden, Hamlin, South Dakota, USA"],"r":"Peyton's great grandmother","kf":{"Born":"Hamlin County, SD","Parents":"Alfred Erick Kangas and Mary Kurkela","Married":"Edwin Joel Johnson, Dec 20, 1930","Lived":"Opdahl Township, near Bryant","Buried":"Apostolic Cemetery, Lake Norden"},"f":["Lempi was born January 15, 1907 in Hamlin County, the fifth of Alfred and Mary Kangas's twelve children.","Lempi is a Finnish name meaning love.","She married Edwin Joel Johnson on December 20, 1930 in Watertown and they made their life farming in Opdahl Township near Bryant.","She named her firstborn son Edwin after her husband, and the family called him Eldon; the naming honor for her father Alfred went to another son.","She outlived Edwin by fourteen years, dying August 17, 1995 at 88, and rests beside him at the Apostolic Cemetery in Lake Norden, the same ground as her parents and grandparents.","In the 1950 census she was in Opdahl Township, Hamlin County, with children Eldon, Jo Ann, Joyce, Alfred and Jean.","Social Security death index: last residence Bryant (57221).","Her father was Alfred Erick Kangas (1870-1944) and her grandfather the immigrant Erick Alfred Kangas (1847-1926)."],"src":["Earlier family tree research notes","https://www.myheritage.com/census/us/1950census/johnson/11_8_0","https://www.locateancestors.com/lempi-a/"]},{"id":"johne","n":"John Everett Johnson","sx":"M","s":"smith","g":4,"pa":["peterj","brita"],"sp":["matilda"],"ch":["edwinj"],"b":["18 Aug 1873","Tornio, Finland"],"d":["3 Jan 1949","Braddock, Emmons, North Dakota, USA"],"bu":["","Tell Cemetery, Tell Township, Emmons, North Dakota, USA"],"r":"Peyton's 2nd great grandfather","kf":{"Born":"Tornio, Finland","Parents":"Peter Johnson and Brita Jonsdotter","Married":"Matilda Roisum, Dec 26, 1900, Lake Norden","Children":"At least 13","Later":"Emmons County, ND from about 1906","Buried":"Tell Cemetery, Tell Township, ND"},"f":["Here's the twist in the Johnson line: it's Finnish too.","John was born August 18, 1873 in Tornio, a Finnish town right on the Swedish border at the top of the Gulf of Bothnia.","The family name was anglicized to Johnson in America, a common move for Finns and Swedes alike.","He immigrated to the Lake Norden Finnish colony and on December 26, 1900, the day after Christmas, married Matilda Roisum there.","Around 1906 they joined a wave of settlers heading to newly opened land in Emmons County, North Dakota, where son Edwin was born in Braddock that year.","They farmed Tell Township for decades and raised at least thirteen children."],"src":["Earlier family tree research notes"]},{"id":"matilda","n":"Matilda Anna (Roisum) Johnson","sx":"F","s":"smith","g":4,"pa":["josephr","sophia"],"sp":["johne"],"ch":["edwinj"],"b":["15 Nov 1881","Lake Norden, Hamlin, South Dakota, USA"],"d":["8 Sep 1954","Braddock, Emmons, North Dakota, USA"],"bu":["","Tell Cemetery, Tell Township, Emmons, North Dakota, USA"],"r":"Peyton's 2nd great grandmother","kf":{"Born":"Lake Norden, SD","Parents":"Joseph Rognaldsen Roisum and Sophia Swenson","Married":"John Everett Johnson, Dec 26, 1900","Children":"At least 13","Buried":"Tell Cemetery, Tell Township, ND"},"f":["Matilda brings the Norwegian blood into the line.","She was born November 15, 1881 right in Lake Norden, making her one of the earliest children born in the new settlement, to Joseph Rognaldsen Roisum and Sophia Swenson.","Roisum is a Norwegian farm name, and Rognaldsen means son of Rognald.","She married the Finnish immigrant John Johnson at Lake Norden in 1900, and together they homesteaded in Emmons County, North Dakota, raising at least thirteen children through prairie winters that make Hamlin County look mild.","She died September 8, 1954 in Braddock and is buried beside John at Tell Cemetery.","Matilda was the daughter of Joseph Rognaldsen Roisum (1850-1936) and the paternal grandmother of Grandma Joanne."],"src":["Earlier family tree research notes"]},{"id":"peterj","n":"Peter Johnson","sx":"M","s":"smith","g":5,"pa":[],"sp":["brita"],"ch":["johne"],"b":["13 Mar 1852","Finland"],"d":["10 Sep 1926",""],"r":"Peyton's 3rd great grandfather","kf":{"Born":"Finland region, 1852","Wife":"Brita Jonsdotter","Son":"John Everett Johnson"},"f":["Peter, father of John Everett Johnson, was born March 13, 1852.","His son was born in Tornio, Finland, placing the family in the far north of the Gulf of Bothnia, borderland country where Finnish and Swedish families mixed.","The name Johnson is the American form; the original family name may have been Juhonpoika or a Swedish patronymic.","His detailed record sits behind FamilySearch's private layer.","Finnish and Swedish parish records for the Tornio valley are well preserved and would carry this line back further."],"src":["Earlier family tree research notes"]},{"id":"brita","n":"Brita Jonsdotter","sx":"F","s":"smith","g":5,"pa":[],"sp":["peterj"],"ch":["johne"],"b":["25 Sep 1842",""],"d":["19 Nov 1916",""],"r":"Peyton's 3rd great grandmother","kf":{"Born":"1842","Husband":"Peter Johnson","Son":"John Everett Johnson"},"f":["Brita Jonsdotter, born September 25, 1842, was ten years older than her husband Peter.","Jonsdotter is a Swedish-style patronymic meaning daughter of Jon, common in the Tornio valley where Swedish naming customs ran deep even among Finnish speakers.","She lived to 74, dying in November 1916."],"src":["Earlier family tree research notes"]},{"id":"josephr","n":"Joseph Rognaldsen Roisum","sx":"M","s":"smith","g":5,"pa":["rognaldroisum","annehansdatter"],"sp":["sophia"],"ch":["matilda"],"b":["9 May 1850","Røisum, Leikanger parish, Sogn og Fjordane, Norway"],"d":["1936",""],"r":"Peyton's 3rd great grandfather","kf":{"Born":"May 9, 1850, Røisum farm, Leikanger, Sogn, Norway (baptized \"John\")","Wife":"Sophia Swenson","Daughter":"Matilda Anna Roisum","Brothers":"Hans (H.R.) and Iver Roisum, Lake Norden neighbors"},"f":["Joseph Rognaldsen Roisum was born May 9, 1850 in Norway.","Roisum is a farm name from the Sogn region of western Norway, and Rognaldsen marks him as the son of a man named Rognald.","He was in the Lake Norden area by 1881 at the latest, when his daughter Matilda was born there, twenty six years before any town existed.","That means the Roisum farm sat on or beside the future townsite.","When the South Dakota Central Railway came through in October 1907 and the town was platted in 1908, part of Lake Norden was laid out on Roisum land: family memory holds that the town began on the Roisum's Addition block, and with roughly 300 Roisums in the entire country, any Roisum on a Lake Norden plat is this family.","The plat itself sits at the Hamlin County Register of Deeds in Hayti, waiting to be copied.","Baptized in Leikanger church on May 12, 1850, three days after his birth, as plain \"John\", son of Rognald Johnsen and Anna Hansdatter of the Røisum farm (Leikanger parish register 1838-1851, p.134 no.27, Digitalarkivet). John Rognaldsen became \"Joe\" in America; his BLM land patents read \"Joe Rognaldson Roisum\".","In the 1865 Norwegian census he is John Rognaldsen, 16, on his father's Røisum farm in Leikanger on the Sognefjord. His father emigrated on a Bergen-Quebec ship in 1866.","Land: a homestead patent of September 25, 1888 for 160 acres near Lake Norden and a timber-culture patent of February 20, 1900 for 80 acres (BLM GLO via thelandpatents.com).","On the 1897 Abbott map of Hamlin County \"Joe R. Roisum\" holds the NW quarter of Sec. 20, Norden township, with a schoolhouse at its corner and the Finn church in Sec. 19. His younger brothers Iver and H.R. (Hans) Roisum own the neighboring quarter on the south shore of Lake Norden."],"src":["Earlier family tree research notes","https://www.digitalarkivet.no/en/view/255/pd00000039751215","https://www.digitalarkivet.no/en/census/person/pf01038255001388","https://thelandpatents.com/patents/sdmtaa-093666","https://thelandpatents.com/patents/sdmtaa-093869","https://www.loc.gov/item/2012593118/"],"upd":1},{"id":"sophia","n":"Sophia Swenson","sx":"F","s":"smith","g":5,"pa":[],"sp":["josephr"],"ch":["matilda"],"b":["Jan 1851",""],"d":["11 Aug 1939",""],"r":"Peyton's 3rd great grandmother","kf":{"Born":"1851","Husband":"Joseph Rognaldsen Roisum","Daughter":"Matilda Anna Roisum"},"f":["Sophia Swenson, born January 1851, married Joseph Roisum and raised her family in the young Lake Norden settlement.","Swenson is Scandinavian, son of Sven, fitting the Norwegian household.","She lived to 88, dying in August 1939, one of the last of the original settler generation."],"src":["Earlier family tree research notes"]},{"id":"alfred","n":"Alfred Erick Kangas","sx":"M","s":"smith","g":4,"pa":["erick","briita"],"sp":["marykurkela"],"ch":["lempi"],"b":["Apr 1870","Finland"],"d":["11 Jan 1944",""],"bu":["","Apostolic Cemetery, Lake Norden, Hamlin, South Dakota, USA"],"r":"Peyton's 2nd great grandfather","kf":{"Born":"Finland, April 1870","Parents":"Erick Alfred Kangas and Briita Magdalena Koivu","Married":"Mary Kurkela, 1897, Brookings, SD","Children":"Twelve","Farmed":"Hamlin County","Buried":"Apostolic Cemetery, Lake Norden"},"f":["Alfred was born in Finland in April 1870, the firstborn of Erick and Briita, and crossed the Atlantic as a boy when his family joined the Finnish migration to Dakota Territory.","His seven younger siblings, Johanna, Elizabeth, Anna, Emil, Edward, Mary, and David, mostly settled the same townships.","In 1897 he married Mary Kurkela in Brookings, and over the next 24 years they had twelve children: Mildred, Frederick, Emil, Emma, Lempi, George, Edward, Ellen, Eldora, Wesley, Bernice, and Viola.","Two died as infants, and Bernice died in 1944 at just 26, the same year as her father.","Alfred farmed Hamlin County his whole adult life and died January 11, 1944 at 73.","He's buried at the Apostolic Cemetery in Lake Norden.","Alfred is the son of Erick Alfred Kangas and the father of Lempi, making him Grandma Joanne's grandfather."],"src":["Earlier family tree research notes"]},{"id":"marykurkela","n":"Mary (Kurkela) Kangas","sx":"F","s":"smith","g":4,"pa":["jacobk","annabrita"],"sp":["alfred"],"ch":["lempi"],"b":["27 Jul 1877","Haukipudas, Oulu, Finland"],"d":["19 Jun 1955","Lake Norden, Hamlin, South Dakota, USA"],"bu":["","Apostolic Cemetery, Lake Norden, Hamlin, South Dakota, USA"],"r":"Peyton's 2nd great grandmother","kf":{"Born":"Haukipudas, Oulu, Finland","Parents":"Jacob Kurkela and Anna Brita Hali","Married":"Alfred Kangas, 1897, Brookings","Children":"Twelve","Buried":"Apostolic Cemetery, Lake Norden"},"f":["Mary was born July 27, 1877 in Haukipudas, a coastal parish just north of Oulu, Finland, to Jacob Kurkela and Anna Brita Hali.","This is the single most precise Finnish origin point found in the whole tree: the Kurkela family can be traced in Haukipudas parish books.","She emigrated as a young woman and married Alfred Kangas in Brookings in 1897, then spent nearly fifty years raising twelve children on the Hamlin County farm and burying two of them as infants.","She outlived Alfred by eleven years, dying June 19, 1955 in Lake Norden at 77, and rests with him at the Apostolic Cemetery."],"src":["Earlier family tree research notes"]},{"id":"erick","n":"Erick Alfred Kangas","sx":"M","s":"smith","g":5,"pa":["matti","lisa"],"sp":["briita"],"ch":["alfred"],"b":["30 Aug 1847","Finland"],"d":["10 Dec 1926","Clatsop, Oregon, USA"],"bu":["","Elim Cemetery, Brush Prairie, Clark, Washington, USA"],"r":"Peyton's 3rd great grandfather · the immigrant","kf":{"1910":"Clark County, Washington","1920":"Cleveland Township, Hamlin County","Born":"Finland, 1847","Parents":"Matti Jylhänkangas and Lisa Andersdotter","Wife":"Briita Magdalena Koivu","Children":"At least 8","Died":"Clatsop County, Oregon","Buried":"Elim Cemetery, Brush Prairie, WA","Land":"Hamlin Co. patents 1890 and 1894, T113N R54W"},"f":["Erick is the immigrant, the man who moved the family from Finland to Dakota.","Born August 30, 1847 to Matti Jylhänkangas and Lisa Andersdotter, he shortened the surname to Kangas in America.","An Erick Kangas is recorded as one of the builders of the 1881 Hendrickson Farm two miles west of Lake Norden, a property now on the National Register of Historic Places specifically as an example of Finnish settlement architecture.","That is almost certainly him, swinging a hammer in the settlement's very first years.","His later life had a westward chapter most of the family never took: by 1910 he and Briita were living in Clark County, Washington, in the Finnish community around Brush Prairie.","Census records show them back in Cleveland Township, Hamlin County by 1920, but Erick died December 10, 1926 in Clatsop County, Oregon, on the coast at the mouth of the Columbia.","The federal land records show his claims in Hamlin County: 160 acres in the NE quarter of Section 15, Township 113 North, Range 54 West, patented February 7, 1890, and a 160-acre Timber Culture claim (where a settler earned the land by planting trees) in the SE quarter of Section 9, same township, patented October 30, 1894.","A relative, Abram Kangas, patented 40 acres in Section 1 of the same township in 1902. Peter Christian Smith's 1897 quarter in Section 18 lay in the same township, so the Smith and Kangas lines farmed within a few miles of each other a generation before they joined."],"src":["Earlier family tree research notes","BLM General Land Office records (patents 4986 and 1275)"]},{"id":"briita","n":"Briita Magdalena (Koivu) Kangas","sx":"F","s":"smith","g":5,"pa":["jacobkoivu","caisa"],"sp":["erick"],"ch":["alfred"],"b":["30 Jan 1845","Finland"],"d":["30 Dec 1929","Hamlin, South Dakota, USA"],"bu":["","Elim Cemetery, Brush Prairie, Clark, Washington, USA"],"r":"Peyton's 3rd great grandmother","kf":{"Born":"Finland, 1845","Parents":"Jacob Koivu and Caisa","Husband":"Erick Alfred Kangas","Children":"At least 8","Died":"Hamlin County, SD","Buried":"Elim Cemetery, Brush Prairie, WA"},"f":["Briita Magdalena Koivu was born January 30, 1845 in Finland to Jacob Koivu and his wife Caisa.","Koivu is Finnish for birch tree.","She was two years older than Erick, crossed the ocean with him, raised at least eight children on the Dakota prairie, and followed him west to Washington in their later years before returning to Hamlin County.","She died December 30, 1929 in Hamlin County at 84, three years after Erick, but was carried back to Elim Cemetery in Brush Prairie, Washington to be buried beside him.","Whatever pulled them to the Northwest held them both in the end."],"src":["Earlier family tree research notes"]},{"id":"jacobk","n":"Jacob Kurkela","sx":"M","s":"smith","g":5,"pa":["abrahammaalinautio","grethakurkela"],"sp":["annabrita"],"ch":["marykurkela"],"b":["18 Oct 1843","Haukipudas, Oulu province, Finland"],"d":["6 May 1908",""],"r":"Peyton's 3rd great grandfather","kf":{"Born":"Finland, 1843","Wife":"Anna Brita Hali","Daughter":"Mary Kurkela","Parish":"Haukipudas, Oulu"},"f":["Jacob Kurkela, born October 18, 1843, raised his family in Haukipudas parish on the Gulf of Bothnia coast just north of Oulu.","Kurkela is a Finnish farm name.","Whether Jacob himself ever emigrated or stayed in Finland while his daughter Mary crossed over is an open question his parish records would answer.","Christened October 22, 1843 in Haukipudas as Jacob, son of the farmer Abraham \"Maalinautio\" and Gretha, aged 37 (HisKi event 469677). HisKi lists \"Maalinautio eller Kurkela\" as one farm.","Married December 28, 1873 in Haukipudas: \"farmer's son Jakob Abrahamsson Maalinautio\" and \"farmer's daughter Anna Brita Andersdotter Häli\", officiated by J.S. Laurell (HisKi, Haukipudas marriages)."],"src":["Earlier family tree research notes","https://hiski.genealogia.fi/hiski?en+0065+kastetut+8696","https://hiski.genealogia.fi/hiski?en+0065+vihityt"],"upd":1},{"id":"annabrita","n":"Anna Brita (Häli) Kurkela","sx":"F","s":"smith","g":5,"pa":["andershali","catharinahali"],"sp":["jacobk"],"ch":["marykurkela"],"b":["28 Jan 1849","Haukipudas, Oulu province, Finland"],"d":["15 Jan 1916",""],"r":"Peyton's 3rd great grandmother","kf":{"Born":"Finland, 1849","Husband":"Jacob Kurkela","Daughter":"Mary Kurkela"},"f":["Anna Brita Hali, born January 28, 1849, married Jacob Kurkela and was mother to Mary, who left Haukipudas for South Dakota.","Anna Brita died in January 1916, two weeks short of her 67th birthday.","Christened February 4, 1849 in Haukipudas as \"An: Brita\", daughter of the farmer Anders Johansson Häli and Catharina, aged 31 (HisKi event 470105).","Married Jakob Abrahamsson (Maalinautio/Kurkela) December 28, 1873 in Haukipudas. Her daughter Mary was born there in 1877."],"src":["Earlier family tree research notes","https://hiski.genealogia.fi/hiski?en+0065+kastetut+9124"],"upd":1},{"id":"matti","n":"Matti Jylhänkangas","sx":"M","s":"smith","g":6,"pa":[],"sp":["lisa"],"ch":["erick"],"b":["17 Apr 1826","Finland"],"r":"Peyton's 4th great grandfather · oldest confirmed ancestor","kf":{"Born":"April 17, 1826, Finland","Wife":"Lisa Andersdotter","Son":"Erick Alfred Kangas","Surname":"Jylhänkangas, shortened to Kangas in America"},"f":["Matti Jylhänkangas, born April 17, 1826, is the oldest confirmed ancestor in the tree, a Finn born while Finland was a Grand Duchy of the Russian Empire.","The full surname Jylhänkangas roughly combines jylhä, meaning rugged or majestic, with kangas, meaning heathland or dry pine forest: rugged heath.","The name describes the kind of land the family came from.","His son Erick carried the shortened name Kangas to America.","Matti's own parents, and the exact home parish, sit one layer deeper in Finnish church books, which are extensively digitized.","This is the next door to open on the Kangas line."],"src":["Earlier family tree research notes"]},{"id":"lisa","n":"Lisa Andersdotter","sx":"F","s":"smith","g":6,"pa":[],"sp":["matti"],"ch":["erick"],"b":["8 Jan 1823","Finland"],"r":"Peyton's 4th great grandmother","kf":{"Born":"January 8, 1823, Finland","Husband":"Matti Jylhänkangas","Son":"Erick Alfred Kangas"},"f":["Lisa Andersdotter was born January 8, 1823.","Her patronymic surname means daughter of Anders, so her father's name is already half known: Anders.","She married Matti Jylhänkangas and their son Erick became the family's American founder."],"src":["Earlier family tree research notes"]},{"id":"jacobkoivu","n":"Jacob Koivu","sx":"M","s":"smith","g":6,"pa":[],"sp":["caisa"],"ch":["briita"],"r":"Peyton's 4th great grandfather","kf":{"Wife":"Caisa","Daughter":"Briita Magdalena Koivu"},"f":["Jacob Koivu is known from his daughter Briita's records.","His dates and parish are in the private layer of the Finnish records; Briita's 1845 birth record in Finland would name his farm and village."],"src":["Earlier family tree research notes"]},{"id":"caisa","n":"Caisa","sx":"F","s":"smith","g":6,"pa":[],"sp":["jacobkoivu"],"ch":["briita"],"r":"Peyton's 4th great grandmother","kf":{"Husband":"Jacob Koivu","Daughter":"Briita Magdalena Koivu"},"f":["Caisa, wife of Jacob Koivu and mother of Briita, is the faintest confirmed name in the tree, recorded only by her first name, a Finnish form of Katherine.","Her full record waits in the same parish books as Jacob's."],"src":["Earlier family tree research notes"]},{"id":"danielkenoyer","n":"Daniel Lee Kenoyer","sx":"M","s":"kenoyer","g":1,"pa":["stevek","annak"],"sp":["loricederstrom"],"ch":["calisakenoyer","annakenoyer","patrickkenoyer","williamkenoyer","larskenoyer","laceykenoyer","claykenoyer","jameskenoyer"],"b":["1966","Madison, Lake, South Dakota, USA"],"r":"Peyton's uncle","kf":{"Parents":"Stephen Lee Kenoyer and Anna Phyllis Koski","Spouse":"Lori Lyn Cederstrom","Married":"Lori Lyn Cederstrom 1990 in Spearfish, SD","Children":"Calisa, Anna, Patrick, William, Lars, Lacey, Clay, James"},"f":["Daniel Lee Kenoyer, son of Stephen Lee Kenoyer and Anna Phyllis Koski, born 1966 in Madison, SD.","Daniel was baptized in Spearfish SD - Sponsors : Herschell and Norma Hoffman and David and Evelyn Wilen."],"src":["Anna Kenoyer Family Group Sheets (Oct 2026)"]},{"id":"danmassie","n":"Dan Randal Massie","sx":"M","s":"kenoyer","g":1,"pa":["jackmassie","nancynorby"],"sp":["sonjakenoyer"],"ch":["justinmassie","jacemassie","kristinamassie","briellemassie","wesleymassie","jaylenmassie","brylenmassie"],"b":["1968","Vancouver, Clark, Washington, USA"],"r":"Peyton's uncle by marriage","kf":{"Parents":"Jack Lee Massie and Nancy Ann Norby","Spouse":"Sonja Marie Kenoyer","Married":"Sonja Marie Kenoyer 1991 in Spearfish, SD","Children":"Justin, Jace, Kristina, Brielle, Wesley, Jaylen, Brylen"},"f":["Dan Randal Massie, son of Jack Lee Massie and Nancy Ann Norby, born 196 n his son Lars was two, and was buried in Snedsted churchyard July 16, 1844.","His son Lars later married Maren Cathrine Pedersen, the daughter of the same Else Cathrine, so Lars and Maren were first cousins and also shared a half-sister, Kirsten."],"src":["https://gravgaard.familyds.com/slaegt/18832.htm"],"c":"likely","new":"Oct 11"},{"id":"anecathrinebech","n":"Ane Cathrine Larsdatter Bech","sx":"F","s":"smith","g":6,"pa":["larsbech1759","marenchristensdatter1765"],"sp":["christenskindhoj1804","christenhyldahl"],"ch":["karenchristensen1835","johannechristensen","christenchristensenjr","petercchristensenhyldahl","jensmchristensen","sorenkjerchristensen","larsc"],"b":["1808","Snedsted parish, Hassing herred, Thisted amt, Denmark"],"r":"Peyton's 4th great grandmother","kf":{"Born":"1808, Snedsted parish, Hassing herred, Thisted amt, Denmark","Spouse":"Christen Christensen Skindhøj, Christen Pedersen Hyldahl","Confidence":"likely"},"f":["Baptized May 1, 1808 in Snedsted church and confirmed there in 1822, the daughter of Lars Christensen Bech and Maren Christensdatter (gravgaard.familyds.com #18834).","Married Christen Christensen Skindhøj January 30, 1835 in Snedsted church. Their children were Karen, Johanne, Christen and Lars, born 1841, the future Dakota pioneer.","Widowed in July 1844, she married again on December 13, 1844, to Christen Pedersen Hyldahl (born 1809 in Nørhå), and had three more sons: Peter Christian, Jens Mathias and Søren Kjer Christensen.","Her older sister Else Cathrine was Maren Christensen's mother, which makes Lars and Maren first cousins."],"src":["https://gravgaard.familyds.com/slaegt/18834.htm"],"c":"likely","new":"Oct 11"},{"id":"christenhyldahl","n":"Christen Pedersen Hyldahl","sx":"M","s":"smith","g":6,"pa":[],"sp":["anecathrinebech"],"ch":["petercchristensenhyldahl","jensmchristensen","sorenkjerchristensen"],"b":["25 Sep 1809","Nørhå parish, Hundborg herred, Thisted amt, Denmark"],"r":"Stepfather of Lars Christensen","kf":{"Born":"25 sdatter"],"sp":[],"ch":[],"b":["about 1853","Leikanger, Norway"],"r":"Brother of Joseph Rognaldsen Roisum","kf":{"Born":"about 1853, Leikanger, Norway","Confidence":"likely"},"f":["Baptized January 29, 1854 in Leikanger, son of Rognald Johnsen and Anne Hansdatter of Røisum (Digitalarkivet). Aged 12 in the 1865 census.","Very likely the \"H. R. Roisum\" who owned lots 1 and 2 in the NE quarter of Sec. 21, Norden township, on the south shore of Lake Norden, on the 1897 Abbott map of Hamlin County."],"src":["https://www.digitalarkivet.no/en/view/255/pd00000017786483","https://www.digitalarkivet.no/en/census/person/pf01038255001388","https://www.loc.gov/item/2012593118/"],"c":"likely","new":"Oct 11"},{"id":"magretheroisum","n":"Magrethe Rognaldsdatter","sx":"F","s":"smith","g":5,"pa":["rognaldroisum","annehansdatter"],"sp":[],"ch":[],"b":["1855","Leikanger, Norway"],"r":"Sister of Joseph Rognaldsen Roisum","kf":{"Born":"1855, Leikanger, Norway","Confidence":"likely"},"f":["Baptized December 25, 1855 in Leikanger (Digitalarkivet)."],"src":["https://www.digitalarkivet.no/en/view/255/pd00000017786912"],"c":"likely","new":"Oct 11"},{"id":"martheroisum","n":"Marthe Rognaldsdatter","sx":"F","s":"smith","g":5,"pa":["rognaldroisum","annehansdatter"],"sp":[],"ch":[],"b":["1859","Leikanger, Norway"],"r":"Sister of Joseph Rognaldsen Roisum","kf":{"Born":"1859, Leikanger, Norway","Confidence":"likely"},"f":["Baptized November 13, 1859 in Leikanger (Digitalarkivet)."],"src":["https://www.digitalarkivet.no/en/view/255/pd00000017787764"],"c":"likely","new":"Oct 11"},{"id":"iverroisum","n":"Iver Rognaldsen Roisum","sx":"M","s":"smith","g":5,"pa":["rognaldroisum","annehansdatter"],"sp":[],"ch":[],"b":["1861","Leikanger, Norway"],"r":"Brother of Joseph Rognaldsen Roisum","kf":{"Born":"1861, Leikanger, Norway","Confidence":"likely"},"f":["Born 1861 and baptized January 5, 1862 in Leikanger, son of Rognald Johnsen and Anne Hansdatter of Røisum (Digitalarkivet).","On the 1897 Hamlin County map \"Iver Roisum\" owns the NW quarter of Sec. 21, Norden township, on the south shore of Lake Norden, next to his brother Joe.","Mr. and Mrs. Iver Roisum were among the homesteaders who donated land for the Lake Norden townsite in 1907 (NRHP nomination for the Lake Norden bank)."],"src":["https://www.digitalarkivet.no/en/view/255/pd00000017788244","https://npgallery.nps.gov/GetAsset/2c61bbb4-b32c-478b-a857-1eca4812e07c","https://www.loc.gov/item/2012593118/"],"c":"likely","new":"Oct 11"},{"id":"andreasroisum","n":"Andreas Rognaldsen","sx":"M","s":"smith","g":5,"pa":["rognaldroisum","annehansdatter"],"sp":[],"ch":[],"b":["1864","Leikanger, Norway"],"r":"Brother of Joseph Rognaldsen Roisum","kf":{"Born":"1864, Leikanger, Norway","Confidence":"likely"},"f":["Baptized August 14, 1864 in Leikanger (Digitalarkivet)."],"src":["https://www.digitalarkivet.no/en/view/255/pd00000017788805"],"c":"likely","new":"Oct 11"},{"id":"bfrickenbach","n":"Benjamin Franklin Rickenbach","sx":"M","s":"kenoyer","g":4,"pa":["joelrick","salomelesh"],"sp":["marycolyer"],"ch":["herbertrickenbach","marydorothypettegrew","adalorenz","helenr"],"b":["29 Jun 1885","Port Royal, Juniata, Pennsylvania, USA"],"d":["10 Oct 1967",""],"bu":["","Hillside Cemetery, Oelrichs, Fall River, South Dakota, USA"],"r":"Peyton's 2nd great grandfather","kf":{"Spouse":"Mary (Colyer) Rickenbach","Born":"June 29, 1885, Port Royal, PA","Parents":"Joel and Salome (Lesh) Rickenbach","Married":"Mary Emma Colyer, April 19, 1905, Mifflintown, PA","Homesteaded":"Oelrichs, Fall River Co., SD, about 1912","Died":"October 10, 1967","Buried":"Hillside Cemetery, Oelrichs, SD"},"f":["Father of Helen Margaret (Rickenbach) Kenoyer. Living in Pittsburgh, Pennsylvania when Helen was born in 1910; about 1912 he moved the family to Oelrichs, Fall River County, South Dakota, \"where her father established a homestead\" (Helen's 2001 obituary).","Benjamin Franklin Rickenbach was born June 29, 1885 at Port Royal, Juniata County, Pennsylvania, the sixth of seven children of Civil War veteran Joel Rickenbach and Salome Lesh.","On April 19, 1905 he married Mary Emma Colyer at Mifflintown, the county seat; the marriage record names his parents as Joel and Salome.","The young couple were in Pittsburgh when Helen was born in 1910, then about 1912 went west to Oelrichs on the shortgrass south of the Black Hills and proved up a homestead. His brother Levi Orris and likely his sister Margaret took up land beside them.","The 1920 and 1930 censuses list the children Helen, Ada, William, Dorothy, Gerald and Herbert.","He died October 10, 1967, aged 82, and is buried at Hillside Cemetery in Oelrichs."],"src":["https://www.genlookups.com/sd/webbbs_config.pl/noframes/read/345","FamilySearch records (1850-1930 census, 1905 Mifflintown marriage, SSDI), searched Oct 12 2026","Find a Grave 21386794 (Joel Rickenbach)"],"c":"confirmed","new":"Oct 11"},{"id":"marycolyer","n":"Mary (Colyer) Rickenbach","sx":"F","s":"kenoyer","g":4,"pa":["williamcolyer","henriettab"],"sp":["bfrickenbach"],"ch":["herbertrickenbach","marydorothypettegrew","adalorenz","helenr"],"b":["10 May 1886","Juniata County, Pennsylvania, USA"],"d":["29 Nov 1960","Fall River County, South Dakota, USA"],"r":"Peyton's 2nd great grandmother","kf":{"Spouse":"Benjamin Franklin Rickenbach","Born":"May 10, 1886, Juniata Co., PA","Parents":"William H. Colyer and Henrietta Jane Boganreif","Married":"Benjamin F. Rickenbach, April 19, 1905, Mifflintown, PA","Died":"November 29, 1960, Fall River Co., SD"},"f":["Mother of Helen Margaret (Rickenbach) Kenoyer; named as \"Mary (Colyer) Rickenbach\" in Helen's 2001 obituary.","Mary Emma Colyer was born May 10, 1886 in Juniata County, Pennsylvania, to William H. Colyer and Henrietta Jane Boganreif of Thompsontown.","Her brothers were Herbert Edward (1882), Charles Cloyd (1884), William Nelson (1891) and Luther Roy (1894).","She married Benjamin Rickenbach at Mifflintown in 1905, and around 1912 traded the Juniata valley for a homestead claim at Oelrichs, South Dakota, where she raised six children.","She died November 29, 1960 in Fall River County."],"src":["https://www.genlookups.com/sd/webbbs_config.pl/noframes/read/345","WikiTree Colyer-634","FamilySearch records (1850-1930 census, 1905 Mifflintown marriage, SSDI), searched Oct 12 2026"],"c":"confirmed","new":"Oct 11"},{"id":"herbertrickenbach","n":"Herbert William Rickenbach","sx":"M","s":"kenoyer","g":3,"pa":["bfrickenbach","marycolyer"],"sp":[],"ch":[],"r":"Brother of Helen Margaret (Rickenbach) Kenoyer","kf":{"Confidence":"confirmed"},"f":["Brother of Helen Kenoyer; living in Chadron, Nebraska in 2001."],"src":["https://www.genlookups.com/sd/webbbs_config.pl/noframes/read/345"],"c":"confirmed","new":"Oct 11"},{"id":"marydorothypettegrew","n":"Mary Dorothy (Rickenbach) Pettegrew","sx":"F","s":"kenoyer","g":3,"pa":["bfrickenbach","marycolyer"],"sp":[],"ch":[],"r":"Sister of Helen Margaret (Rickenbach) Kenoyer","kf":{"Confidence":"confirmed"},"f":["Sister of Helen Kenoyer; living in Chadron, Nebraska in 2001."],"src":["https://www.genlookups.com/sd/webbbs_config.pl/noframes/read/345"],"c":"confirmed","new":"Oct 11"},{"id":"adalorenz","n":"Ada (Rickenbach) Lorenz","sx":"F","s":"kenoyer","g":3,"pa":["bfrickenbach","marycolyer"],"sp":[],"ch":[],"r":"Sister of Helen Margaret (Rickenbach) Kenoyer","kf":{"Confidence":"confirmed"},"f":["Sister of Helen Kenoyer; living in Hot Springs, SD in 2001."],"src":["https://www.genlookups.com/sd/webbbs_config.pl/noframes/read/345"],"c":"confirmed","new":"Oct 11"},{"id":"koski_arne","n":"Arne Alfanso Koski","sx":"M","s":"kenoyer","g":3,"pa":["nestor","ainam"],"sp":[],"ch":[],"r":"Brother of Arvo Nestor Koski","kf":{"Confidence":"likely"},"f":["Sibling of Arvo Nestor Koski, per WikiTree profile Koski-310 (cites the 1940 census)."],"src":["https://www.wikitree.com/wiki/Koski-310"],"c":"likely","new":"Oct 11"},{"id":"koski_alfred","n":"Alfred Arthur Koski","sx":"M","s":"kenoyer","g":3,"pa":["nestor","ai y Bludorn (Scott County census transcription, genealogytrails.com). Born about 1895, so he is likely Louisa Struss's son and Henry Bernard's brother."],"src":["http://www.genealogytrails.com/minn/scott/families_lenz.html"],"c":"likely","new":"Oct 11"},{"id":"laurabluedorn","n":"Laura Bluedorn","sx":"F","s":"tawni","g":3,"pa":["henryjb","louisas"],"sp":[],"ch":[],"b":["about 1905","Minnesota"],"r":"Sister of Henry Bernard Bludorn","kf":{"Born":"about 1905, Minnesota","Confidence":"likely"},"f":["Daughter, 15, in Henry Bludorn's Shakopee household in the 1920 census (genealogytrails.com). Born about 1905, so she is likely Louisa Struss's daughter."],"src":["http://www.genealogytrails.com/minn/scott/families_lenz.html"],"c":"likely","new":"Oct 11"},{"id":"johnskenoyer","n":"John Samuel Kenoyer","sx":"M","s":"kenoyer","g":4,"pa":["elliskenoyer","marthavoigt"],"sp":["norabelle"],"ch":["claris","marvinkenoyer"],"b":["1874",""],"d":["1952",""],"bu":["","Bear Butte Cemetery, Sturgis, SD"],"r":"Peyton's 2nd great grandfather","kf":{"Born":"1874","Died":"1952","Parents":"Ellis Benjamin Kenoyer and Martha (Johnson) Voigt","Wife":"Nora Belle White","Buried":"Bear Butte Cemetery, Sturgis, SD"},"f":["John Samuel Kenoyer, 1874 to 1952, father of Claris and grandfather of Steve. He married Nora Belle White and the family came to the Oelrichs and Sturgis country of the southern Black Hills. He rests at Bear Butte Cemetery in Sturgis, the same ground as his son Claris.","Per John Kenoyer (2026): sons included Claris and Marvin; Marvin was John's father. A family history was compiled in 1972 and copied again in 1983, and errors have spread from those copies."],"src":["Earlier family tree research notes","Phone call with John Kenoyer (Poway, CA), Oct 12 2026"],"c":"confirmed","new":"Oct 11"},{"id":"norabelle","n":"Nora Belle (White) Kenoyer","sx":"F","s":"kenoyer","g":4,"pa":["davidwhite","sarahwhite"],"sp":["johnskenoyer"],"ch":["claris","marvinkenoyer"],"b":["18 Feb 1880",""],"d":["25 Mar 1965",""],"bu":["","Bear Butte Cemetery, Sturgis, SD"],"r":"Peyton's 2nd great grandmother","kf":{"Born":"February 18, 1880","Died":"March 25, 1965","Parents":"David R. White and Sarah Ann (Long) White","Husband":"John Samuel Kenoyer","Buried":"Bear Butte Cemetery, Sturgis, SD"},"f":["Nora Belle White, born February 18, 1880, married John Samuel Kenoyer. Through her the tree gains the White and Long lines, English and Pennsylvania-German families who moved west through Missouri and Nebraska. She died March 25, 1965 and rests beside John at Bear Butte Cemetery."],"src":["Earlier family tree research notes"],"c":"confirmed","new":"Oct 11"},{"id":"elliskenoyer","n":"Ellis Benjamin Kenoyer","sx":"M","s":"kenoyer","g":5,"pa":["samuelkenoyer","sarahekenoyer"],"sp":["marthavoigt"],"ch":["johnskenoyer"],"b":["1849",""],"d":["1895",""],"r":"Peyton's 3rd great grandfather","kf":{"Born":"1849","Died":"1895","Parents":"Rev. Samuel Allen Kenoyer and Sarah Ellen Kenoyer","Wife":"Martha (Johnson) Voigt"},"f":["Ellis Benjamin Kenoyer, 1849 to 1895, died at only about 46. Son of a Methodist minister, he carried the Kenoyer line from Missouri toward the west."],"src":["Earlier family tree research notes"],"c":"confirmed","new":"Oct 11"},{"id":"marthavoigt","n":"Martha (Johnson) Kenoyer Voigt","sx":"F","s":"kenoyer","g":5,"pa":["jamesjohnson","elizabethjohnson"],"sp":["elliskenoyer"],"ch":["johnskenoyer"],"b":["1852",""],"d":["1942",""],"r":"Peyton's 3rd great grandmother","kf":{"Born":"1852","Died":"1942","Parents":"James Johnson and Elizabeth Jane (Butts) Johnson","Husband":"Ellis Benjamin Kenoyer","Obituary":"Black Hills Press, April 2, 1942"},"f":["Martha Johnson, 1852 to 1942, married Ellis Kenoyer and after his early death married a Voigt. Her 1942 obituary ran in the Black Hills Press. Through her the Johnson and Butts lines enter the tree.","Family story (Grandma Anna Kenoyer, 2026): after Ellis died in 1895 Martha was left with very little and built a house herself, \"with a butcher knife,\" likely a sod house, south of Newell, South Dakota.","Family story (unverified): the family also had a store in that area that later burned down, per cousin John Kenoyer."],"src":["Earlier family tree research notes","Phone call with Grandma Anna Kenoyer, Oct 12 2026"],"c":"confirmed","new":"Oct 11"},{"id":"samuelkenoyer","n":"Samuel Allen Kenoyer","sx":"M","s":"kenoyer","g":6,"pa":["michaelkenoyer","maryisabelle"],"sp":["sarahekenoyer"],"ch":["elliskenoyer"],"b":["1820",""],"d":["1892",""],"bu":["","Hanford Cemetery, California"],"r":"Peyton's 4th great grandfather","kf":{"Title":"Reverend, Methodist minister","Born":"1820","Died":"1892","Parents":"Michael Kenoyer and Mary Isabelle (Morgan) Kenoyer","Wife":"Sarah Ellen Kenoyer","Buried":"Hanford Cemetery, California"},"f":["Reverend Samuel Allen Kenoyer, 1820 to 1892, a Methodist minister. He married a woman also named Kenoyer and the family migrated west, ending in California where he is buried at Hanford. His father Michael was born in 1779."],"src":["Earlier family tree research notes"],"c":"confirmed","new":"Oct 11"},{"id":"sarahekenoyer","n":"Sarah Ellen (Kenoyer) Kenoyer","sx":"F","s":"kenoyer","g":6,"pa":["susannahkenoyer"],"sp":["samuelkenoyer"],"ch":["elliskenoyer"],"b":["1822",""],"d":["1898",""],"bu":["","South Bethel Cemetery, Missouri"],"r":"Peyton's 4th great grandmother","kf":{"Born":"1822","Died":"1898","Mother":"Susannah Kenoyer","Husband":"Rev. Samuel Allen Kenoyer","Buried":"South Bethel Cemetery, Missouri"},"f":["Sarah Ellen, 1822 to 1898, wife of Rev. Samuel Allen Kenoyer. She rests at South Bethel Cemetery, Missouri."],"src":["Earlier family tree research notes"],"c":"confirmed","new":"Oct 11"},{"id":"michaelkenoyer","n":"Michael Kenoyer","sx":"M","s":"kenoyer","g":7,"pa":["johannkenoyer"],"sp":["maryisabelle"],"ch":["samuelkenoyer"],"b":["1779",""],"d":["1854",""],"bu":["","Campground Cemetery, Missouri"],"r":"Peyton's 5th great grandfather","kf":{"Born":"1779","Died":"1854","Parents":"Johann Ulrich Kenoyer and Mary Isabelle Morgan","Wife":"Mary Isabelle 'Polly' Morgan","Buried":"Campground Cemetery, Missouri"},"f":["Michael Kenoyer, 1779 to 1854. His father was Johann Ulrich Kenoyer, the German immigrant who brought the name to America, which traces to the German Keinadt or Keinath, smoothed to Kenoyer. Michael moved the family to Missouri frontier country."],"src":["Earlier family tree research notes"],"c":"confirmed","new":"Oct 11"},{"id":"maryisabelle","n":"Mary Isabelle 'Polly' (Morgan) Kenoyer","sx":"F","s":"kenoyer","g":7,"pa":[],"sp":["michaelkenoyer"],"ch":["samuelkenoyer"],"b":["1791",""],"d":["1864",""],"r":"Peyton's 5th great grandmother","kf":{"Born":"1791","Died":"1864","Husband":"Michael Kenoyer"},"f":["Mary Isabelle Morgan, called Polly, 1791 to 1864, wife of Michael Kenoyer. Morgan is a Welsh name, adding another thread to the family."],"src":["Earlier family tree research notes"],"c":"confirmed","new":"Oct 11"},{"id":"johannkenoyer","n":"Johann Ulrich Kenoyer","sx":"M","s":"kenoyer","g":8,"pa":["leonhardgnarr","annabarbarakneyer"],"sp":[],"ch":["michaelkenoyer"],"b":["about 1758","Pennsylvania, USA"],"d":["Deceased",""],"r":"Peyton's 6th great grandfather","kf":{"Son":"Michael Kenoyer","Father":"Leonhard Gnärr/Kneyer","Origin":"York County, Pennsylvania"},"f":["Johann Ulrich Kneyer, who went by Ulrich, eldest son and heir of immigrant Leonhard Gnärr/Kneyer, born about 1758 in Pennsylvania. He served in the Codorus Militia in 1776 and in 1785 the York County Orphans Court granted him the family farm, Kneier's Valley. In 1790 he lived in Manheim Twp, York Co., with 7 sons. Early genealogists mistook him for a \"Rev. John Kenour\"; his sons and grandsons were preachers but he was not.","Per cousin John Kenoyer (2026): the early Kenoyers lived in York County, Pennsylvania, and he holds 1700s-era family papers and pictures from there."],"src":["Earlier family tree research notes","Phone call with John Kenoyer (Poway, C oyer","g":9,"pa":[],"sp":["annabarbarakneyer"],"ch":["johannkenoyer","kneyer_leonardjr","kneyer_frederick","kneyer_christian","kneyer_barbara","kneyer_catharine"],"b":["about 1725","Germany (probably Württemberg)"],"d":["bef 12 Apr 1783","Codorus Township, York, Pennsylvania, USA"],"bu":["1783","St. Jacob's (Old Stone) Union Church cemetery, Codorus Twp, York, Pennsylvania (unmarked)"],"r":"Peyton's 7th great-grandfather","kf":{"Immigrated":"27 Sep 1752, ship Anderson, Philadelphia","Home":"Kneier's Valley, Codorus Twp, York Co., PA","Role":"Immigrant founder of the Kenoyer line"},"f":["Arrived Philadelphia 27 Sep 1752 on the ship \"Anderson\" (Capt. Hugh Campbell) from Rotterdam via Portsmouth, signing the passenger list himself as Leonhardt GNÄRR, so he could read and write. Likely from a rural Württemberg village; the family were German-speaking Lutherans (\"Pennsylvania Dutch\").","Married Anna Barbara about 1753. By 1759 he was farming 130 acres along Codorus Creek next to St. Jacob's Old Stone Church, Codorus Township, York Co., PA, surveyed in 1774 as \"Kneier's Valley.\" His big barn was the only barn drawn on any colonial land map of York County, a landmark on the York-to-Baltimore road.","Served with son Ulrich in Capt. George Hoover's Company of Codorus Militia in 1776 (Revolution era).","Died without a will before 12 Apr 1783 (older records say 6 Mar 1782, likely a misread). Funeral preached by Rev. John Daniel Schroeter; almost certainly buried in an unmarked grave at St. Jacob's. His estate inventory lists a roan mare (his most valuable possession), 7 cows, 6 sheep, 3 beehives, 22 apple trees, a weaver's loom, shoemaker and smith tools, a Testament and books, and no weapons at all.","Earlier family genealogists started the line with a \"Rev. John Kenour\" and a three-brothers legend; researcher Ronald L. Silveira showed the real founder was Leonhard, and that \"John Kenour\" was his son Johann Ulrich. The name drifted Gnärr > Kneier > Kneyer > Knoyer > Kenoyer."],"src":["John Kenoyer genealogy reports emailed Oct 12 2026 (Modified Register for Claris Ervin Kenoyer; Leonhard Gnärr Individual & Scrapbook Reports)"],"c":"documented"},{"id":"annabarbarakneyer","n":"Anna Barbara Kneyer","sx":"F","s":"kenoyer","g":9,"pa":[],"sp":["leonhardgnarr"],"ch":["johannkenoyer","kneyer_leonardjr","kneyer_frederick","kneyer_christian","kneyer_barbara","kneyer_catharine"],"d":["after 1783","York, Pennsylvania, USA"],"r":"Peyton's 7th great-grandmother","f":["Wife of Leonhard from about 1753; probably born in America. Widowed 1783, she co-administered the estate with son Ulrich and signed the inventory with her X mark."],"src":["John Kenoyer genealogy reports emailed Oct 12 2026 (Modified Register for Claris Ervin Kenoyer; Leonhard Gnärr Individual & Scrapbook Reports)"],"c":"documented"},{"id":"kneyer_leonardjr","n":"Leonard Kneyer Jr.","sx":"M","s":"kenoyer","g":8,"pa":["leonhardgnarr","annabarbarakneyer"],"sp":[],"ch":[],"b":["1759","York County, Pennsylvania, USA"],"d":["Deceased",""],"r":"Peyton's 6th great-grand-uncle","f":["Born and baptized 1759 in York, PA; Revolutionary War service. Lived in York Twp in 1790."],"src":["John Kenoyer genealogy reports emailed Oct 12 2026 (Modified Register for Claris Ervin Kenoyer; Leonhard Gnärr Individual & Scrapbook Reports)"],"c":"documented"},{"id":"kneyer_frederick","n":"Frederick Kneier","sx":"M","s":"kenoyer","g":8,"pa":["leonhardgnarr","annabarbarakneyer"],"sp":[],"ch":[],"b":["about 1765","York County, Pennsylvania, USA"],"d":["Deceased",""],"r":"Peyton's 6th great-grand-uncle","f":["Third son; in Codorus Twp at the 1790 census."],"src":["John Kenoyer genealogy reports emailed Oct 12 2026 (Modified Register for Claris Ervin Kenoyer; Leonhard Gnärr Individual & Scrapbook Reports)"],"c":"documented"},{"id":"kneyer_christian","n":"Christian Kneyer","sx":"M","s":"kenoyer","g":8,"pa":["leonhardgnarr","annabarbarakneyer"],"sp":[],"ch":[],"b":["1 Jan 1766","York County, Pennsylvania, USA ,"sp":[],"ch":[],"b":["19 Nov 1882","Pennsylvania, USA"],"d":["1961",""],"r":"Helen's uncle","f":["Benjamin's older brother Levi Orris Rickenbach also went west to Oelrichs and received homestead patents there in 1915 and 1922 (BLM SDRC 0026549, 0038280). His ranch north of Oelrichs stayed in Rickenbach hands for decades."],"src":["Find a Grave 21386794","BLM GLO land patents"],"c":"confirmed"},{"id":"williamcolyer","n":"William H. Colyer","sx":"M","s":"kenoyer","g":5,"pa":["amoscolyer","maryanncolyer"],"sp":["henriettab"],"ch":["marycolyer"],"b":["30 Nov 1860","Juniata County, Pennsylvania, USA"],"d":["26 Jul 1945","Thompsontown, Juniata, Pennsylvania, USA"],"bu":["","Emmanuel Lutheran Cemetery, Thompsontown, Juniata, Pennsylvania, USA"],"r":"Peyton's 3rd great grandfather","kf":{"Born":"November 30, 1860, Juniata Co., PA","Parents":"Amos and Mary Ann Colyer","Wife":"Henrietta Jane Boganreif, married 1880","Died":"July 26, 1945, Thompsontown, PA"},"f":["William H. Colyer was born November 30, 1860 in Juniata County, son of the Union veteran Amos Colyer.","He married Henrietta Jane Boganreif about 1880 and raised five children near Thompsontown: Herbert, Charles, Mary (Peyton's line), William and Luther.","He died July 26, 1945 and is buried with Henrietta at Emmanuel Lutheran Church, Thompsontown."],"src":["Emmanuel Lutheran Cemetery transcription, Thompsontown (USGenWeb)","WikiTree Colyer-595"],"c":"confirmed"},{"id":"henriettab","n":"Henrietta Jane (Boganreif) Colyer","sx":"F","s":"kenoyer","g":5,"pa":["henrybog","marybog"],"sp":["williamcolyer"],"ch":["marycolyer"],"b":["28 Jul 1857","Union County, Pennsylvania, USA"],"d":["31 May 1935","Thompsontown, Juniata, Pennsylvania, USA"],"bu":["","Emmanuel Lutheran Cemetery, Thompsontown, Juniata, Pennsylvania, USA"],"r":"Peyton's 3rd great grandmother","f":["Henrietta Jane Boganreif was born July 28, 1857 in Union County, Pennsylvania, daughter of Henry E. and Mary Bogenreif; her brothers John Calvin and George Oscar a en between 1866 and 1889; Aina was born when she was 42."],"src":["Riksarkivet (Swedish National Archives): 1870/1890/1900 census and Hietaniemi birth book C:5, 1887"],"c":"confirmed"}],"unplaced":[{"name":"Logan Smith","relation":"Grandson of Charles & Joanne; died before Joanne (2022)","note":"Parent not identified","sources":["https://www.geisefuneralhome.com/obituary/charles-smith","https://www.geisefuneralhome.com/obituary/audrey-smith"]},{"name":"Laurel Smith","relation":"Granddaughter of Charles & Joanne; died before Joanne (2022)","note":"Parent not identified. Different person from Laurel Joanne Massie (b. 2026).","sources":["https://www.geisefuneralhome.com/obituary/charles-smith","https://www.geisefuneralhome.com/obituary/audrey-smith"]},{"name":"Arynn Smith and Arika Smith","relation":"Cousins of Trenton Monty Smith who died before 2022, so grandchildren of one of Scott's siblings or of June's side","note":"Parents not identified","sources":["https://www.geisefuneralhome.com/obituaries/trenton-smith"]},{"name":"Llora Fitzgerald","relation":"Granddaughter of Donald Smith; died before 2008. Probably Velva (Smith) Fitzgerald's daughter (inferred from the surname)","note":"Not linked","sources":["https://www.madisondailyleader.com/obituaries/archives/article_1a8d43a6-93c8-57f4-abd6-796bce2dc2c4.html"]}]};
const P = {}; DATA.people.forEach(p => P[p.id] = p);
const SIDES = [["core","Your family"],["smith","Smith"],["kenoyer","Kenoyer"],["tawni","Tawni's"],["all","All"]];
const SIDE_COLOR = {core:"var(--core)",smith:"var(--smith)",kenoyer:"var(--kenoyer)",tawni:"var(--tawni)"};
const SIDE_NAME = {core:"Your family",smith:"Smith side",kenoyer:"Kenoyer side",tawni:"Tawni's side"};
const GEN_NAME = g => ({"-2":"Grandkids' gen","-1":"Kids' gen",0:"Your gen",1:"Parents' gen",2:"Grandparents' gen",3:"Great-grandparents' gen"})[g] ?? (g>3 ? `${g-2}× great-grandparents' gen` : `Gen ${g}`);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GEN_SHORT = g => ({"-2":"Grandkids","-1":"Kids",0:"You",1:"Parents",2:"Grandparents",3:"Great-GP"})[g] ?? (g>3 ? `${g-2}× Great-GP` : `Gen ${g}`);
const gk = g => g === 0 ? 0 : g < 0 ? -g + 0.5 : g;
const yr = d => { const m = d && String(d).match(/(\d{4})/); return m ? m[1] : ""; };
const yl = d => { const y = yr(d); if (!y) return ""; return /^before/i.test(d) ? "bef. " + y : /^abt/i.test(d) ? "c. " + y : y; };
const life = p => { const b = yl(p.b && p.b[0]), d = yl(p.d && p.d[0]); if (!b && !d) return ""; if (!b) return "d. " + d; return d ? `${b}–${d}` : `b. ${b}`; };
const birthSort = p => +(yr(p.b && p.b[0]) || 9999);
let state = { side: "core", gen: "all", q: "" };
let stack = [];

function inSide(p, s) { return s === "all" || p.s === s || (p.as || []).includes(s); }
function parentsLine(p) {
  const n = p.pa.map(id => P[id]).filter(Boolean).map(x => x.n.split(" ")[0]);
  return n.length ? "Child of " + n.join(" & ") : "";
}
function rowHTML(p, extra) {
  const meta = [life(p), extra ?? (p.r || parentsLine(p))].filter(Boolean).join(" · ");
  return `<button class="row" data-id="${p.id}"><span class="bar" style="background:${SIDE_COLOR[p.s]}"></span>
  <span class="rc"><div class="nm">${esc(p.n)}${p.new ? '<span class="dot" title="Added ${p.new}, 2026"></span>' : ""}</div>
  <div class="meta">${esc(meta)}</div></span><span class="chev">›</span></button>`;
}
function renderChips() {
  document.getElementById("sides").innerHTML = SIDES.map(([k, l]) =>
    `<button class="chip ${state.side === k ? "on" : ""}" data-side="${k}">${l}</button>`).join("");
  const gens = [...new Set(DATA.people.filter(p => inSide(p, state.side)).map(p => p.g))].sort((a, b) => gk(a) - gk(b));
  document.getElementById("gens").innerHTML = `<button class="chip small ${state.gen === "all" ? "on" : ""}" data-gen="all">All</button>` +
    gens.map(g => `<button class="chip small ${String(state.gen) === String(g) ? "on" : ""}" data-gen="${g}">${GEN_SHORT(g)}</button>`).join("");
  document.getElementById("gens").style.display = state.q ? "none" : "flex";
}
function renderList() {
  renderChips();
  const el = document.getElementById("list");
  const q = state.q.trim().toLowerCase();
  if (q) {
    const terms = q.split(/\s+/);
    const hits = DATA.people.filter(p => terms.every(t => p.n.toLowerCase().includes(t)))
      .sort((a, b) => a.n.localeCompare(b.n));
    el.innerHTML = `<div class="gh">${hits.length} match${hits.length === 1 ? "" : "es"}</div>` +
      (hits.map(p => rowHTML(p, SIDE_NAME[p.s] + (p.r ? " · " + p.r : ""))).join("") || `<div class="empty">No one by that name.</div>`);
    return;
  }
  let ps = DATA.people.filter(p => inSide(p, state.side) && (state.gen === "all" || String(p.g) === String(state.gen)));
  const groups = {};
  ps.forEach(p => (groups[p.g] = groups[p.g] || []).push(p));
  el.innerHTML = Object.keys(groups).map(Number).sort((a, b) => gk(a) - gk(b)).map(g => {
    const arr = groups[g].sort((a, b) => birthSort(a) - birthSort(b) || a.n.localeCompare(b.n));
    // Peyton first in his generation
    arr.sort((a, b) => (b.id === DATA.root) - (a.id === DATA.root));
    return `<div class="gh">${GEN_NAME(g)} · ${arr.length}</div>` + arr.map(p => rowHTML(p)).join("");
  }).join("") || `<div class="empty">No one here.</div>`;
}
function ev(label, v) {
  if (!v) return "";
  return `<div><b>${label}</b>${esc([v[0], v[1]].filter(Boolean).join(" · "))}</div>`;
}
function linkList(ids, extraFn) {
  const arr = ids.map(id => P[id]).filter(Boolean);
  return arr.map(p => rowHTML(p, extraFn ? extraFn(p) : undefined)).join("");
}
function siblingsOf(p) {
  const s = new Set();
  p.pa.forEach(id => (P[id] ? P[id].ch : []).forEach(c => c !== p.id && s.add(c)));
  return [...s].sort((a, b) => birthSort(P[a]) - birthSort(P[b]));
}
function renderPerson(id) {
  const p = P[id]; if (!p) return;
  const sib = siblingsOf(p);
  const kids = [...p.ch].sort((a, b) => birthSort(P[a]) - birthSort(P[b]));
  const tags = [`<span class="tag" style="background:none;border:1px solid ${SIDE_COLOR[p.s]};color:${SIDE_COLOR[p.s]}">${SIDE_NAME[p.s]}</span>`];
  if (p.r) tags.push(`<span class="tag">${esc(p.r)}</span>`);
  tags.push(`<span class="tag">${GEN_NAME(p.g)}</span>`);
  if (p.new) tags.push(`<span class="tag" style="background:#fbefd8;color:var(--new)">Added ${p.new}</span>`);
  if (p.upd) tags.push(`<span class="tag" style="background:#e3f0e6;color:#2f6b3f">Updated Oct 11</span>`);
  const kf = p.kf ? Object.entries(p.kf).filter(([k]) => !["Born", "Died"].includes(k)) : [];
  let h = `<div class="pname">${esc(p.n)}</div><div class="sub">${esc(life(p))}</div>
  <div class="tags">${tags.join("")}</div>
  <div class="nav3">
    <a href="#sec-par" class="${p.pa.length ? "" : "dis"}">Parents (${p.pa.length})</a>
    <a href="#sec-sp" class="${p.sp.length ? "" : "dis"}">Spouse${p.sp.length > 1 ? "s" : ""} (${p.sp.length})</a>
    <a href="#sec-kids" class="${kids.length ? "" : "dis"}">Kids (${kids.length})</a>
  </div>`;
  const facts = [ev("Born", p.b), ev("Died", p.d), ev("Buried", p.bu)].join("") +
    kf.map(([k, v]) => `<div><b>${esc(k)}</b>${esc(v)}</div>`).join("");
  if (facts) h += `<div class="sec"><div class="kv">${facts}</div></div>`;
  if (p.f && p.f.length) h += `<div class="sec"><h3>Life story</h3><ul class="facts">${p.f.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>`;
  if (p.no) h += `<div class="sec"><h3>Notes</h3><div>${esc(p.no)}</div></div>`;
  if (p.pa.length) h += `<div class="sec" id="sec-par"><h3>Parents</h3>${linkList(p.pa)}</div>`;
  if (p.sp.length) h += `<div class="sec" id="sec-sp"><h3>Spouse${p.sp.length > 1 ? "s" : ""}</h3>${linkList(p.sp)}</div>`;
  if (kids.length) h += `<div class="sec" id="sec-kids"><h3>Kids (${kids.length})</h3>${linkList(kids, k => [k.sp.length ? "m. " + k.sp.map(s => P[s] ? P[s].n : "").join(", ") : "", k.ch.length ? k.ch.length + " kids" : ""].filter(Boolean).join(" · "))}</div>`;
  if (sib.length) h += `<div class="sec"><h3>Siblings (${sib.length})</h3>${linkList(sib, s => "")}</div>`;
  if (p.c) h += `<div class="conf">Confidence: <b>${esc(p.c)}</b>${p.c === "likely" ? " — fits the records but not named directly; worth confirming." : p.c === "possible" ? " — a lead only; not yet proven." : " — named in a cited record."}</div>`;
  if (p.src && p.src.length) h += `<div class="sec"><h3>Sources</h3><div class="srcs">${p.src.map(s => /^https?:\/\//.test(s) ? `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(s.replace(/^https?:\/\/(www\.)?/, ""))}</a>` : `<span>${esc(s)}</span>`).join("")}</div></div>`;
  const body = document.getElementById("sbody");
  body.innerHTML = h;
  body.querySelectorAll(".nav3 a").forEach(a => a.onclick = e => { e.preventDefault(); const t = body.querySelector(a.getAttribute("href")); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); });
  const sh = document.getElementById("sheet");
  sh.classList.add("open"); sh.setAttribute("aria-hidden", "false"); sh.scrollTop = 0;
  document.getElementById("back").style.visibility = stack.length > 1 ? "visible" : "hidden";
  document.title = p.n + " · Smith Family Tree";
}
function openP(id, push = true) {
  if (!P[id]) return;
  stack.push(id);
  if (push) history.pushState({ id }, "", "#p=" + id);
  renderPerson(id);
}
function closeSheet(push = true) {
  stack = [];
  const sh = document.getElementById("sheet");
  sh.classList.remove("open"); sh.setAttribute("aria-hidden", "true");
  document.title = "Smith Family Tree";
  if (push) history.pushState({}, "", location.pathname + location.search);
}
document.addEventListener("click", e => {
  const r = e.target.closest(".row"); if (r) { openP(r.dataset.id); return; }
  const s = e.target.closest("[data-side]"); if (s) { state.side = s.dataset.side; state.gen = "all"; renderList(); return; }
  const g = e.target.closest("[data-gen]"); if (g) { state.gen = g.dataset.gen; renderList(); }
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; renderList(); });
document.getElementById("close").onclick = () => closeSheet();
document.getElementById("home").onclick = () => openP(DATA.root);
document.getElementById("back").onclick = () => history.back();
window.addEventListener("popstate", () => {
  const m = location.hash.match(/^#p=(.+)$/);
  if (m && P[m[1]]) { stack.pop(); if (stack[stack.length - 1] !== m[1]) stack.push(m[1]); renderPerson(m[1]); }
  else closeSheet(false);
});
const nNew = DATA.people.filter(p => p.new).length;
document.getElementById("foot").innerHTML = `${DATA.people.length} people · ${nNew} added Oct 10, 2026 (marked with a dot). ` +
  (DATA.unplaced.length ? `Not yet placed: ${DATA.unplaced.map(u => esc(u.name)).join(", ")}.` : "");
renderList();
const m0 = location.hash.match(/^#p=(.+)$/);
if (m0 && P[m0[1]]) { history.replaceState({}, "", location.pathname + location.search); openP(m0[1]); }
</script>
</body>
